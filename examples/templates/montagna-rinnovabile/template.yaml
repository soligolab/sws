id: montagna-rinnovabile
label: "Montagna — fotovoltaico e idroelettrico"
description: "Pensiline fotovoltaiche, una piccola centrale idroelettrica e il villaggio che servono, su tre foto della valle che si danno il cambio in dissolvenza con l'ora simulata. Due pagine dello stesso impianto, composte dall'assistente IA con due modelli diversi (Opus 5.5 e Kimi K3.1 Pro). Una terza pagina, un lago alpino, ha un cursore giorno/notte che fa la dissolvenza fra due foto. Tutti i valori si muovono da soli."
