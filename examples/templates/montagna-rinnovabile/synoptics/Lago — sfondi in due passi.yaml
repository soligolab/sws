# Gli sfondi della prova vera di F6 (04-11-2026): una base del giorno e la sua variante «sera»,
# fatta modificando la base. Il rifugio resta nello stesso punto, e la dissolvenza è pulita.
# Il cursore in basso (c.giorno_notte, 0..100) porta la foto del giorno da trasparente a piena.
# Con la cornice (regola R6) le foto stanno fra testata e piede, da y 56 a 740, sempre in
# `cover`: la scala resta 0,833 e il rifugio sale di 2 px soltanto.
