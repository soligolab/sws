id: quadro
name: Quadro
width: 1280.0
height: 800.0
background: '#0f172a'
objects:
- { id: hdr_bg, type: rect, x: 0.0, y: 0.0, width: 1280.0, height: 56.0, fill: '#1e293b' }
- { id: hdr_title, type: text, x: 24.0, y: 16.0, text: "{{t0001}}", font_size: 20.0, color: '#e2e8f0' }
- { id: nota, type: text, x: 24.0, y: 72.0, width: 1230.0, height: 18.0, text: "{{t0002}}", font_size: 12.0, color: '#94a3b8' }

# ── Bottoni: una modalità per bottone ──
- { id: lbl_bottoni, type: text, x: 40.0, y: 120.0, text: "{{t0003}}", font_size: 13.0, font_weight: 700, color: '#93c5fd' }
- { id: btn_marcia, type: button, x: 40.0, y: 150.0, width: 240.0, height: 56.0, label: "{{t0004}}", tag: pompa.marcia, button_mode: toggle }
- { id: btn_prova, type: button, x: 40.0, y: 222.0, width: 240.0, height: 56.0, label: "{{t0005}}", tag: pompa.prova, button_mode: momentary, write_value: true, release_value: false }
- { id: btn_piu, type: button, x: 40.0, y: 294.0, width: 115.0, height: 56.0, label: "{{t0006}}", tag: pompa.velocita, button_mode: increment, step: 10.0, min: 0.0, max: 100.0 }
- { id: btn_meno, type: button, x: 165.0, y: 294.0, width: 115.0, height: 56.0, label: "{{t0007}}", tag: pompa.velocita, button_mode: decrement, step: 10.0, min: 0.0, max: 100.0 }
- { id: btn_zero, type: button, x: 40.0, y: 366.0, width: 240.0, height: 56.0, label: "{{t0008}}", tag: pompa.velocita, button_mode: reset, release_value: 0 }
- { id: lbl_velocita, type: text, x: 40.0, y: 446.0, text: "{{t0009}}", font_size: 13.0, color: '#94a3b8' }
- { id: bar_velocita, type: progress_bar, x: 40.0, y: 470.0, width: 240.0, height: 22.0, tag: pompa.velocita, min: 0.0, max: 100.0 }
- { id: val_velocita, type: text, x: 40.0, y: 502.0, tag: pompa.velocita, format: "{value} %", font_size: 18.0, color: '#e2e8f0' }

# ── Simboli che comandano: il disegno è il pulsante ──
- { id: lbl_simboli, type: text, x: 360.0, y: 120.0, text: "{{t0010}}", font_size: 13.0, font_weight: 700, color: '#93c5fd' }
- { id: sim_interruttore, type: symbol, x: 395.0, y: 160.0, width: 90.0, height: 162.0, symbol_id: "lib:electrical/circuit-breaker",
    state_tag: pompa.marcia, symbol_parts: { lever: { tag: pompa.marcia } }, command_tag: pompa.marcia, button_mode: toggle }
- { id: lbl_interruttore, type: text, x: 360.0, y: 352.0, width: 170.0, text: "{{t0011}}", font_size: 12.0, color: '#cbd5e1' }
- { id: sim_valvola, type: symbol, x: 590.0, y: 180.0, width: 120.0, height: 140.0, symbol_id: "lib:process/ball-valve",
    state_tag: valvola.aperta, symbol_parts: { lever: { tag: valvola.aperta } }, command_tag: valvola.aperta, button_mode: toggle }
- { id: lbl_valvola, type: text, x: 570.0, y: 352.0, width: 170.0, text: "{{t0012}}", font_size: 12.0, color: '#cbd5e1' }
- { id: sim_pulsantiera, type: symbol, x: 805.0, y: 160.0, width: 90.0, height: 180.0, symbol_id: "lib:electrical/push-button-station",
    state_tag: pompa.prova, command_tag: pompa.prova, button_mode: momentary, write_value: true, release_value: false }
- { id: lbl_pulsantiera, type: text, x: 780.0, y: 352.0, width: 170.0, text: "{{t0013}}", font_size: 12.0, color: '#cbd5e1' }
- { id: sim_pompa, type: symbol, x: 975.0, y: 180.0, width: 150.0, height: 150.0, symbol_id: "lib:process/centrifugal-pump",
    state_tag: pompa.marcia, symbol_spin: on_state }
- { id: lbl_pompa, type: text, x: 985.0, y: 352.0, width: 170.0, text: "{{t0014}}", font_size: 12.0, color: '#cbd5e1' }
# La mandata della pompa (15-10-2026): tubo 2.5D agganciato alla bocca, col
# flusso quando la pompa è in marcia.
- { id: tubo_mandata, type: pipe, x: 0, y: 0, pipe_style: metallo, routing: orthogonal, from_obj_id: sim_pompa, from_port: n-top,
    pipe_flow: true, pipe_flow_tag: pompa.marcia, fill_color: '#7dd3fc', points: [{ x: 0, y: 0 }, { x: 1240, y: 150 }] }

# ── Modo impianto: assegnazioni, più variabili con un tocco ──
- { id: lbl_modo, type: text, x: 360.0, y: 440.0, text: "{{t0015}}", font_size: 13.0, font_weight: 700, color: '#93c5fd' }
- { id: btn_spento, type: button, x: 360.0, y: 470.0, width: 180.0, height: 56.0, label: "{{t0016}}",
    assegnazioni: [ { tag: impianto.modo, valore: 0 }, { tag: pompa.marcia, valore: false } ] }
- { id: btn_manuale, type: button, x: 560.0, y: 470.0, width: 180.0, height: 56.0, label: "{{t0017}}",
    assegnazioni: [ { tag: impianto.modo, valore: 1 } ] }
- { id: btn_auto, type: button, x: 760.0, y: 470.0, width: 180.0, height: 56.0, label: "{{t0018}}",
    assegnazioni: [ { tag: impianto.modo, valore: 2 }, { tag: pompa.marcia, valore: true }, { tag: valvola.aperta, valore: true } ] }
- { id: stato_modo, type: text_list, x: 360.0, y: 546.0, width: 580.0, height: 40.0, tag: impianto.modo,
    text_list_default: "{{t0021}}", text_list_default_color: '#64748b',
    text_list_entries: [ { value: "0", label: "{{t0016}}", color: '#94a3b8' }, { value: "1", label: "{{t0017}}", color: '#f59e0b' }, { value: "2", label: "{{t0018}}", color: '#22c55e' } ] }
- { id: sim_faro, type: symbol, x: 1000.0, y: 450.0, width: 100.0, height: 140.0, symbol_id: "lib:machines/beacon",
    state_tag: pompa.marcia, symbol_parts: { lamp: { tag: pompa.marcia } },
    assegnazioni: [ { tag: pompa.marcia, valore: false }, { tag: impianto.modo, valore: 0 }, { tag: valvola.aperta, valore: false } ],
    require_confirm: true, confirm_message: "{{t0020}}" }
- { id: lbl_faro, type: text, x: 960.0, y: 604.0, width: 200.0, text: "{{t0019}}", font_size: 12.0, color: '#cbd5e1' }
