  - key: t0002
    values:
      it: 'Il modulo I/O del PLX800 letto dalla memoria condivisa del sistema: ingressi, DIP, uscite comandabili e lo stato della scheda. Le uscite si comandano solo se nessun altro programma (LogicLab, CODESYS, OpenPLC) pilota già il modulo.'
      en: 'The PLX800 I/O module read from the system shared memory: inputs, DIP switches, commandable outputs and the board state. Outputs are commanded only if no other program (LogicLab, CODESYS, OpenPLC) is already driving the module.'
      es: 'El módulo de E/S del PLX800 leído de la memoria compartida del sistema: entradas, DIP, salidas mandables y el estado de la tarjeta. Las salidas se mandan solo si ningún otro programa (LogicLab, CODESYS, OpenPLC) controla ya el módulo.'
