# La cornice comune alle sei pagine (17-10-2026). In testata l'ora e la data
# del pannello, la sua identità e il nome della pagina; nel piede il
# navigatore delle pagine (R6, 04-11-2026), che prima ogni pagina ripeteva.
#
# Il titolo è `{{pagina.nome}}`: i nomi delle pagine sono token della tabella
# lingue, quindi il titolo si traduce anche qui e la pagina non lo ripete più.
# L'ora e la data sono oggetti «Data e ora» (`clock`), nel fuso del pannello.
#
# Tutti i testi hanno un riquadro (`width`/`height`, `text_valign: middle`):
# un testo senza riquadro ha `y` sulla linea di base nel viewer web e sul
# bordo alto sul pannello LVGL, e i due motori lo mettevano a una riga di
# distanza — l'ora, nel web, finiva sopra il bordo della pagina.
id: testata
nome: Testata
larghezza: 1280
altezza: 800
testata:
  altezza: 92
  sfondo: '#1e293b'
piede:
  altezza: 60
  sfondo: '#1e293b'
oggetti:
- id: hdr_ora
  type: clock
  x: 14.0
  y: 6.0
  width: 176.0
  height: 46.0
  clock_formato: ora
  clock_secondi: true
  font_size: 34.0
  text_anchor: start
  color: '#e2e8f0'
- id: hdr_data
  type: clock
  x: 14.0
  y: 54.0
  width: 176.0
  height: 26.0
  clock_formato: data
  font_size: 14.0
  text_anchor: start
  color: '#94a3b8'
- id: hdr_sep
  type: rect
  x: 196.0
  y: 14.0
  width: 1.0
  height: 64.0
  fill: '#334155'
- id: hdr_l0
  type: text
  x: 220.0
  y: 16.0
  width: 180.0
  height: 20.0
  text_wrap: true
  text_valign: middle
  text: '{{t0009}}'
  font_size: 12.0
  color: '#94a3b8'
- id: hdr_v0
  type: text
  x: 220.0
  y: 38.0
  width: 180.0
  height: 30.0
  text_wrap: true
  text_valign: middle
  tag: tc620.modello
  format: '{value}'
  font_size: 17.0
  color: '#e2e8f0'
- id: hdr_l1
  type: text
  x: 410.0
  y: 16.0
  width: 180.0
  height: 20.0
  text_wrap: true
  text_valign: middle
  text: '{{t0010}}'
  font_size: 12.0
  color: '#94a3b8'
- id: hdr_v1
  type: text
  x: 410.0
  y: 38.0
  width: 180.0
  height: 30.0
  text_wrap: true
  text_valign: middle
  tag: tc620.numero_serie
  format: '{value}'
  font_size: 17.0
  color: '#e2e8f0'
- id: hdr_l2
  type: text
  x: 600.0
  y: 16.0
  width: 180.0
  height: 20.0
  text_wrap: true
  text_valign: middle
  text: '{{t0011}}'
  font_size: 12.0
  color: '#94a3b8'
- id: hdr_v2
  type: text
  x: 600.0
  y: 38.0
  width: 180.0
  height: 30.0
  text_wrap: true
  text_valign: middle
  tag: tc620.hostname
  format: '{value}'
  font_size: 17.0
  color: '#e2e8f0'
- id: hdr_l3
  type: text
  x: 790.0
  y: 16.0
  width: 180.0
  height: 20.0
  text_wrap: true
  text_valign: middle
  text: '{{t0012}}'
  font_size: 12.0
  color: '#94a3b8'
- id: hdr_v3
  type: text
  x: 790.0
  y: 38.0
  width: 180.0
  height: 30.0
  text_wrap: true
  text_valign: middle
  tag: tc620.uptime_s
  format: '{value:dhms}'
  font_size: 17.0
  color: '#e2e8f0'
- id: hdr_titolo
  type: text
  x: 980.0
  y: 0.0
  width: 280.0
  height: 92.0
  text_wrap: true
  text_valign: middle
  text: '{{pagina.nome}}'
  font_size: 24.0
  text_anchor: end
  color: '#e2e8f0'
- id: nav
  type: page_navigator
  x: 20.0
  y: 750.0
  width: 1240.0
  height: 40.0
  nav_orientation: horizontal
  nav_fill: true
  nav_gap: 6
  font_size: 13.0
  nav_active_fill: '#38bdf8'
  nav_active_color: '#0f172a'
