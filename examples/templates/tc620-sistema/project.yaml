# TC620 — sistema (03-10-2026).
#
# Un esempio di **tipo struttura**: la variabile `tc620` è un'istanza del tipo
# `host`, che raccoglie tutto ciò che il protocollo Host legge da un TC620
# (CPU e core, carico, memoria, temperature, dischi, rete, identità). Le
# mappature della sorgente puntano alle **foglie** (`tc620.core_pct[3]`,
# `tc620.disco_progetti.libero_gb`), e i tipi `disco` e `interfaccia_rete`
# mostrano i membri annidati.
#
# I parametri (zone termiche, mount, interfacce) sono quelli che il catalogo
# Host di un TC620 riporta: su un altro dispositivo si leggono da Configurazione
# → Sorgenti → Host, e una foglia senza parametro valido resta Bad.
#
# L'orologio in testata è un'espressione Python (`time.strftime`) in ora locale
# del pannello; si ricalcola a ogni aggiornamento di un tag, cioè ogni secondo
# col polling Host a 1000 ms.
meta:
  name: tc620-sistema
  version: 1.0.0
target:
  kind: lvgl_framebuffer
types:
- id: disco
  description: Un punto di montaggio del pannello (protocollo Host)
  members:
  - name: usato_pct
    description: Spazio usato
    data_type: f32
    unit: '%'
    decimals: 1
    range_lo: 0.0
    range_hi: 100.0
    history_min_interval_ms: 10000
  - name: libero_gb
    description: Spazio libero
    data_type: f64
    unit: GB
    decimals: 2
    history_min_interval_ms: 10000
- id: interfaccia_rete
  description: Il traffico di un'interfaccia di rete del pannello (protocollo Host)
  members:
  - name: rx_bps
    description: Byte al secondo ricevuti
    data_type: f64
    unit: B/s
    decimals: 0
    history_min_interval_ms: 10000
  - name: tx_bps
    description: Byte al secondo trasmessi
    data_type: f64
    unit: B/s
    decimals: 0
    history_min_interval_ms: 10000
- id: host
  description: Tutto ciò che il protocollo Host legge da un TC620 — CPU, memoria, temperature, dischi, rete, identità
  members:
  - name: cpu_pct
    description: Utilizzo CPU totale
    data_type: f32
    unit: '%'
    decimals: 1
    range_lo: 0.0
    range_hi: 100.0
    history_min_interval_ms: 10000
  - name: core_pct
    description: Utilizzo di ogni core (il TC620 ne ha 6)
    data_type: f32
    array:
    - 6
    unit: '%'
    decimals: 1
    range_lo: 0.0
    range_hi: 100.0
    history_min_interval_ms: 10000
  - name: carico_1m
    description: Carico medio a 1 minuto
    data_type: f32
    decimals: 2
    history_min_interval_ms: 10000
  - name: carico_5m
    description: Carico medio a 5 minuti
    data_type: f32
    decimals: 2
    history_min_interval_ms: 10000
  - name: carico_15m
    description: Carico medio a 15 minuti
    data_type: f32
    decimals: 2
    history_min_interval_ms: 10000
  - name: ram_usata_pct
    description: Memoria usata
    data_type: f32
    unit: '%'
    decimals: 1
    range_lo: 0.0
    range_hi: 100.0
    history_min_interval_ms: 10000
  - name: ram_usata_mb
    description: Memoria usata
    data_type: f64
    unit: MB
    decimals: 0
    history_min_interval_ms: 10000
  - name: ram_disponibile_mb
    description: Memoria disponibile
    data_type: f64
    unit: MB
    decimals: 0
    history_min_interval_ms: 10000
  - name: ram_totale_mb
    description: Memoria totale
    data_type: f64
    unit: MB
    decimals: 0
    history_min_interval_ms: 10000
  - name: swap_usata_pct
    description: Swap usata
    data_type: f32
    unit: '%'
    decimals: 1
    history_min_interval_ms: 10000
  - name: temperatura_cpu
    description: Zona termica cpu-thermal
    data_type: f32
    unit: °C
    decimals: 1
    history_min_interval_ms: 10000
  - name: temperatura_gpu
    description: Zona termica gpu-thermal
    data_type: f32
    unit: °C
    decimals: 1
    history_min_interval_ms: 10000
  - name: temperatura_mule_1
    description: Sensore hwmon mule/temp1
    data_type: f32
    unit: °C
    decimals: 1
    history_min_interval_ms: 10000
  - name: temperatura_mule_2
    description: Sensore hwmon mule/temp2
    data_type: f32
    unit: °C
    decimals: 1
    history_min_interval_ms: 10000
  - name: disco_sistema
    description: Il disco di sistema (/)
    type_ref: disco
  - name: disco_progetti
    description: Il disco dei progetti (/var/sws/projects)
    type_ref: disco
  - name: ethernet0
    type_ref: interfaccia_rete
  - name: ethernet1
    type_ref: interfaccia_rete
  - name: uptime_s
    description: Da quanto è acceso il pannello
    data_type: u64
    unit: s
    history_min_interval_ms: 60000
  - name: hostname
    description: Nome di rete del pannello
    data_type: string
    history: false
  - name: numero_serie
    description: Numero di serie della scheda (device-tree)
    data_type: string
    history: false
  - name: modello
    description: Modello della scheda
    data_type: string
    history: false
tags:
- id: tc620
  description: Il pannello stesso, letto dal protocollo Host
  type_ref: host
  history: true
- id: orologio.ora
  data_type: string
  description: Ora locale del pannello (HH:MM:SS)
  expression: 'import time

    time.strftime(''%H:%M:%S'')'
- id: orologio.data
  data_type: string
  description: Data locale del pannello (GG/MM/AAAA)
  expression: 'import time

    time.strftime(''%d/%m/%Y'')'
sources:
- kind: host
  id: host-tc620
  poll_interval_ms: 1000
  metrics:
  - tag: tc620.cpu_pct
    metric: cpu_pct
  - tag: tc620.core_pct[0]
    metric: cpu_core_pct
    param: '0'
  - tag: tc620.core_pct[1]
    metric: cpu_core_pct
    param: '1'
  - tag: tc620.core_pct[2]
    metric: cpu_core_pct
    param: '2'
  - tag: tc620.core_pct[3]
    metric: cpu_core_pct
    param: '3'
  - tag: tc620.core_pct[4]
    metric: cpu_core_pct
    param: '4'
  - tag: tc620.core_pct[5]
    metric: cpu_core_pct
    param: '5'
  - tag: tc620.carico_1m
    metric: load1
  - tag: tc620.carico_5m
    metric: load5
  - tag: tc620.carico_15m
    metric: load15
  - tag: tc620.ram_usata_pct
    metric: mem_used_pct
  - tag: tc620.ram_usata_mb
    metric: mem_used_mb
  - tag: tc620.ram_disponibile_mb
    metric: mem_available_mb
  - tag: tc620.ram_totale_mb
    metric: mem_total_mb
  - tag: tc620.swap_usata_pct
    metric: swap_used_pct
  - tag: tc620.temperatura_cpu
    metric: temp
    param: cpu-thermal
  - tag: tc620.temperatura_gpu
    metric: temp
    param: gpu-thermal
  - tag: tc620.temperatura_mule_1
    metric: temp
    param: mule/temp1
  - tag: tc620.temperatura_mule_2
    metric: temp
    param: mule/temp2
  - tag: tc620.disco_sistema.usato_pct
    metric: disk_used_pct
    param: /
  - tag: tc620.disco_sistema.libero_gb
    metric: disk_free_gb
    param: /
  - tag: tc620.disco_progetti.usato_pct
    metric: disk_used_pct
    param: /var/sws/projects
  - tag: tc620.disco_progetti.libero_gb
    metric: disk_free_gb
    param: /var/sws/projects
  - tag: tc620.ethernet0.rx_bps
    metric: net_rx_bps
    param: ethernet0
  - tag: tc620.ethernet0.tx_bps
    metric: net_tx_bps
    param: ethernet0
  - tag: tc620.ethernet1.rx_bps
    metric: net_rx_bps
    param: ethernet1
  - tag: tc620.ethernet1.tx_bps
    metric: net_tx_bps
    param: ethernet1
  - tag: tc620.uptime_s
    metric: uptime_s
  - tag: tc620.hostname
    metric: hostname
  - tag: tc620.numero_serie
    metric: serial_number
  - tag: tc620.modello
    metric: model
alarms:
- id: tc620_cpu_calda
  tag: tc620.temperatura_cpu
  levels:
  - condition:
      kind: above
      threshold: 75.0
    severity: Warning
    message: '{{t0058}}'
  - condition:
      kind: above
      threshold: 85.0
    severity: Critical
    message: '{{t0059}}'
- id: tc620_disco_pieno
  tag: tc620.disco_progetti.usato_pct
  levels:
  - condition:
      kind: above
      threshold: 90.0
    severity: Warning
    message: '{{t0060}}'
page_layout:
  size_mode: fixed
  home_page_id: tc620_panoramica
  page_tree:
