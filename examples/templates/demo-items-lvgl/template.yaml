description: "Banco di prova del motore LVGL (sws-lvgl-viewer): un oggetto per ciascuno dei tipi che LVGL disegna — dal 27-08-2026 tutti quelli della palette —, su 4 pagine da 1280x800 con la cornice e una finestra pop-up. Gemello di \"Demo Items - Web\": stessi id e stesse coordinate, quindi aprendo la stessa pagina sui due motori ogni differenza è un difetto di parità."
