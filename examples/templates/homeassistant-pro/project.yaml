        write_domain: cover
        write_service: open_cover

      - tag: tapparella.bagno
        entity_id: cover.tapparella_pianoterra_bagno
        write_domain: cover
        write_service: open_cover

      - tag: tapparella.garage
        entity_id: cover.tapparella_pianoterra_garage
        write_domain: cover
        write_service: open_cover

      # ── Presenza & Sole ────────────────────────────────────────────────────
      # person.mauro2: "home" → true, "not_home" → false
      - tag: mauro.a_casa
        entity_id: person.mauro2

      - tag: sole.elevazione
        entity_id: sun.sun
        attribute: elevation

# ── ALLARMI ───────────────────────────────────────────────────────────────────

alarms:

  # Batteria
  - id: alm-batteria-bassa
    tag: batteria.percentuale
    condition:
      kind: below
      threshold: 15.0
    dead_band: 3.0
    message: "Batteria scarica: {value:.0f}%"
    severity: Warning

  - id: alm-batteria-critica
    tag: batteria.percentuale
    condition:
      kind: below
      threshold: 5.0
    dead_band: 1.0
    message: "Batteria critica: {value:.0f}% — intervento urgente"
    severity: Critical

  # Rete — Tensione
  - id: alm-rete-sovratensione
    tag: rete.tensione_v
    condition:
      kind: above
      threshold: 250.0
    dead_band: 2.0
    message: "Sovratensione rete: {value:.1f} V"
    severity: Warning

  - id: alm-rete-sottotensione
    tag: rete.tensione_v
    condition:
      kind: below
      threshold: 210.0
    dead_band: 2.0
    message: "Sottotensione rete: {value:.1f} V"
    severity: Warning

  # Rete — Frequenza
  - id: alm-freq-alta
    tag: rete.frequenza_hz
    condition:
      kind: above
      threshold: 50.3
    dead_band: 0.05
    message: "Frequenza rete alta: {value:.2f} Hz"
    severity: Warning

  - id: alm-freq-bassa
    tag: rete.frequenza_hz
    condition:
      kind: below
      threshold: 49.7
    dead_band: 0.05
    message: "Frequenza rete bassa: {value:.2f} Hz"
    severity: Warning

  # Sicurezza
  - id: alm-garage
    tag: garage.aperto
    condition:
      kind: bool_true
    message: "Porta garage aperta"
    severity: Warning

  - id: alm-porta
    tag: porta.principale
    condition:
      kind: bool_true
    message: "Portoncino ingresso aperto"
    severity: Info

  - id: alm-movimento-esterno
    tag: esterno.movimento
    condition:
      kind: bool_true
    message: "Movimento rilevato area esterna"
    severity: Info

  - id: alm-persona-esterna
    tag: esterno.persona
    condition:
      kind: bool_true
    message: "Persona rilevata area esterna (AI)"
    severity: Warning

  # Clima
  - id: alm-temp-alta-sala
    tag: sala.temperatura
    condition:
      kind: above
      threshold: 28.0
    dead_band: 1.0
    message: "Soggiorno troppo caldo: {value:.1f}°C"
    severity: Warning

  - id: alm-temp-bassa-sala
    tag: sala.temperatura
    condition:
      kind: below
      threshold: 14.0
    dead_band: 1.0
    message: "Soggiorno troppo freddo: {value:.1f}°C"
    severity: Warning

  - id: alm-umidita-alta
    tag: sala.umidita
    condition:
      kind: above
      threshold: 70.0
    dead_band: 5.0
    message: "Umidità soggiorno elevata: {value:.0f}%"
    severity: Warning

