id: pro_p1
name: '{{t0001}}'
background: "#0f172a"
width: 1280
height: 800

# Panoramica: energia in alto, poi clima, sicurezza, presenza e luci.
# Le righe che si ripetono sono istanze di faceplate (faceplates/): `stanza` per
# le cinque stanze, `spia` e `spia_allarme` per porte, finestre, rilevatori,
# luci e tapparelle. Qui si guarda soltanto: i comandi stanno in Sicurezza.
#
# Il nome della pagina, la lingua, data e ora stanno nella testata della
# cornice (cornici/navigazione.yaml), il navigatore nel piede: il contenuto sta
# fra y 72 e y 726, fra le due fasce (56 e 738).

objects:

