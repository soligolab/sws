id: pro_p6
name: '{{t0121}}'
background: "#0f172a"
width: 1280
height: 800

# Sicurezza e controllo: i sensori a sinistra, i comandi a destra. È la vetrina
# dei permessi (regola R7, eccezione dichiarata in check_templates.sh): quasi
# tutti i comandi si usano col ruolo Viewer, due no apposta — la luce del
# cancelletto chiede Operator, la tapparella del garage Supervisor. Il ruolo
# sta sul tag (`write_min_role` in project.yaml) e la pagina lo scrive accanto.
#
# Il nome della pagina, la lingua e l'ora stanno nella testata della cornice,
# il navigatore nel piede (cornici/navigazione.yaml).

