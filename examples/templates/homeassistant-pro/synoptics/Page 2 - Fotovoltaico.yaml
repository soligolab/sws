id: pro_p2
name: '{{t0045}}'
background: "#0f172a"
width: 1280
height: 800

# Fotovoltaico: il totale in alto, le due stringhe (istanze del faceplate
# `stringa_fv` sulle istanze pv1 e pv2 del tipo omonimo), l'andamento delle
# correnti e, in fondo, inverter e autoconsumo.
#
# Il nome della pagina, la lingua e l'ora stanno nella testata della cornice,
# il navigatore nel piede (cornici/navigazione.yaml).

objects:

# ══════════════════════════════════════════════════════════════════════════════
# POTENZA TOTALE FV
# ══════════════════════════════════════════════════════════════════════════════
- id: pro2_tot_box
  type: rect
  x: 24
  y: 72
  width: 1232
  height: 104
  fill: '#052e16'
  stroke: '#22c55e'
  stroke_width: 1
  rx: 6
- id: pro2_tot_lbl
  type: text
  x: 40
  y: 82
  width: 320
  height: 22
  text_wrap: true
  text_valign: middle
  text: '{{t0049}}'
  font_size: 14
  font_weight: bold
  color: '#22c55e'
- id: pro2_tot_kw
  type: text
  x: 40
  y: 106
  width: 320
  height: 56
  text_wrap: true
  text_valign: middle
  tag: pv.potenza_totale_kw
  format: '{value:.3f} kW'
  font_size: 36
  font_weight: bold
  color: '#4ade80'
- id: pro2_tot_prog
  type: progress_bar
  x: 380
  y: 114
  width: 460
  height: 24
  tag: pv.potenza_totale_kw
  min: 0
  max: 12
  show_value: false
  fill: '#22c55e'
  bg_color: '#14532d'
- id: pro2_oggi_lbl
  type: text
  x: 870
  y: 82
  width: 200
  height: 22
  text_wrap: true
  text_valign: middle
  text: '{{t0050}}'
  font_size: 13
  text_anchor: middle
  color: '#16a34a'
- id: pro2_oggi_val
  type: text
  x: 870
  y: 106
  width: 200
  height: 56
  text_wrap: true
  text_valign: middle
  tag: pv.produzione_oggi_kwh
  format: '{value:.2f} kWh'
  font_size: 26
  font_weight: bold
  text_anchor: middle
  color: '#86efac'
- id: pro2_tot_kwh_lbl
  type: text
  x: 1070
  y: 82
  width: 170
  height: 22
  text_wrap: true
  text_valign: middle
  text: '{{t0051}}'
  font_size: 13
  text_anchor: middle
  color: '#16a34a'
- id: pro2_tot_kwh
  type: text
  x: 1070
  y: 106
  width: 170
  height: 56
  text_wrap: true
  text_valign: middle
  tag: pv.produzione_totale_kwh
  format: '{value:.0f} kWh'
  font_size: 22
  font_weight: bold
  text_anchor: middle
  color: '#86efac'

# ══════════════════════════════════════════════════════════════════════════════
# LE DUE STRINGHE — istanze del faceplate `stringa_fv`
# ══════════════════════════════════════════════════════════════════════════════
- id: pro2_pv1
  type: faceplate
  x: 24
  y: 188
  width: 608
  height: 300
  faceplate_id: stringa_fv
  faceplate_params:
    p: pv1
    titolo: '{{t0052}}'
- id: pro2_pv2
