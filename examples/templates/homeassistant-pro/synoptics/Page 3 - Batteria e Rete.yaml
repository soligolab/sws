# Batteria e rete: la batteria a sinistra (carica, stato, otto grandezze), la
# rete a destra (tensione, frequenza, scambio, energie del giorno), lo storico
# in fondo. Batteria e rete sono una sola: niente da ripetere, niente faceplate.
#
# Il nome della pagina, la lingua e l'ora stanno nella testata della cornice,
# il navigatore nel piede (cornici/navigazione.yaml).

objects:

