# Una stringa fotovoltaica (04-11-2026, regola R8): tensione e corrente sui due
# quadranti, la potenza sotto. `p` è un'istanza del tipo `stringa_fv` (pv1,
# pv2); prima i due riquadri erano copiati a mano, oggetto per oggetto.
id: stringa_fv
label: Stringa fotovoltaica
width: 608
height: 300
params:
- name: p
  type: istanza
  type_ref: stringa_fv
  default: pv1
  required: true
- name: titolo
  type: string
  default: '{{t0052}}'
objects:
- id: sfondo
  type: rect
  x: 0
  y: 0
  width: 608
  height: 300
  fill: '#0a1a10'
  stroke: '#166534'
  stroke_width: 1
  rx: 6
- id: titolo
  type: text
  x: 16
  y: 8
  width: 576
  height: 28
  text_wrap: true
  text_valign: middle
  text: '{titolo}'
  font_size: 17
  font_weight: bold
  color: '#22c55e'
- id: tensione_lbl
  type: text
  x: 49
  y: 38
  width: 190
  height: 20
  text_wrap: true
  text_valign: middle
  text: '{{t0053}}'
  font_size: 13
  text_anchor: middle
  color: '#64748b'
- id: tensione
  type: gauge
  x: 49
  y: 58
  width: 190
  height: 190
  tag: '{p}.tensione_v'
  min: 150
  max: 400
  decimals: 1
  unit: V
  fill: '#22c55e'
- id: corrente_lbl
  type: text
  x: 369
  y: 38
  width: 190
  height: 20
  text_wrap: true
  text_valign: middle
  text: '{{t0055}}'
  font_size: 13
  text_anchor: middle
  color: '#64748b'
- id: corrente
  type: gauge
  x: 369
  y: 58
  width: 190
  height: 190
  tag: '{p}.corrente_a'
  min: 0
  max: 12
  decimals: 2
  unit: A
  fill: '#22c55e'
- id: potenza_lbl
  type: text
  x: 16
  y: 256
  width: 280
  height: 36
  text_wrap: true
  text_valign: middle
  text: '{{t0071}}'
  font_size: 14
  color: '#64748b'
- id: potenza
  type: text
  x: 296
  y: 256
  width: 296
  height: 36
  text_wrap: true
  text_valign: middle
  tag: '{p}.potenza_kw'
  format: '{value:.3f} kW'
  font_size: 24
  font_weight: bold
  text_anchor: end
  color: '#86efac'
