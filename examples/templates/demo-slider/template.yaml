description: 'Tutti gli slider del prodotto su cinque pagine: classico, pillola, piastra con le otto icone e ISA-101; valore,
  tacche, bande e aggancio; bipolare, valore misurato e leva a molla; sfondo chiaro; un''immagine dietro, i limiti dal tag
