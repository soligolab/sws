meta:
  name: Slider — stili e modi
  version: 0.1.0
  description: Tutti gli slider del prodotto, dalla luce a piastra al termostato col valore misurato, su variabili interne
    che si muovono da sole.
tags:
- id: c.luce
  description: Luce del soggiorno (piastra)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.luce_terrazzo
  description: Luce del terrazzo (piastra)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.ventola
  description: Ventola (piastra)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.tapparella
  description: Tapparella (piastra verticale)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.presa
  description: Presa smart, limite di potenza (piastra)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.volume
  description: Volume della musica (piastra)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.irrigazione
  description: Irrigazione (piastra)
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.valore
  description: Il valore comune agli slider generici
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.frazione
  description: Frazione 0..1 col passo 0,05
  data_type: float
  write_min_role: Viewer
- id: c.offset
  description: Offset bipolare −50..50
  data_type: float
  write_min_role: Viewer
- id: c.setpoint
  description: Setpoint del termostato
  data_type: float
  write_min_role: Viewer
  unit: °C
- id: c.jog
  description: Leva a molla −100..100
  data_type: float
  write_min_role: Viewer
- id: c.continuo
  description: Scrittura continua con deadband 5
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.conferma
  description: Scrittura con conferma
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.verticale
  description: Slider verticali
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: c.pressione
  description: 'Pressione: limiti, unità e decimali presi dal tag'
  data_type: float
  write_min_role: Viewer
  unit: bar
  range_lo: 0.0
  range_hi: 6.0
  decimals: 1
- id: c.critico
  description: Comando critico
  data_type: float
  write_min_role: Viewer
  unit: '%'
- id: s.rampa
  description: 'Si muove da solo: rampa 0..100 in 40 s'
  data_type: float
  write_min_role: Viewer
  unit: '%'
  generator:
    shape: ramp
    period_ms: 40000
    min: 0.0
    max: 100.0
    enabled: true
- id: s.temperatura
  description: 'Si muove da solo: 18..26 °C in 60 s'
  data_type: float
  unit: °C
  generator:
    shape: triangle
    period_ms: 60000
    min: 18.0
    max: 26.0
    enabled: true
sources: []
alarms: []
functions: []
page_layout:
  size_mode: fixed
  default_width: 1280.0
  default_height: 800.0
  home_page_id: p_stili
  cornice_predefinita: cornice
languages:
  default: it
  langs:
  - it
  - en
  - es
  entries:
  - key: t0001
    values:
      it: 'scritto:'
      en: 'written:'
      es: 'escrito:'
  - key: t0002
