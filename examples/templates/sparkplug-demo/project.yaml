meta:
  name: "Sparkplug B Demo"
  version: "0.1.0"
  description: "Progetto dimostrativo per sorgenti IIoT Sparkplug B via MQTT. Configurare host, porta e group_id. SWS decodifica payload protobuf NBIRTH/NDATA/DBIRTH/DDATA automaticamente."

sources:
  - kind: mqtt
    id: spb-broker
    host: "localhost"
    port: 1883
    client_id: "sws-scada-host"
    topics: []
    sparkplug:
      group_id: "plant-a"
      host_id: "SWS-SCADA"
      metrics:
        - metric_name: "Pump/Speed"
          tag: pump.speed
          writable: true
        - metric_name: "Pump/Running"
          tag: pump.running
          writable: true
        - metric_name: "Temperature/Inlet"
          tag: temp.inlet
          writable: false
        - metric_name: "Temperature/Outlet"
          tag: temp.outlet
          writable: false
        - metric_name: "Flow/TotalCubicMeters"
          tag: flow.total
          writable: false

tags:
  - id: pump.speed
    data_type: float
    description: "Velocità pompa (rpm)"
    history: true
  - id: pump.running
    data_type: bool
    description: "Pompa in marcia"
    history: true
  - id: temp.inlet
    data_type: float
    description: "Temperatura ingresso (°C)"
    history: true
  - id: temp.outlet
    data_type: float
    description: "Temperatura uscita (°C)"
    history: true
  - id: flow.total
    data_type: float
    description: "Portata totale (m³)"
    history: false
  - id: temp.delta
    data_type: float
    description: "Delta temperatura (°C)"
    expression: "tags['temp.outlet'] - tags['temp.inlet']"
    history: false

alarms:
  - id: alm-pump-overtemp
    tag: temp.outlet
    condition:
      kind: above
      threshold: 80.0
    message: "Temperatura uscita eccessiva — pompa surriscaldata"
    severity: Critical
  - id: alm-pump-stopped
    tag: pump.running
    condition:
        # `bool_false`, non `equal`: quest'ultima non esiste fra le condizioni
        # riconosciute (above, below, bool_equals, bool_true, bool_false, and,
        # or, not), e faceva rifiutare l'INTERO progetto al caricamento — non
        # solo l'allarme. Trovato dal test che carica i template col parser vero.
        kind: bool_false
    message: "Pompa ferma durante produzione"
    severity: Warning

# NOTA: qui c'era una pagina scritta dentro `project.yaml`, sotto una chiave
# `synoptics:` che il runtime **non legge**: le pagine le prende dai file in
# `synoptics/*.yaml`. Era quindi contenuto morto — modificabile, invisibile,
# e ingannevole per chi ci avesse messo mano. Rimossa il 2026-08-28, quando
# al template è stata aggiunta una vera pagina di partenza.

languages:
  default: it
  langs: [it, en]
  entries: []
