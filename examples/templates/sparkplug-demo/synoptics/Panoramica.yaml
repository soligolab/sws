# La Panoramica (04-11-2026, regole R6–R8 dei template). Il titolo e l'ora li
# porta la cornice (`cornici/cornice.yaml`), quindi qui si parte da y 56. Le
# letture sono istanze dei faceplate «riga_valore» e «riga_spia», una per
# metrica; i comandi scrivono tag con `write_min_role: Viewer`, e si usano
# senza accedere.
id: spb_page1
name: '{{t0013}}'
width: 1280.0
height: 800.0
background: '#0f172a'
objects:
- id: sorgente
  type: text
  x: 40.0
  y: 72.0
  width: 1200.0
  height: 28.0
  text_wrap: true
  text_valign: middle
  text: '{{t0003}}'
  font_size: 18.0
  font_weight: bold
  color: '#38bdf8'
- id: nota
  type: text
  x: 40.0
  y: 100.0
  width: 1200.0
  height: 24.0
  text_wrap: true
  text_valign: middle
  text: '{{t0004}}'
  font_size: 13.0
  color: '#94a3b8'
- id: riga_velocita
  type: faceplate
  faceplate_id: riga_valore
  x: 40.0
  y: 136.0
  width: 580.0
  height: 36.0
  faceplate_params:
    etichetta: '{{t0005}}'
    tag: pump.speed
    formato: '{value:.1f}'
- id: riga_marcia
  type: faceplate
  faceplate_id: riga_spia
  x: 40.0
  y: 176.0
  width: 580.0
  height: 36.0
  faceplate_params:
    etichetta: '{{t0006}}'
    tag: pump.running
- id: riga_ingresso
  type: faceplate
  faceplate_id: riga_valore
  x: 40.0
  y: 216.0
  width: 580.0
  height: 36.0
  faceplate_params:
    etichetta: '{{t0007}}'
    tag: temp.inlet
    formato: '{value:.1f}'
- id: riga_uscita
  type: faceplate
  faceplate_id: riga_valore
  x: 40.0
  y: 256.0
  width: 580.0
  height: 36.0
  faceplate_params:
    etichetta: '{{t0008}}'
    tag: temp.outlet
    formato: '{value:.1f}'
- id: riga_portata
  type: faceplate
  faceplate_id: riga_valore
  x: 40.0
  y: 296.0
  width: 580.0
  height: 36.0
  faceplate_params:
    etichetta: '{{t0009}}'
    tag: flow.total
    formato: '{value:.1f}'
- id: riga_delta
  type: faceplate
  faceplate_id: riga_valore
  x: 40.0
  y: 336.0
  width: 580.0
  height: 36.0
  faceplate_params:
    etichetta: '{{t0010}}'
    tag: temp.delta
    formato: '{value:.1f}'
# ── Write-back — pump.speed/pump.running sono writable: true alla
#    sorgente ma nessun controllo li scriveva (revisione template,
#    15-09-2026): coerenza con enip-demo/s7-demo, corretti per lo stesso
#    motivo. ──
- id: lbl_comandi
  type: text
  x: 40.0
  y: 396.0
  width: 580.0
  height: 24.0
  text_wrap: true
  text_valign: middle
  text: '{{t0011}}'
  font_size: 12.0
  font_weight: bold
  color: '#38bdf8'
- id: cmd_speed
