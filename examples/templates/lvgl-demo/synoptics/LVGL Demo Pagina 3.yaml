id: lvgl_demo_page3
name: LVGL Demo - Pagina 3
background: "#0f172a"
width: 1280
height: 800
objects:
  - id: t_title3
    type: text
    x: 40.0
    y: 24.0
    text: "LVGL Demo - Pagina 3 (symbol/grid/pipe/setpoint/xy_plot/pie_chart/alarm_bell/recipe_panel)"
    font_size: 20.0
    font_weight: bold
    color: "#e2e8f0"

  # ── symbol: alcuni dei 16 builtin, colore di stato da lvgl_demo.led_on ──
  - id: sym_pump
    type: symbol
    x: 40.0
    y: 70.0
    width: 80.0
    height: 80.0
    symbol_id: pump
    state_tag: lvgl_demo.led_on
  - id: sym_valve
    type: symbol
    x: 140.0
    y: 70.0
    width: 80.0
    height: 80.0
    symbol_id: valve
    state_tag: lvgl_demo.led_on
  - id: sym_motor
    type: symbol
    x: 240.0
    y: 70.0
    width: 80.0
    height: 80.0
    symbol_id: motor
    state_tag: lvgl_demo.led_on
  - id: sym_tank
    type: symbol
    x: 340.0
    y: 70.0
    width: 70.0
    height: 100.0
    symbol_id: tank
    state_tag: lvgl_demo.led_on
  - id: sym_fan
    type: symbol
    x: 430.0
    y: 70.0
    width: 80.0
    height: 80.0
    symbol_id: fan
    state_tag: lvgl_demo.led_on
  - id: sym_breaker
    type: symbol
    x: 530.0
    y: 70.0
    width: 80.0
    height: 80.0
    symbol_id: breaker
    state_tag: lvgl_demo.led_on
  - id: cap_sym
    type: text
    x: 40.0
    y: 176.0
    text: "symbol (16 builtin, Q15 opzione B) - stato da lvgl_demo.led_on"
    font_size: 12.0
    color: "#94a3b8"

  # ── pie_chart: solo modalità donut ──────────────────────────────────────
  - id: pie1
    type: pie_chart
    x: 660.0
    y: 60.0
    width: 160.0
    height: 160.0
    pie_mode: donut
    pie_inner_ratio: 0.55
    pie_slices:
      - tag: lvgl_demo.value
        label: "Valore"
        color: "#3b82f6"
      - tag: lvgl_demo.value2
        label: "Valore 2"
        color: "#f59e0b"
  - id: cap_pie1
    type: text
    x: 660.0
    y: 224.0
    text: "pie_chart (donut) - value / value2"
    font_size: 12.0
    color: "#94a3b8"

  # ── setpoint: tastierino numerico a schermo intero ──────────────────────
  - id: sp_set1
    type: setpoint
    x: 860.0
    y: 60.0
    width: 160.0
    height: 60.0
    tag: lvgl_demo.value2
    label: "Setpoint value2"
    min: 0
    max: 100
    step: 1
  - id: cap_set1
    type: text
    x: 860.0
    y: 124.0
    text: "setpoint - scrive lvgl_demo.value2"
    font_size: 12.0
    color: "#94a3b8"

  # ── xy_plot: traiettoria value/value2 ────────────────────────────────────
  - id: xy1
    type: xy_plot
    x: 1060.0
    y: 60.0
    width: 180.0
    height: 180.0
    tag: lvgl_demo.value
    y_tag: lvgl_demo.value2
    xy_trail_s: 20.0
    xy_x_min: 0
    xy_x_max: 100
    xy_y_min: 0
    xy_y_max: 100
  - id: cap_xy1
    type: text
    x: 1060.0
    y: 244.0
    text: "xy_plot - value (x) / value2 (y)"
    font_size: 12.0
    color: "#94a3b8"

  # ── grid: 2x2 con due celle popolate, una sub-grid nella terza ──────────
  - id: grid1
    type: grid
    x: 40.0
    y: 260.0
    width: 300.0
    height: 200.0
    grid_rows: 2
    grid_cols: 2
    grid_show_borders: true
    grid_cells:
      - row: 0
        col: 0
        bg_color: "#1e293b"
        child:
          id: grid_txt1
          type: text
          x: 8.0
          y: 8.0
          tag: lvgl_demo.value
          format: "{value:.0f}"
          font_size: 18.0
          color: "#eab308"
      - row: 0
        col: 1
        bg_color: "#1e293b"
        child:
          id: grid_led1
          type: led
          x: 20.0
          y: 20.0
          width: 24.0
          height: 24.0
          tag: lvgl_demo.led_on
          on_color: "#22c55e"
          off_color: "#334155"
      - row: 1
        col: 0
        colspan: 2
        bg_color: "#1e293b"
        sub:
          orientation: cols
          ratio: 0.5
          a:
            bg_color: "#0f172a"
            child:
              id: grid_sub_a
              type: text
              x: 8.0
              y: 8.0
              text: "sub A"
              font_size: 12.0
              color: "#94a3b8"
          b:
            bg_color: "#0f172a"
            child:
              id: grid_sub_b
              type: checkbox
              x: 8.0
              y: 8.0
              label: "sub B"
              tag: lvgl_demo.toggle
  - id: cap_grid1
    type: text
    x: 40.0
    y: 466.0
    text: "grid 2x2 (una cella e' una sub-grid 1x2)"
    font_size: 12.0
    color: "#94a3b8"

  # ── pipe: percorso a 3 waypoint, colore da fill_level_tag ───────────────
  - id: pipe1
    type: pipe
    x: 0.0
    y: 0.0
    points:
      - { x: 380.0, y: 300.0 }
      - { x: 480.0, y: 300.0 }
      - { x: 480.0, y: 400.0 }
      - { x: 580.0, y: 400.0 }
    stroke: "#475569"
    stroke_width: 8.0
    fill_level_tag: lvgl_demo.value
    fill_level_scale: "0-100"
    fill_color: "#3b82f6"
  - id: cap_pipe1
    type: text
    x: 380.0
    y: 420.0
    text: "pipe - colore da lvgl_demo.value (statico, non segue dal vivo)"
    font_size: 12.0
    color: "#94a3b8"

  # ── alarm_bell: badge + pannello a comparsa ─────────────────────────────
  - id: bell1
    type: alarm_bell
    x: 660.0
    y: 300.0
    width: 130.0
    height: 34.0
  - id: cap_bell1
    type: text
    x: 660.0
    y: 340.0
    text: "alarm_bell - clicca per il pannello"
    font_size: 12.0
    color: "#94a3b8"

  # ── recipe_panel: elenco statico + applica ──────────────────────────────
  - id: recipe1
    type: recipe_panel
    x: 860.0
    y: 300.0
    width: 260.0
    height: 140.0
  - id: cap_recipe1
    type: text
    x: 860.0
    y: 446.0
    text: "recipe_panel - GET /api/recipes"
    font_size: 12.0
    color: "#94a3b8"

  # ── i18n (T-40): testo con token {{}}, lang_button x2, lang_selector ────
  - id: i18n_greeting
    type: text
    x: 40.0
    y: 540.0
    text: "{{greeting}}"
    font_size: 20.0
    color: "#e2e8f0"
  - id: i18n_motor
    type: symbol
    x: 40.0
    y: 580.0
    width: 60.0
    height: 60.0
    symbol_id: motor
    state_tag: lvgl_demo.led_on
  - id: i18n_motor_label
    type: text
    x: 110.0
    y: 600.0
    text: "{{motor_label}}"
    font_size: 16.0
    color: "#cbd5e1"
  - id: lang_it
    type: lang_button
    x: 260.0
    y: 540.0
    width: 60.0
    height: 32.0
    target_lang: it
    label: "IT"
  - id: lang_en
    type: lang_button
    x: 330.0
    y: 540.0
    width: 60.0
    height: 32.0
    target_lang: en
    label: "EN"
  - id: lang_sel
    type: lang_selector
    x: 260.0
    y: 580.0
    width: 130.0
    height: 32.0
  - id: cap_i18n
    type: text
    x: 40.0
    y: 650.0
    text: "i18n (T-40): token {{greeting}}/{{motor_label}}, lang_button IT/EN, lang_selector"
    font_size: 12.0
    color: "#94a3b8"

  - id: nav_back3
    type: navbutton
    x: 40.0
    y: 700.0
    width: 220.0
    height: 50.0
    label: "Pagina 1"
    target_page: lvgl_demo_page
    fill: "#1e293b"
