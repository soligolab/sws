meta:
  name: lvgl-demo
  version: 0.1.0

# Target LVGL fin dalla creazione — questo campo sopravvive alla copia del
# template (vedi sws-web/src/projects.rs: create_project copia project.yaml
# così com'è, il target del wizard si applica solo ai progetti vuoti).
target:
  kind: lvgl_framebuffer
  framebuffer_device: "/dev/fb0"

# Tag in-memory: nessuna sorgente, scrivibili via API oppure dai widget
# stessi (click bottone/checkbox/radio, drag slider — input device LVGL
# collegato, vedi docs/OPEN_QUESTIONS.md Q14).
tags:
  - id: lvgl_demo.button_pressed
    description: "true dopo il click su 'Bottone' — dimostra lv_obj_add_event_cb(LV_EVENT_CLICKED) → PUT /api/tags (write_value, stessa semantica del bottone web)"
    data_type: bool
  - id: lvgl_demo.led_on
    description: "Stato ON/OFF del LED demo"
    data_type: bool
  - id: lvgl_demo.value
    description: "Valore numerico 0-100 — guida slider e testo formattato; trascinare lo slider scrive qui dal vivo"
    data_type: float
  - id: lvgl_demo.toggle
    description: "Stato spuntato/non spuntato della checkbox demo — scrivibile anche cliccando la checkbox"
    data_type: bool
  - id: lvgl_demo.radio_on
    description: "Stato spuntato/non spuntato del radio demo (radio è approssimato con una checkbox — vedi Q14) — scrivibile anche cliccando"
    data_type: bool

sources: []
alarms: []
functions: []
custom_symbols: []
datastores: []
global_scripts: []
languages:
  default: ""
  langs: []
  entries: []
