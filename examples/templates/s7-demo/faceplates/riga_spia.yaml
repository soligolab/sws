# Una riga «etichetta + spia» della Panoramica (04-11-2026, regola R8): lo
# stesso disegno di «riga_valore», per un tag BOOL. Accesa = verde.
id: riga_spia
label: Riga con spia
width: 580
height: 36
params:
- name: etichetta
  type: string
  default: '{{t0006}}'
- name: tag
  type: tag
  default: valve1.open
  required: true
objects:
- id: etichetta
  type: text
  x: 0
  y: 0
  width: 400
  height: 36
  text_wrap: true
  text_valign: middle
  text: '{etichetta}'
  font_size: 14
  text_anchor: start
  color: '#94a3b8'
- id: spia
  type: led
  x: 560
  y: 9
  width: 18
  height: 18
  tag: '{tag}'
  on_color: '#22c55e'
  off_color: '#334155'
- id: linea
  type: rect
  x: 0
  y: 35
  width: 580
  height: 1
  fill: '#1e293b'
