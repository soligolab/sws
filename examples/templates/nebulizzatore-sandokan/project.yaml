meta:
  name: nebulizzatore-sandokan
  version: 0.1.0

# target esplicito (revisione template, 15-09-2026): un solo template su
# undici lo dichiarava (demo-items-lvgl). Web è il motore di sempre per
# questo template — nessun cambio di comportamento, solo lo si rende
# esplicito invece di implicito. Tutti e otto i tipi usati sarebbero già
# disegnabili da LVGL (layout 1280×600, pensato per un pannello), ma LVGL
# non è mai stato collaudato dal vivo dopo l'ultimo merge — passare un
# template reale a lvgl_wayland resta una decisione da prendere con calma,
# non da questa revisione.
target:
  kind: web

tags:
- id: sandokan.state
  description: "Sandokan — stato presa (ON/OFF)"
  data_type: string
- id: sandokan.power
  description: "Sandokan — potenza istantanea (W)"
  data_type: float
  history: true
- id: sandokan.current
  description: "Sandokan — corrente istantanea (A)"
  data_type: float
  history: true
- id: sandokan.voltage
  description: "Sandokan — tensione di rete (V)"
  data_type: float
  history: true
- id: sandokan.energy
  description: "Sandokan — energia totale consumata (kWh)"
  data_type: float
  history: true
- id: sandokan.linkquality
  description: "Sandokan — qualità del segnale Zigbee (0-255)"
  data_type: int
- id: sandokan.running
  description: "Pompa in funzione (derivato: potenza > 1 W)"
  data_type: bool
  expression: "tags['sandokan.power'] > 1.0"

sources:
- kind: mqtt
  id: mqtt-sandokan
  host: mqtt.example.invalid
  port: 1883
  client_id: sws-sandokan
  topics:
  - tag: sandokan.state
    topic: zigbee2mqtt/presa.sandokan
    json_path: state
  - tag: sandokan.power
    topic: zigbee2mqtt/presa.sandokan
    json_path: power
  - tag: sandokan.current
    topic: zigbee2mqtt/presa.sandokan
    json_path: current
  - tag: sandokan.voltage
    topic: zigbee2mqtt/presa.sandokan
    json_path: voltage
  - tag: sandokan.energy
    topic: zigbee2mqtt/presa.sandokan
    json_path: energy
  - tag: sandokan.linkquality
    topic: zigbee2mqtt/presa.sandokan
    json_path: linkquality

alarms:
- id: sandokan_power_on
  tag: sandokan.power
  condition:
    kind: above
    threshold: 1.0
  dead_band: 0.3
  message: "{{t0001}}"
  severity: Info
- id: sandokan_power_off
  tag: sandokan.power
  condition:
    kind: below
    threshold: 0.1
  dead_band: 0.05
  message: "{{t0002}}"
  severity: Info

functions: []
custom_symbols: []

datastores:
- id: default
  label: "Storico locale"
  backend:
    kind: sqlite
    path: .history/historian.db

global_scripts: []

languages:
  default: it
  langs: [it, en, es]
  entries:
    - key: t0001
      values:
        it: "🦟 Nebulizzatore Sandokan: pompa ACCESA (potenza sopra 1 W)"
        en: "🦟 Sandokan mister: pump ON (power above 1 W)"
        es: "🦟 Nebulizador Sandokan: bomba ENCENDIDA (potencia por encima de 1 W)"
    - key: t0002
      values:
        it: "🦟 Nebulizzatore Sandokan: pompa SPENTA (potenza tornata a 0 W)"
        en: "🦟 Sandokan mister: pump OFF (power back to 0 W)"
        es: "🦟 Nebulizador Sandokan: bomba APAGADA (potencia de vuelta a 0 W)"
    - key: t0003
      values:
        it: "🦟 Nebulizzatore Antizanzare — Sandokan"
        en: "🦟 Mosquito mister — Sandokan"
        es: "🦟 Nebulizador antimosquitos — Sandokan"
    - key: t0004
      values:
        it: "Stato:"
        en: "State:"
        es: "Estado:"
    - key: t0005
      values:
        it: "Serbatoio"
        en: "Tank"
        es: "Depósito"
    - key: t0006
      values:
        it: "Potenza: {value:.1f} W"
        en: "Power: {value:.1f} W"
        es: "Potencia: {value:.1f} W"
    - key: t0007
      values:
        it: "Corrente: {value:.2f} A"
        en: "Current: {value:.2f} A"
        es: "Corriente: {value:.2f} A"
    - key: t0008
      values:
        it: "Tensione: {value:.1f} V"
        en: "Voltage: {value:.1f} V"
        es: "Tensión: {value:.1f} V"
    - key: t0009
      values:
        it: "Energia totale: {value:.2f} kWh"
        en: "Total energy: {value:.2f} kWh"
        es: "Energía total: {value:.2f} kWh"
    - key: t0010
      values:
        it: "Segnale Zigbee: {value:.0f}/255"
        en: "Zigbee signal: {value:.0f}/255"
        es: "Señal Zigbee: {value:.0f}/255"
    - key: t0011
      values:
        it: "Potenza (W)"
        en: "Power (W)"
        es: "Potencia (W)"
    - key: t0012
      values:
        it: "Potenza (W) — ultima ora"
        en: "Power (W) — last hour"
        es: "Potencia (W) — última hora"
    - key: t0013
      values:
        it: "Corrente (A) — ultima ora"
        en: "Current (A) — last hour"
        es: "Corriente (A) — última hora"
    - key: t0014
      values:
        it: "Tensione (V) — ultima ora"
        en: "Voltage (V) — last hour"
        es: "Tensión (V) — última hora"
