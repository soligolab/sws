id: nebulizzatore-sandokan
label: "Nebulizzatore antizanzare (MQTT/Zigbee2MQTT)"
description: "Monitoraggio di una presa smart Zigbee2MQTT (NEO NAS-WR01B / Tuya TS011F) che alimenta un nebulizzatore antizanzare a pompa: legge stato/potenza/corrente/tensione/energia dallo stesso topic MQTT con json_path multipli, registra lo storico su SQLite, mostra tre grafici trend separati (potenza/corrente/tensione, assi indipendenti) per vedere quando la pompa si accende/spegne, e due allarmi (soglia 1 W) pronti per notifiche Telegram su accensione/spegnimento. Dopo l'import configura il bot Telegram in ConfigView → Notifiche (il template non include credenziali). Il broker del template è un indirizzo di documentazione (mqtt.example.invalid:1883): dopo l'import scrivi quello del tuo broker nella sorgente MQTT."
