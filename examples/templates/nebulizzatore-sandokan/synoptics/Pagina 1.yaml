id: page1
name: "Sandokan"
background: "#0f172a"
width: 1280
height: 800

objects:
- id: s_title
  type: text
  x: 640
  y: 114
  text: "{{t0003}}"
  font_size: 18
  font_weight: bold
  text_anchor: middle
  color: "#e2e8f0"

# Due oggetti, non un format con testo attorno a {value}: il motore
# riconosce solo {value:.Nf} con una specifica numerica esplicita — un
# {value} nudo in mezzo a del testo (bug pre-esistente, trovato nella
# revisione template del 15-09-2026) fa sparire il testo e mostra solo
# il valore grezzo. sandokan.state è una stringa: nessuna specifica
# .Nf può salvarlo, quindi l'etichetta va in un oggetto a sé.
- id: s_state_lbl
  type: text
  x: 600
  y: 136
  text: "{{t0004}}"
  font_size: 12
  text_anchor: end
  color: "#64748b"
- id: s_state_val
  type: text
  x: 610
  y: 136
  tag: sandokan.state
  font_size: 12
  font_weight: 600
  text_anchor: start
  color: "#94a3b8"

- id: sand1_alarm_bell
  type: alarm_bell
  x: 1120.0
  y: 108.0
  width: 140.0
  height: 28.0
  alarm_bell_show_history: true
  alarm_bell_show_shelve: true

# ── Serbatoio → pompa (T-53, revisione template 15-09-2026): un percorso
#    a più waypoint con il flusso animato solo quando la pompa lavora
#    davvero — zero template su undici usavano i waypoint. ──
- id: s_pump
  name: Pompa
  type: symbol
  x: 30
  y: 158
  width: 85
  height: 85
  symbol_id: pump
  state_tag: sandokan.running
  state_off_color: "#64748b"
  state_on_color: "#22c55e"
  state_alarm_color: "#ef4444"
  transition_duration_ms: 300

- id: s_pipe
  type: pipe
  x: 115
  y: 160
  width: 115
  height: 70
  points:
    - x: 115
      y: 100
    - x: 170
      y: 128
    - x: 230
      y: 92
  routing: straight
  pipe_style: tube
  stroke: "#475569"
  stroke_width: 6
  pipe_flow: true
  pipe_flow_tag: sandokan.running

- id: s_tank
  type: rect
  x: 230
  y: 162
  width: 60
  height: 50
  fill: "#1e3a8a"
  stroke: "#334155"
  stroke_width: 2
- id: s_tank_lbl
  type: text
  x: 260
  y: 228
  text: "{{t0005}}"
  font_size: 10
  text_anchor: middle
  color: "#94a3b8"

- id: s_power
  type: text
  x: 340
  y: 162
  tag: sandokan.power
  format: "{{t0006}}"
  font_size: 14
  font_weight: 600
  color: "#f59e0b"

- id: s_current
  type: text
  x: 340
  y: 184
  tag: sandokan.current
  format: "{{t0007}}"
  font_size: 14
  font_weight: 600
  color: "#3b82f6"

- id: s_voltage
  type: text
  x: 340
  y: 206
  tag: sandokan.voltage
  format: "{{t0008}}"
  font_size: 14
  font_weight: 600
  color: "#a855f7"

- id: s_energy
  type: text
  x: 340
  y: 228
  tag: sandokan.energy
  format: "{{t0009}}"
  font_size: 12
  color: "#94a3b8"

- id: s_linkquality
  type: text
  x: 340
  y: 248
  tag: sandokan.linkquality
  format: "{{t0010}}"
  font_size: 11
  color: "#64748b"

- id: s_gauge_power
  type: gauge
  x: 560
  y: 155
  width: 160
  height: 140
  label: "{{t0011}}"
  tag: sandokan.power
  min: 0
  max: 50
  transition_duration_ms: 200

# ── Tre trend affiancati invece che impilati (revisione template
#    15-09-2026: layout 1280×600, non più 900×920). ──
- id: s_trend1_label
  type: text
  x: 20
  y: 302
  text: "{{t0012}}"
  font_size: 11
  color: "#94a3b8"

- id: s_trend_power
  type: trend
  x: 20
  y: 320
  width: 400
  height: 320
  tag: sandokan.power
  line_color: "#f59e0b"
  window_s: 3600

- id: s_trend2_label
  type: text
  x: 440
  y: 302
  text: "{{t0013}}"
  font_size: 11
  color: "#94a3b8"

- id: s_trend_current
  type: trend
  x: 440
  y: 320
  width: 400
  height: 320
  tag: sandokan.current
  line_color: "#3b82f6"
  window_s: 3600

- id: s_trend3_label
  type: text
  x: 860
  y: 302
  text: "{{t0014}}"
  font_size: 11
  color: "#94a3b8"

- id: s_trend_voltage
  type: trend
  x: 860
  y: 320
  width: 400
  height: 320
  tag: sandokan.voltage
  line_color: "#a855f7"
  window_s: 3600

- id: sand1_alarm_banner
  type: alarm_banner
  x: 20.0
  y: 652.0
  width: 1240.0
  height: 40.0
