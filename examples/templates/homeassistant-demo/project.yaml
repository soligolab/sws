meta:
  name: homeassistant-demo
  version: 0.2.0

# ── TAG ───────────────────────────────────────────────────────────────────────
# Tutti gli entity_id si riferiscono a un'installazione reale con:
#   - Sensori Zigbee (temperatura/umidità per stanza)
#   - Inverter fotovoltaico Solarman (PV + batteria + rete)
#   - Sensori perimetrali (porte, finestre, cancello garage)
#   - Switch controllabili (lampade esterne, prese)
# Adatta gli entity_id alla tua installazione. Vedi SETUP.md.

tags:

  # ── Ambiente: soggiorno ────────────────────────────────────────────────────
  - id: sala.temperatura
    description: "Temperatura soggiorno (°C)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  - id: sala.umidita
    description: "Umidità soggiorno (%)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  # ── Ambiente: studio ───────────────────────────────────────────────────────
  - id: studio.temperatura
    description: "Temperatura studio (°C)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  - id: studio.umidita
    description: "Umidità studio (%)"
    data_type: float

  # ── Fotovoltaico ───────────────────────────────────────────────────────────
  - id: pv.potenza_kw
    description: "Produzione FV istantanea (kW)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  - id: pv.produzione_oggi_kwh
    description: "Produzione FV oggi (kWh)"
    data_type: float

  - id: batteria.percentuale
    description: "Carica batteria (%)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  - id: batteria.potenza_kw
    description: "Potenza batteria (kW — positivo = carica, negativo = scarica)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  - id: batteria.temperatura
    description: "Temperatura batteria (°C)"
    data_type: float

  # ── Energia casa ───────────────────────────────────────────────────────────
  # Nota: energia.potenza_w mantiene l'ID per compatibilità sinottico
  #       ma il valore è in kW (inverter Solarman).
  - id: energia.potenza_w
    description: "Consumo casa istantaneo (kW)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  - id: energia.consumo_kwh
    description: "Consumo casa oggi (kWh)"
    data_type: float

  - id: rete.potenza_kw
    description: "Scambio rete (kW — positivo = immissione, negativo = prelievo)"
    data_type: float
    history: true
    datastore_id: sqlite-locale

  # ── Sicurezza ──────────────────────────────────────────────────────────────
  - id: garage.aperto
    description: "Porta sezionale garage aperta"
    data_type: bool

  - id: porta.principale
    description: "Portoncino ingresso aperto"
    data_type: bool

  - id: ingresso.movimento
    description: "Presenza rilevata in ingresso"
    data_type: bool

  - id: movimento.esterno
    description: "Movimento area esterna rilevato"
    data_type: bool

  - id: finestra.soggiorno_sx
    description: "Portafinestra soggiorno sinistra aperta"
    data_type: bool

  - id: finestra.soggiorno_dx
    description: "Portafinestra soggiorno destra aperta"
    data_type: bool

  # ── Luci/switch — write-back abilitato ────────────────────────────────────
  # I tag luce.* mantengono gli ID storici del sinottico — rimappati
  # a switch reali (lampade esterne, prese) disponibili nell'installazione.
  - id: luce.esterno
    description: "Lampada cancelletto ON/OFF"
    data_type: bool

  - id: luce.soggiorno
    description: "Lampada viale centrale ON/OFF"
    data_type: bool

  - id: luce.cucina
    description: "Lampada strada destra ON/OFF"
    data_type: bool

  - id: ventilatore.camera
    description: "Presa laboratorio ON/OFF"
    data_type: bool

  # ── Sole ───────────────────────────────────────────────────────────────────
  - id: sole.elevazione
    description: "Elevazione solare (gradi)"
    data_type: float

  # ── Tag derivati (calcolati da SWS — non su HA) ───────────────────────────
  - id: energia.costo_ora_eur
    description: "Costo energia €/h stimato (0.25 €/kWh)"
    data_type: float
    expression: "round(tags['energia.potenza_w'] * 0.25, 4)"

  # Delta temperatura tra due stanze (sostituisce vecchio interno-esterno)
  - id: clima.delta_interno_esterno
    description: "Delta temperatura soggiorno-studio (°C)"
    data_type: float
    expression: "round(tags['sala.temperatura'] - tags['studio.temperatura'], 1)"

  - id: sala.comfort_index
    description: "Indice comfort soggiorno 0-100 (T ideale 22°C, U ideale 50%)"
    data_type: float
    expression: |
      t = tags['sala.temperatura']
      h = tags['sala.umidita']
      t_score = max(0.0, 100.0 - abs(t - 22.0) * 10.0)
      h_score = max(0.0, 100.0 - abs(h - 50.0) * 2.0)
      round((t_score + h_score) / 2.0, 1)

  - id: pv.autoconsumo_pct
    description: "Quota consumo coperta da FV (0-100%)"
    data_type: float
    expression: |
      pv   = tags['pv.potenza_kw']
      casa = tags['energia.potenza_w']
      if pv <= 0.0 or casa <= 0.0:
          0.0
      else:
          round(min(pv, casa) / casa * 100.0, 1)

# ── DATABASE STORICO ──────────────────────────────────────────────────────────
# SQLite locale: i campioni vengono scritti in <progetto>/.history/sws-history.db
# retention_days: 90 → campioni più vecchi di 90 giorni vengono eliminati

datastores:
  - id: sqlite-locale
    label: "Storico SQLite locale"
    backend:
      kind: sqlite
      path: .history/sws-history.db
    retention_days: 90

# ── SORGENTE HOMEASSISTANT ────────────────────────────────────────────────────
# Adatta url e token alla tua installazione. Vedi SETUP.md.
# Usa token_env: HA_TOKEN invece di token in chiaro in produzione.

sources:
  - kind: homeassistant
    id: ha-demo
    url: http://homeassistant.local:8123
    token_env: HA_TOKEN

    entities:

      # ── Sensori ambiente ──────────────────────────────────────────────────
      - tag: sala.temperatura
        entity_id: sensor.sensoreambientesoggiorno_temperature

      - tag: sala.umidita
        entity_id: sensor.sensoreambientesoggiorno_humidity

      - tag: studio.temperatura
        entity_id: sensor.sensoreambientestudio_temperature

      - tag: studio.umidita
        entity_id: sensor.sensoreambientestudio_humidity

      # ── Fotovoltaico (inverter Solarman) ──────────────────────────────────
      - tag: pv.potenza_kw
        entity_id: sensor.solarman_pv_instant_generated_pw

      - tag: pv.produzione_oggi_kwh
        entity_id: sensor.solarman_daily_production

      - tag: batteria.percentuale
        entity_id: sensor.solarman_battery_percentage

      - tag: batteria.potenza_kw
        entity_id: sensor.solarman_charge_discharge_power

      - tag: batteria.temperatura
        entity_id: sensor.solarman_battery_temperature

      # ── Energia casa ──────────────────────────────────────────────────────
      - tag: energia.potenza_w
        entity_id: sensor.solarman_power_consumption

      - tag: energia.consumo_kwh
        entity_id: sensor.solarman_today_power_consumption

      - tag: rete.potenza_kw
        entity_id: sensor.solarman_feed_in_out_power

      # ── Sicurezza ─────────────────────────────────────────────────────────
      - tag: garage.aperto
        entity_id: binary_sensor.garagesezionale_garage_door_contact

      - tag: porta.principale
        entity_id: binary_sensor.portoncinodisimpegno

      - tag: ingresso.movimento
        entity_id: binary_sensor.sensore_presenza_ingresso_occupancy

      - tag: movimento.esterno
        entity_id: binary_sensor.casaretrobosco_motion

      - tag: finestra.soggiorno_sx
        entity_id: binary_sensor.portafinestrasoggiornosx

      - tag: finestra.soggiorno_dx
        entity_id: binary_sensor.portafinestrasoggiornodx

      # ── Luci esterne e switch — lettura + write-back ──────────────────────
      - tag: luce.esterno
        entity_id: switch.lampada_cancelletto_mauro
        write_domain: switch
        write_service: turn_on

      - tag: luce.soggiorno
        entity_id: switch.lampada_viale_centrale_2
        write_domain: switch
        write_service: turn_on

      - tag: luce.cucina
        entity_id: switch.lampada_strada_dx_2
        write_domain: switch
        write_service: turn_on

      - tag: ventilatore.camera
        entity_id: switch.presa_laboratorio
        write_domain: switch
        write_service: turn_on

      # ── Sole (attributo) ──────────────────────────────────────────────────
      - tag: sole.elevazione
        entity_id: sun.sun
        attribute: elevation

# ── ALLARMI ───────────────────────────────────────────────────────────────────

alarms:
  - id: alm-caldo
    tag: sala.temperatura
    condition:
      kind: above
      threshold: 27.0
    dead_band: 1.0
    message: "Soggiorno caldo: {value:.1f}°C"
    severity: Warning

  - id: alm-freddo
    tag: sala.temperatura
    condition:
      kind: below
      threshold: 15.0
    dead_band: 1.0
    message: "Soggiorno freddo: {value:.1f}°C"
    severity: Warning

  - id: alm-consumo
    tag: energia.potenza_w
    condition:
      kind: above
      threshold: 5.0
    dead_band: 0.5
    message: "Consumo elevato: {value:.1f} kW"
    severity: Critical

  - id: alm-batteria
    tag: batteria.percentuale
    condition:
      kind: below
      threshold: 15.0
    dead_band: 3.0
    message: "Batteria scarica: {value:.0f}%"
    severity: Warning

  - id: alm-garage
    tag: garage.aperto
    condition:
      kind: bool_true
    message: "Porta garage aperta"
    severity: Warning

  - id: alm-porta
    tag: porta.principale
    condition:
      kind: bool_true
    message: "Portoncino ingresso aperto"
    severity: Info

  - id: alm-movimento-esterno
    tag: movimento.esterno
    condition:
      kind: bool_true
    message: "Movimento rilevato area esterna"
    severity: Info
