id: ha_page1
name: "{{t0078}}"
background: "#0f172a"
width: 1280
height: 800

# La cornice (`cornici/cornice.yaml`) porta il nome della pagina, la lingua,
# l'ora e la navigazione: qui c'è solo il contenuto, fra la testata (56) e il
# piede (740). I testi hanno un riquadro (`text_wrap`) per cadere negli stessi
# pixel sul web e sul pannello.

objects:

# ── Sottotitolo, nella testata accanto al nome della pagina ──────────────────
- id: ha1_sub
  type: text
  x: 240
  y: 8
  width: 660
  height: 40
  text: "{{t0002}}"
  font_size: 14
  text_wrap: true
  text_valign: middle
  color: "#64748b"

# ── CLIMA: due istanze del faceplate «ambiente» ──────────────────────────────
# L'ultima riga del riquadro è l'indice che ogni istanza sceglie: il comfort
# per il soggiorno, il delta per l'esterno.
- id: ha1_amb_sala
  type: faceplate
  faceplate_id: ambiente
  faceplate_params:
    stanza: sala
    titolo: "{{t0007}}"
    indice: clima.comfort_soggiorno
    indice_nome: "{{t0008}}"
  x: 40
  y: 66
  width: 290
  height: 170

- id: ha1_amb_esterno
  type: faceplate
  faceplate_id: ambiente
  faceplate_params:
    stanza: esterno
    titolo: "{{t0009}}"
    indice: clima.delta_interno_esterno
    indice_nome: "{{t0010}}"
  x: 346
  y: 66
  width: 290
  height: 170

