# ── Sottotitolo, la prima riga dell'area libera sotto la testata ─────────────
# Fino al 10-11-2026 stava in testata accanto al nome della pagina: da quel
# giorno le fasce sono riservate alla cornice (R6).
- id: ha3_sub
  type: text
  x: 40
  y: 60
  width: 1200
  height: 24
  text: "{{t0048}}"
  font_size: 14
  text_wrap: true
  text_valign: middle
  color: "#64748b"

# ── TAG DERIVATI — RIEPILOGO ──────────────────────────────────────────────────
# Tre righe con tre formati diversi: restano oggetti della pagina, non un
