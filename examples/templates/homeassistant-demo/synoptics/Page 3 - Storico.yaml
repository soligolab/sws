# ── INFO STORICO ──────────────────────────────────────────────────────────────
- id: ha3_info_box
  type: rect
  x: 40
  y: 360
  width: 710
  height: 170
  fill: "#1e293b"
  stroke: "#334155"
  stroke_width: 1
  rx: 6

- id: ha3_info_hdr
  type: text
  x: 400
  y: 382
  text: "COME USARE LO STORICO"
  font_size: 12
  font_weight: bold
  text_anchor: middle
  color: "#64748b"

- id: ha3_info1
  type: text
  x: 60
  y: 406
  text: "▶  I tag con history: true vengono campionati ogni volta che cambiano e salvati nel DB SQLite di SWS."
  font_size: 11
  color: "#94a3b8"

- id: ha3_info2
  type: text
  x: 60
  y: 426
  text: "▶  In Runtime → pannello Log/Trend puoi visualizzare l'andamento temporale di sala.temperatura, esterno.temperatura, energia.potenza_w."
  font_size: 11
  color: "#94a3b8"

- id: ha3_info3
  type: text
  x: 60
  y: 446
  text: "▶  API REST: GET /api/history/{tag}?from_ms=&to_ms=  — oppure ⬇ CSV dal pannello Trend per export in Excel."
  font_size: 11
  color: "#94a3b8"

- id: ha3_info4
  type: text
  x: 60
  y: 466
  text: "▶  GET /api/history/{tag}/stats?from_ms=&to_ms= restituisce min/max/avg/σ sulla finestra temporale scelta."
  font_size: 11
  color: "#94a3b8"

- id: ha3_info5
  type: text
  x: 60
  y: 496
  text: "Tag derivati (expression): ricalcolati ad ogni aggiornamento di qualsiasi tag — non richiedono history per funzionare."
  font_size: 11
  color: "#7c3aed"

- id: ha3_info6
  type: text
  x: 60
  y: 516
  text: "  Esempio: energia.costo_ora_eur  =  tags['energia.potenza_w'] * 0.25 / 1000"
  font_size: 11
  font_weight: bold
  color: "#6d28d9"
