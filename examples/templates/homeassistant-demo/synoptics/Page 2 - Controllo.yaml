# min_role (Q36) — la luce esterna è visibile da fuori casa, un solo
# esempio nel parco template (revisione template, 15-09-2026): sotto
# Supervisor i due pulsanti restano visibili ma disabilitati. In un
# progetto senza utenti definiti (no-auth) l'editor avvisa già che
# min_role non nega niente a nessuno.
- id: ha2_est_on
  type: button
  x: 423
  y: 230
  width: 70
  height: 36
  label: "{{t0033}}"
  fill: "#d97706"
  tag: luce.esterno
  write_value: true
  min_role: Supervisor
  min_role_effect: disable

