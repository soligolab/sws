# ── RISCALDAMENTO — SLIDER input_number ──────────────────────────────────────
# Slider scrive il valore a riscaldamento.setpoint → HA chiama input_number.set_value

- id: ha2_risc_hdr
  type: text
  x: 590
  y: 70
  text: "RISCALDAMENTO"
  font_size: 13
  font_weight: bold
  text_anchor: middle
  color: "#f87171"

- id: ha2_risc_box
  type: rect
  x: 430
  y: 82
  width: 320
  height: 200
  fill: "#1e293b"
  stroke: "#dc2626"
  stroke_width: 1
  rx: 6

- id: ha2_risc_curr_lbl
  type: text
  x: 450
  y: 110
  text: "Temperatura attuale"
  font_size: 11
  color: "#94a3b8"

- id: ha2_risc_curr
  type: text
  x: 730
  y: 110
  tag: clima.temperatura_attuale
  format: "{value:.1f}°C"
  font_size: 15
  font_weight: bold
  text_anchor: end
  color: "#f87171"

- id: ha2_risc_sp_lbl
  type: text
  x: 450
  y: 140
  text: "Setpoint HA"
  font_size: 11
  color: "#94a3b8"

- id: ha2_risc_sp
  type: text
  x: 730
  y: 140
  tag: clima.setpoint
  format: "{value:.1f}°C"
  font_size: 15
  font_weight: bold
  text_anchor: end
  color: "#fb923c"

- id: ha2_risc_slider_lbl
  type: text
  x: 450
  y: 168
  text: "Nuovo setpoint:"
  font_size: 11
  color: "#94a3b8"

- id: ha2_risc_new
  type: text
  x: 730
  y: 168
  tag: riscaldamento.setpoint
  format: "{value:.1f}°C"
  font_size: 13
  font_weight: bold
  text_anchor: end
  color: "#fbbf24"

- id: ha2_risc_slider
  type: slider
  x: 450
  y: 178
  width: 280
  height: 28
  tag: riscaldamento.setpoint
  min: 15
  max: 30
  step: 0.5
