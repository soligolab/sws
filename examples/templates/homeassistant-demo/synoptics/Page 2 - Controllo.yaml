id: ha_page2
name: "{{t0079}}"
background: "#0f172a"
width: 1280
height: 800

# Ogni comando di questa pagina si usa col ruolo Viewer (R7, 04-11-2026): i
# tag che scrive dichiarano `write_min_role: Viewer` in project.yaml. Fino a
# quel giorno la luce esterna chiedeva Supervisor (`min_role`, Q36): la
# gestione dei permessi la mostrano `openplc-laboratorio` e `homeassistant-pro`.

objects:

# ── Sottotitolo, la prima riga dell'area libera sotto la testata ─────────────
# Fino al 10-11-2026 stava in testata accanto al nome della pagina: da quel
# giorno le fasce sono riservate alla cornice (R6).
- id: ha2_sub
  type: text
  x: 40
  y: 60
  width: 1200
  height: 24
  text: "{{t0030}}"
  font_size: 14
  text_wrap: true
  text_valign: middle
  color: "#64748b"

# ── LUCI: quattro istanze del faceplate «luce» ───────────────────────────────
# Scrivere true al tag → HA chiama switch.turn_on (false → turn_off).
- id: ha2_luci_box
  type: rect
  x: 40
  y: 88
  width: 590
  height: 274
  fill: "#1e293b"
  stroke: "#f59e0b"
  stroke_width: 1
  rx: 6

- id: ha2_luci_hdr
  type: text
  x: 56
  y: 98
  width: 558
  height: 26
  text: "{{t0018}}"
  font_size: 15
  font_weight: bold
  text_wrap: true
  text_valign: middle
  color: "#f59e0b"

- id: ha2_sog
  type: faceplate
  faceplate_id: luce
  faceplate_params:
    etichetta: "{{t0019}}"
    tag: luce.soggiorno
  x: 60
  y: 134
  width: 550
  height: 44

- id: ha2_cuc
  type: faceplate
  faceplate_id: luce
  faceplate_params:
    etichetta: "{{t0020}}"
    tag: luce.cucina
  x: 60
  y: 188
  width: 550
  height: 44

- id: ha2_est
  type: faceplate
  faceplate_id: luce
  faceplate_params:
    etichetta: "{{t0021}}"
    tag: luce.esterno
  x: 60
  y: 242
  width: 550
  height: 44

- id: ha2_vent
  type: faceplate
  faceplate_id: luce
  faceplate_params:
    etichetta: "{{t0023}}"
    tag: ventilatore.camera
  x: 60
  y: 296
  width: 550
  height: 44

