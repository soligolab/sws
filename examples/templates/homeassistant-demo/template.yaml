id: homeassistant-demo
label: "HomeAssistant Demo"
description: "Demo integrazione SWS ↔ HomeAssistant: sensori, binary_sensor, attributi, luci/switch (write bool), input_number (write numerico), tag derivati, allarmi, un tipo «ambiente» con tre istanze e cinque faceplate. 3 pagine con la stessa cornice: Panoramica, Controllo, Storico; ogni comando si usa senza accedere. Sorgente su homeassistant.local:8123, token dalla variabile HA_TOKEN — leggere SETUP.md."
