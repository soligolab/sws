id: homeassistant-demo
label: "HomeAssistant Demo"
description: "Demo integrazione SWS ↔ HomeAssistant: sensori, binary_sensor, attributi, luci/switch (write bool), input_number (write numerico), tag derivati, allarmi, un esempio di min_role (Q36: luce esterna disabilitata sotto Supervisor). 3 pagine: Panoramica, Controllo, Storico. URL/token pre-configurati su 192.168.1.2:8123 — leggere SETUP.md."
