# ══════════════════════════════════════════════════════════════════
# CARD 1 — RACK GARAGE
# ══════════════════════════════════════════════════════════════════
- id: cl3_rg_card
  type: rect
  x: 20
  y: 70
  width: 240
  height: 360
  fill: "#1e293b"
  stroke: "#f59e0b"
  stroke_width: 2

- id: cl3_rg_title
  type: text
  x: 140
  y: 92
  text: "{{rack_garage_2}}"
  font_size: 14
  font_weight: bold
  text_anchor: middle
  color: "#f59e0b"

- id: cl3_rg_led
  type: led
  x: 234
  y: 78
  width: 16
  height: 16
  tag: rack_garage.power
  on_value: 1
  on_color: "#f59e0b"
  off_color: "#374151"

# Gauge potenza
- id: cl3_rg_gauge
  type: gauge
  x: 30
  y: 100
  width: 220
  height: 170
  tag: rack_garage.power
  min: 0
  max: 3000
  unit: "W"
  label: "{{potenza_2}}"
  warn_high: 2000
  alarm_high: 2800

# Tabella misure
- id: cl3_rg_table
  type: table
  x: 28
  y: 278
  width: 224
  height: 140
  label: "{{misure}}"
  table_rows:
    - label: "Tensione"
      tag: rack_garage.voltage
      format: "{value:.1f} V"
    - label: "Corrente"
      tag: rack_garage.current
      format: "{value:.3f} A"
    - label: "Power Factor"
      tag: rack_garage.pf
      format: "{value:.2f}"
    - label: "Energia tot."
      tag: rack_garage.energy
      format: "{value:.1f} kWh"
    - label: "Import"
      tag: rack_garage.import
      format: "{value:.2f} kWh"

