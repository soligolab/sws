meta:
  name: demo-items
  version: 0.2.0
tags:
- id: counter
  description: Test counter (write via PUT /api/tags/counter)
  data_type: float
- id: pump.running
  description: Demo bool flag
  data_type: bool
- id: checkbox
  description: CheckBox
  data_type: bool
- id: demo.button
  description: Bottone demo (publish su sws/demo/echo)
  data_type: bool
- id: demo.led
  description: LED demo (subscribe a sws/demo/echo — echo loop dal broker)
  data_type: bool
- id: demo.rotation
  description: Pilota la rotazione di tutti gli oggetti in Page 3 (gradi 0-360)
  data_type: float
- id: demo.opacity
  description: Pilota l'opacità degli oggetti in Page 3 (0-1)
  data_type: float
- id: demo.label
  description: Etichetta dinamica per i widget di Page 3
  data_type: string
- id: demo.fill_color
  description: Colore fill (#RRGGBB) per oggetti Page 3
  data_type: string
- id: demo.visible
  description: Visibilità live (true/false) — controlla visible su binding
  data_type: bool
- id: demo.on
  description: Stato ON (true/false) — per LED, checkbox, symbol state
  data_type: bool
- id: demo.value
  description: Valore numerico generico (0-100) — per gauge, progress_bar, text
  data_type: float
- id: demo.color
  description: Colore CSS stringa (#RRGGBB) — per colori secondari
  data_type: string
- id: demo.font_size
  description: Dimensione font (8-32) — per text objects
  data_type: float
- id: demo.min
  description: Valore minimo (0-50) — per min binding su gauge/progress_bar/slider
  data_type: float
- id: demo.max
  description: Valore massimo (50-200) — per max binding su gauge/progress_bar/slider
  data_type: float
sources:
- kind: mqtt
  id: mqtt-sws
  host: broker.freemqtt.com
  port: 1883
  client_id: sws-mp41i1lh4sgw
  topics:
  - tag: counter
    topic: sws/counter
  - tag: demo.button
    topic: sws/demo/echo
    publish_topic: sws/demo/echo
  - tag: demo.led
    topic: sws/demo/echo
  username: freemqtt
  password: public
alarms:
- id: counter_high
  tag: counter
  condition:
    kind: above
    threshold: 50.0
  message: Counter sopra soglia (>50)
  severity: Warning
functions:
- id: mp3xiq467vtqt
  name: fnc_CounterUP
  code: |-
    current = tags.read(tag) or 0
    tags.write(tag, current + step)
    print(f"{tag}: {current} -> {current + step}")
  params:
  - name: tag
    default: counter
  - name: step
    default: 1
- id: mp40nvsuc1kyc
  name: fnc_CounterDWN
  code: |-
    current = tags.read(tag) or 0
    tags.write(tag, current - step)
    print(f"{tag}: {current} -> {current - step}")
  params:
  - name: tag
    default: counter
  - name: step
    default: 1

