id: page3
name: Page 3
background: "#0f172a"
width: 900
height: 700
objects:

# ── Navigation header (uniforme su tutte le 4 pagine) ────────────────────────
- id: p3_nav_prev
  type: navbutton
  x: 20
  y: 12
  width: 130
  height: 32
  label: "◀ Precedente"
  target_page: page2
  group_id: g_nav
  locked: true

- id: p3_nav_next
  type: navbutton
  x: 160
  y: 12
  width: 130
  height: 32
  label: "Successiva ▶"
  target_page: page4
  group_id: g_nav
  locked: true

- id: p3_title
  type: text
  x: 400
  y: 30
  text: "Page 3 — Showcase widget con binding"
  font_size: 16
  font_weight: bold
  text_anchor: middle
  color: "#94a3b8"
  group_id: g_nav
  locked: true

# ── Controls (sliders + write buttons) ───────────────────────────────────────
- id: p3_ctrl_rot_lbl
  type: text
  x: 20
  y: 62
  text: "Rotazione (0-360°)"
  font_size: 11
  color: "#64748b"

- id: ctrl_rot
  type: slider
  x: 20
  y: 72
  width: 200
  height: 36
  tag: demo.rotation
  min: 0
  max: 360
  step: 1
  show_value: true
  unit: "°"

- id: p3_ctrl_opa_lbl
  type: text
  x: 235
  y: 62
  text: "Opacità (0-1)"
  font_size: 11
  color: "#64748b"

- id: ctrl_opa
  type: slider
  x: 235
  y: 72
  width: 160
  height: 36
  tag: demo.opacity
  min: 0
  max: 1
  step: 0.05
  show_value: true

- id: p3_ctrl_val_lbl
  type: text
  x: 410
  y: 62
  text: "Valore (0-100)"
  font_size: 11
  color: "#64748b"

- id: ctrl_val
  type: slider
  x: 410
  y: 72
  width: 160
  height: 36
  tag: demo.value
  min: 0
  max: 100
  step: 1
  show_value: true

- id: p3_btn_on
  type: button
  x: 585
  y: 72
  width: 80
  height: 32
  label: "Toggle ON"
  fill: "#16a34a"
  tag: demo.on
  write_value: true

- id: p3_btn_off
  type: button
  x: 675
  y: 72
  width: 84
  height: 32
  label: "Toggle OFF"
  fill: "#dc2626"
  tag: demo.on
  write_value: false

- id: p3_btn_blu
  type: button
  x: 480
  y: 115
  width: 60
  height: 26
  label: "Blu"
  fill: "#2563eb"
  tag: demo.fill_color
  write_value: "#2563eb"

- id: p3_btn_verde
  type: button
  x: 550
  y: 115
  width: 60
  height: 26
  label: "Verde"
  fill: "#16a34a"
  tag: demo.fill_color
  write_value: "#16a34a"

- id: p3_btn_rosso
  type: button
  x: 620
  y: 115
  width: 60
  height: 26
  label: "Rosso"
  fill: "#dc2626"
  tag: demo.fill_color
  write_value: "#dc2626"

# ── Status readouts ───────────────────────────────────────────────────────────
- id: p3_status_rot
  type: text
  x: 20
  y: 127
  tag: demo.rotation
  format: "rot={value:.0f}°"
  font_size: 10
  color: "#3b82f6"

- id: p3_status_val
  type: text
  x: 110
  y: 127
  tag: demo.value
  format: "val={value:.0f}"
  font_size: 10
  color: "#22c55e"

- id: p3_status_on
  type: text
  x: 200
  y: 127
  tag: demo.on
  format: "on={value}"
  font_size: 10
  color: "#f59e0b"

- id: p3_status_lbl
  type: text
  x: 290
  y: 127
  tag: demo.label
  format: "label=\"{value}\""
  font_size: 10
  color: "#a78bfa"

# ── Row 1: rect · ellipse · line · text ──────────────────────────────────────
- id: p3_rect
  type: rect
  x: 30
  y: 155
  width: 90
  height: 56
  fill: "#3b82f6"
  bindings:
    fill: demo.fill_color
    rotation: demo.rotation
    opacity: demo.opacity
    visible: demo.visible

- id: p3_rect_lbl
  type: text
  x: 75
  y: 220
  text: "rect"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_ellipse
  type: ellipse
  x: 150
  y: 155
  width: 90
  height: 56
  fill: "#8b5cf6"
  bindings:
    fill: demo.color
    rotation: demo.rotation
    opacity: demo.opacity

- id: p3_ellipse_lbl
  type: text
  x: 195
  y: 220
  text: "ellipse"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_line
  type: line
  x: 270
  y: 160
  x2: 360
  y2: 210
  stroke: "#f59e0b"
  stroke_width: 3
  bindings:
    stroke: demo.color
    opacity: demo.opacity

- id: p3_line_lbl
  type: text
  x: 315
  y: 220
  text: "line"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_text
  type: text
  x: 400
  y: 185
  text: "Testo"
  font_size: 18
  font_weight: "bold"
  color: "#f59e0b"
  bindings:
    text: demo.label
    font_size: demo.font_size
    color: demo.color
    rotation: demo.rotation
    opacity: demo.opacity

- id: p3_text_lbl
  type: text
  x: 415
  y: 220
  text: "text"
  font_size: 9
  color: "#475569"

# ── Row 2: button · navbutton · led · progress_bar ───────────────────────────
- id: p3_button
  type: button
  x: 30
  y: 240
  width: 100
  height: 36
  label: "Click"
  fill: "#059669"
  bindings:
    label: demo.label
    fill: demo.fill_color
    opacity: demo.opacity

- id: p3_button_lbl
  type: text
  x: 80
  y: 286
  text: "button"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_navbutton
  type: navbutton
  x: 145
  y: 240
  width: 120
  height: 36
  label: "Page 1"
  target_page: page1
  bindings:
    label: demo.label
    opacity: demo.opacity

- id: p3_navbutton_lbl
  type: text
  x: 205
  y: 286
  text: "navbutton"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_led
  type: led
  x: 296
  y: 248
  width: 36
  height: 36
  tag: demo.on
  on_value: true
  on_color: "#22c55e"
  off_color: "#334155"
  bindings:
    on_color: demo.color
    opacity: demo.opacity

- id: p3_led_lbl
  type: text
  x: 314
  y: 294
  text: "led"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_progress_bar
  type: progress_bar
  x: 350
  y: 252
  width: 200
  height: 28
  tag: demo.value
  min: 0
  max: 100
  fill: "#3b82f6"
  bindings:
    fill: demo.fill_color
    min: demo.min
    max: demo.max
    opacity: demo.opacity

- id: p3_pbar_lbl
  type: text
  x: 450
  y: 290
  text: "progress_bar"
  font_size: 9
  text_anchor: middle
  color: "#475569"

# ── Row 3: gauge · slider · checkbox · radio ─────────────────────────────────
- id: p3_gauge
  type: gauge
  x: 20
  y: 310
  width: 130
  height: 110
  tag: demo.value
  min: 0
  max: 100
  unit: ""
  label: "Valore"
  bindings:
    label: demo.label
    opacity: demo.opacity

- id: p3_gauge_lbl
  type: text
  x: 85
  y: 430
  text: "gauge"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_slider
  type: slider
  x: 168
  y: 330
  width: 180
  height: 36
  tag: demo.rotation
  min: 0
  max: 360
  step: 1
  show_value: true
  unit: "°"
  bindings:
    min: demo.min
    max: demo.max
    opacity: demo.opacity

- id: p3_slider_lbl
  type: text
  x: 258
  y: 375
  text: "slider"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_checkbox
  type: checkbox
  x: 370
  y: 330
  width: 140
  height: 32
  tag: demo.on
  label: "Stato ON"
  bindings:
    label: demo.label
    opacity: demo.opacity

- id: p3_checkbox_lbl
  type: text
  x: 440
  y: 372
  text: "checkbox"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_radio
  type: radio
  x: 525
  y: 325
  width: 160
  height: 70
  label: "Scelta"
  options:
  - value: "a"
    label: "Opzione A"
  - value: "b"
    label: "Opzione B"
  bindings:
    label: demo.label
    opacity: demo.opacity

- id: p3_radio_lbl
  type: text
  x: 605
  y: 404
  text: "radio"
  font_size: 9
  text_anchor: middle
  color: "#475569"

# ── Row 4: table · symbol · image ────────────────────────────────────────────
- id: p3_table
  type: table
  x: 20
  y: 450
  width: 230
  height: 110
  label: "TAG LIVE"
  table_rows:
  - label: "Rotazione"
    tag: demo.rotation
    format: "{value:.0f}°"
  - label: "Valore"
    tag: demo.value
    format: "{value:.0f}"
  - label: "Label"
    tag: demo.label
    format: "{value}"
  bindings:
    opacity: demo.opacity

- id: p3_table_lbl
  type: text
  x: 135
  y: 568
  text: "table"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_symbol
  type: symbol
  x: 275
  y: 455
  width: 90
  height: 90
  symbol_id: pump
  state_tag: demo.on
  state_off_color: "#64748b"
  state_on_color: "#22c55e"
  state_alarm_color: "#ef4444"
  bindings:
    state_on_color: demo.color
    rotation: demo.rotation
    opacity: demo.opacity

- id: p3_symbol_lbl
  type: text
  x: 320
  y: 554
  text: "symbol"
  font_size: 9
  text_anchor: middle
  color: "#475569"

- id: p3_image
  type: image
  x: 390
  y: 455
  width: 90
  height: 90
  src: "/symbols/iso_valve_gate.svg"
  bindings:
    rotation: demo.rotation
    opacity: demo.opacity

- id: p3_image_lbl
  type: text
  x: 435
  y: 554
  text: "image"
  font_size: 9
  text_anchor: middle
  color: "#475569"

groups:
- id: g_nav
  name: Navigazione
