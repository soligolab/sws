id: page1
name: Page 1
background: "#0f172a"
objects:

# ── Navigation header (uniforme su tutte le 4 pagine) ────────────────────────
- id: p1_nav_prev
  type: navbutton
  x: 20
  y: 12
  width: 130
  height: 32
  label: "◀ Precedente"
  target_page: page4

- id: p1_nav_next
  type: navbutton
  x: 160
  y: 12
  width: 130
  height: 32
  label: "Successiva ▶"
  target_page: page2

- id: p1_title
  type: text
  x: 400
  y: 30
  text: "Page 1 — Counter + MQTT echo"
  font_size: 16
  font_weight: bold
  text_anchor: middle
  color: "#94a3b8"

# ── Counter demo (rect + ellipse cliccabili eseguono fnc_CounterUP/DWN) ──────
- id: mp2n4a4pjy9lx
  type: rect
  x: 50.0
  y: 100.0
  width: 150.0
  height: 80.0
  fill: '#0de34d'
  stroke_width: 10.0
  tag: ''
  z_index: 0
  visible: true
  on_press_fn: fnc_CounterUP
  on_press_args:
    step: 1
    tag: counter

- id: mp2n4bw82jsup
  type: ellipse
  x: 260.0
  y: 100.0
  width: 120.0
  height: 80.0
  fill: '#d94a58'
  stroke_width: 14.0
  on_press_fn: fnc_CounterDWN
  on_press_args:
    step: 1
    tag: counter

- id: mp2n4p2oo3eji
  name: Testo1
  type: text
  x: 110.0
  y: 74.0
  tag: ''
  format: '{value}'
  text: PROVA
  font_size: 29.0
  font_weight: bold
  text_anchor: middle
  color: '#fe7cb0'

- id: mp2n4urb1wxom
  name: Testo2
  type: text
  x: 340.0
  y: 70.0
  tag: ''
  format: '{value}'
  text: Testo2
  font_size: 18.0
  font_weight: 500
  text_anchor: end
  color: '#6f66ea'

# ── Counter buttons + trend + slider ─────────────────────────────────────────
- id: mp2n9moeibfbd
  name: btn_up
  type: button
  x: 40.0
  y: 480.0
  width: 120.0
  height: 40.0
  fill: '#3b82f6'
  label: Btn. UP
  write_value: true
  z_index: 0
  visible: true
  on_press_fn: fnc_CounterUP
  on_press_args:
    step: 1
    tag: counter

- id: mp2qxd8wnhhvd
  type: trend
  x: 50.0
  y: 260.0
  width: 360.0
  height: 180.0
  tag: counter
  window_s: 60.0
  line_color: '#3b82f6'

- id: mp418jufeyrgp
  name: btn_down
  type: button
  x: 40.0
  y: 560.0
  width: 120.0
  height: 40.0
  fill: '#3b82f6'
  label: Btn. DOWN
  write_value: true
  z_index: 0
  visible: true
  on_press_fn: fnc_CounterDWN
  on_press_args:
    step: 1
    tag: counter

- id: mp419rk9ccuoq
  type: text
  x: 240.0
  y: 520.0
  tag: counter
  text: Testo
  font_size: 47.0
  text_anchor: start
  color: '#e2e8f0'

- id: mp41go31str7o
  type: slider
  x: 200.0
  y: 560.0
  width: 200.0
  height: 40.0
  tag: counter
  min: 0.0
  max: 100.0
  step: 1.0
  orientation: horizontal

# ── MQTT echo round-trip ─────────────────────────────────────────────────────
- id: demo_btn_mqtt
  name: btn_mqtt_LED_ON
  type: button
  x: 440.0
  y: 480.0
  width: 120.0
  height: 40.0
  fill: '#1e3a8a'
  tag: demo.button
  label: MQTT LED ON
  write_value: true
  z_index: 0
  visible: true

- id: demo_led_mqtt
  name: led_mqtt
  type: led
  x: 590.0
  y: 488.0
  width: 28.0
  height: 28.0
  tag: demo.led
  on_value: true
  on_color: '#16a34a'
  off_color: '#475569'
  z_index: 0
  visible: true

- id: mp46ves28pw2o
  name: btn_mqtt_LED_OFF
  type: button
  x: 440.0
  y: 530.0
  width: 120.0
  height: 40.0
  fill: '#1e3a8a'
  tag: demo.button
  label: MQTT LED OFF
  write_value: false
  z_index: 0
  visible: true

# ── Gauge + symbol ────────────────────────────────────────────────────────────
- id: mp473mff8fhkw
