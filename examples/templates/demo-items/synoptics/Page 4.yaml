id: page4
name: Page 4
background: "#0f172a"
width: 800
height: 600
objects:

# ── Navigation header (uniforme su tutte le 4 pagine) ────────────────────────
- id: p4_nav_prev
  type: navbutton
  x: 20
  y: 12
  width: 130
  height: 32
  label: "{{precedente}}"
  target_page: page3
  group_id: g_nav
  locked: true

- id: p4_nav_next
  type: navbutton
  x: 160
  y: 12
  width: 130
  height: 32
  label: "{{successiva}}"
  target_page: page1
  group_id: g_nav
  locked: true

- id: p4_title
  type: text
  x: 400
  y: 30
  text: "{{page_4_fill_color_dinamico}}"
  font_size: 16
  font_weight: bold
  text_anchor: middle
  color: "#94a3b8"
  group_id: g_nav
  locked: true

# ── Color picker: pulsanti preset ────────────────────────────────────────────
- id: p4_lbl_picker
  type: text
  x: 20
  y: 65
  text: "{{scegli_un_colore_scrivi_demo_fill_color}}"
  font_size: 12
  color: "#64748b"

- id: p4_btn_red
  type: button
  x: 20
  y: 82
  width: 90
  height: 36
  label: "{{rosso_2}}"
  fill: "#dc2626"
  tag: demo.fill_color
  write_value: "#dc2626"

- id: p4_btn_green
  type: button
  x: 120
  y: 82
  width: 90
  height: 36
  label: "{{verde_2}}"
  fill: "#16a34a"
  tag: demo.fill_color
  write_value: "#16a34a"

- id: p4_btn_blue
  type: button
  x: 220
  y: 82
  width: 90
  height: 36
  label: "{{blu_2}}"
  fill: "#2563eb"
  tag: demo.fill_color
  write_value: "#2563eb"

- id: p4_btn_orange
  type: button
  x: 320
  y: 82
  width: 90
  height: 36
  label: "{{arancio}}"
  fill: "#ea580c"
  tag: demo.fill_color
  write_value: "#ea580c"

- id: p4_btn_purple
  type: button
  x: 420
  y: 82
  width: 90
  height: 36
  label: "{{viola}}"
  fill: "#9333ea"
  tag: demo.fill_color
  write_value: "#9333ea"

- id: p4_btn_teal
  type: button
  x: 520
  y: 82
  width: 90
  height: 36
  label: "{{teal}}"
  fill: "#0d9488"
  tag: demo.fill_color
  write_value: "#0d9488"

# ── Status: mostra il valore corrente del tag ─────────────────────────────────
- id: p4_color_val
  type: text
  x: 630
  y: 100
  tag: demo.fill_color
  format: "fill = {value}"
  font_size: 12
  color: "#3b82f6"

# ── Anteprima live: oggetti con fill bindato a demo.fill_color ────────────────
- id: p4_preview_lbl
  type: text
  x: 20
  y: 148
  text: "{{anteprima_live_fill_demo_fill_color}}"
  font_size: 12
  color: "#64748b"

- id: p4_rect
  type: rect
  x: 20
  y: 165
  width: 120
  height: 80
  fill: "#3b82f6"
  transition_duration_ms: 300
  bindings:
    fill: demo.fill_color

- id: p4_rect_lbl
  type: text
  x: 80
  y: 260
  text: "{{rect}}"
  font_size: 10
  text_anchor: middle
  color: "#475569"

- id: p4_ellipse
  type: ellipse
  x: 160
  y: 165
  width: 120
  height: 80
  fill: "#3b82f6"
  transition_duration_ms: 300
  bindings:
    fill: demo.fill_color

- id: p4_ellipse_lbl
  type: text
  x: 220
  y: 260
  text: "{{ellipse}}"
  font_size: 10
  text_anchor: middle
  color: "#475569"

- id: p4_button
  type: button
  x: 300
  y: 165
  width: 120
  height: 40
  label: "{{bottone}}"
  fill: "#3b82f6"
  bindings:
    fill: demo.fill_color

- id: p4_button_lbl
  type: text
  x: 360
  y: 260
  text: "{{button}}"
  font_size: 10
  text_anchor: middle
  color: "#475569"

- id: p4_pbar
  type: progress_bar
  x: 440
  y: 185
  width: 200
  height: 30
  tag: demo.rotation
  min: 0
  max: 360
  unit: "°"
  fill: "#3b82f6"
  bindings:
    fill: demo.fill_color

- id: p4_pbar_lbl
  type: text
  x: 540
  y: 260
  text: "{{progress_bar}}"
  font_size: 10
  text_anchor: middle
  color: "#475569"

# ── Nota ─────────────────────────────────────────────────────────────────────
- id: p4_note
  type: text
  x: 20
  y: 290
  text: "{{il_tag_demo_fill_color_e_condiviso_con_p}}"
  font_size: 11
  color: "#475569"

groups:
- id: g_nav
  name: Navigazione
