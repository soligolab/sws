# ══════════════════════════════════════════════════════════════════
# TABELLA NODI — un widget `table` invece di 24 `text` posizionati a mano
# (revisione template, 15-09-2026): stesso mapping NodeId → tag → valore →
# unità, la colonna NodeId è nel label perché il widget non ne ha una a
# parte — vedi il README del template per il ruolo di questa pagina.
# ══════════════════════════════════════════════════════════════════
- id: o2_table
  type: table
  x: 30
  y: 80
  width: 810
  height: 175
  table_label_header: "NodeId → Tag SWS"
  table_columns: ["label", "value", "unit"]
  table_rows:
    - label: "ns=1;s=Temperature → sim.temperature"
      tag: sim.temperature
      unit: "°C"
    - label: "ns=1;s=Pressure → sim.pressure"
      tag: sim.pressure
      unit: "kPa"
    - label: "ns=2;s=CycleTime → sim.cycle_time"
      tag: sim.cycle_time
      unit: "s (Euromap 77)"
    - label: "ns=2;s=MachineState → sim.machine_state"
      tag: sim.machine_state
      unit: "string"
    - label: "ns=2;s=MachineReady → sim.machine_ready"
      tag: sim.machine_ready
      unit: "bool"

# Hint Euromap detect
- id: o2_hint
  type: text
  x: 30
  y: 290
  text: "{{t0014}}"
  font_size: 11
  color: "#94a3b8"

- id: o2_hint2
  type: text
  x: 30
  y: 312
  text: "{{t0015}}"
  font_size: 11
  color: "#94a3b8"

# ══════════════════════════════════════════════════════════════════
