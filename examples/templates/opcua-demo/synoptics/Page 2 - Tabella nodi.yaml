# ══════════════════════════════════════════════════════════════════
# HEADER
# ══════════════════════════════════════════════════════════════════
- id: o2_title
  type: text
  x: 640
  y: 33
  text: "{{t0011}}"
  font_size: 28
  font_weight: bold
  text_anchor: middle
  color: "#38bdf8"
  group_id: g_nav
  locked: true

- id: o2_nav_back
  type: navbutton
  x: 61
  y: 19
  width: 248
  height: 41
  label: "{{t0012}}"
  target_page: opc_page1
  group_id: g_nav
  locked: true

- id: o2_subtitle
  type: text
  x: 640
  y: 69
  text: "{{t0013}}"
  font_size: 15
  text_anchor: middle
  color: "#475569"

# ══════════════════════════════════════════════════════════════════
# TABELLA NODI — un widget `table` invece di 24 `text` posizionati a mano
# (revisione template, 15-09-2026): stesso mapping NodeId → tag → valore →
# unità, la colonna NodeId è nel label perché il widget non ne ha una a
# parte — vedi il README del template per il ruolo di questa pagina.
# ══════════════════════════════════════════════════════════════════
- id: o2_table
  type: table
  x: 74
  y: 110
  width: 1117
  height: 241
  table_label_header: "{{t0019}}"
  table_columns: ["label", "value", "unit"]
  table_rows:
    - label: "{{t0020}}"
      tag: sim.temperature
      unit: "°C"
    - label: "{{t0021}}"
      tag: sim.pressure
      unit: "kPa"
    - label: "{{t0022}}"
      tag: sim.cycle_time
      unit: "{{t0025}}"
    - label: "{{t0023}}"
      tag: sim.machine_state
      unit: "{{t0026}}"
    - label: "{{t0024}}"
      tag: sim.machine_ready
      unit: "{{t0027}}"

# Hint Euromap detect
- id: o2_hint
  type: text
  x: 74
  y: 400
  text: "{{t0014}}"
  font_size: 15
  color: "#94a3b8"

- id: o2_hint2
  type: text
  x: 74
  y: 430
  text: "{{t0015}}"
  font_size: 15
  color: "#94a3b8"

# ══════════════════════════════════════════════════════════════════
# FOOTER
# ══════════════════════════════════════════════════════════════════
- id: o2_footer
  type: text
  x: 640
  y: 745
  text: "{{t0016}}"
  font_size: 12
  text_anchor: middle
  color: "#334155"

groups:
- id: g_nav
  name: Navigazione
