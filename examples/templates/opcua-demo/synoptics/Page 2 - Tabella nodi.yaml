# La pagina Tabella nodi (04-11-2026, regola R6 dei template): il nome della
# pagina, la lingua, l'ora e la navigazione li porta la cornice
# (`cornici/cornice.yaml`), quindi il titolo e il bottone «◀ Live» che stavano
# qui non ci sono più. Il contenuto sta fra le due fasce, da y 56 a 740.
id: opc_page2
name: '{{t0003}}'
background: "#0f172a"
width: 1280
height: 800
objects:
- id: o2_subtitle
  type: text
  x: 74
  y: 70
  width: 1117
  height: 28
  text_wrap: true
  text_valign: middle
  text: "{{t0013}}"
  font_size: 15
  text_anchor: middle
  color: "#64748b"

# ══════════════════════════════════════════════════════════════════
# TABELLA NODI — un widget `table` invece di 24 `text` posizionati a mano
# (revisione template, 15-09-2026): stesso mapping NodeId → tag → valore →
# unità, la colonna NodeId è nel label perché il widget non ne ha una a
# parte — vedi il README del template per il ruolo di questa pagina.
# Alta quanto le cinque righe (04-11-2026): a 241 restava mezza vuota.
# ══════════════════════════════════════════════════════════════════
- id: o2_table
  type: table
  x: 74
  y: 110
  width: 1117
  height: 170
  table_label_header: "{{t0019}}"
  table_columns: ["label", "value", "unit"]
  table_rows:
    - label: "{{t0020}}"
      tag: sim.temperature
      unit: "°C"
    - label: "{{t0021}}"
      tag: sim.pressure
      unit: "kPa"
    - label: "{{t0022}}"
      tag: sim.cycle_time
      unit: "s"
    - label: "{{t0023}}"
      tag: sim.machine_state
      unit: "{{t0026}}"
    - label: "{{t0024}}"
      tag: sim.machine_ready
      unit: "{{t0027}}"

