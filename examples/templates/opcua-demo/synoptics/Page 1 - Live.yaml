# La pagina Live (04-11-2026, regola R6 dei template): il nome della pagina, la
# lingua, l'ora e la navigazione li porta la cornice (`cornici/cornice.yaml`),
# quindi il titolo, il selettore di lingua e il bottone «Tabella nodi ▶» che
# stavano qui non ci sono più. Il contenuto sta fra le due fasce, da y 56 a 740.
id: opc_page1
name: '{{t0012}}'
background: "#0f172a"
width: 1280
height: 800
objects:
- id: o1_subtitle
  type: text
  x: 131
  y: 64
  width: 1018
  height: 24
  text_wrap: true
  text_valign: middle
  text: "{{t0002}}"
  font_size: 13
  text_anchor: middle
  color: "#64748b"

# ══════════════════════════════════════════════════════════════════
# RIGA 1 — Gauge temperatura + pressione
# ══════════════════════════════════════════════════════════════════
- id: o1_gauge_temp
  type: gauge
  x: 131
  y: 96
  width: 250
  height: 250
  label: "{{t0004}}"
  tag: sim.temperature
  min: -20
  max: 80
  warn_high: 50
  alarm_high: 60
  transition_duration_ms: 250

- id: o1_gauge_pressure
  type: gauge
  x: 422
  y: 96
  width: 250
  height: 250
  label: "{{t0005}}"
  tag: sim.pressure
  min: 0
  max: 10
  warn_high: 6.0
  alarm_high: 8.0
  transition_duration_ms: 250

# Stato macchina (testuale) + LED ready. Testi in un riquadro: senza, `y` è la
# linea di base sul web e la cima sul pannello, e i due motori li mettono a
# un'altezza diversa.
- id: o1_state_lbl
  type: text
  x: 725
  y: 108
  width: 280
  height: 22
  text_wrap: true
  text_valign: middle
  text: "{{t0006}}"
  font_size: 13
  color: "#64748b"

- id: o1_state_val
  type: text
  x: 725
  y: 132
  width: 280
  height: 48
  text_wrap: true
  text_valign: middle
  tag: sim.machine_state
  format: "{value}"
  font_size: 34
  font_weight: bold
  color: "#e2e8f0"
  transition_duration_ms: 200

- id: o1_ready_lbl
  type: text
  x: 725
  y: 204
  width: 100
  height: 22
  text_wrap: true
  text_valign: middle
  text: "{{t0007}}"
  font_size: 13
  color: "#64748b"

- id: o1_ready_led
  type: led
  x: 725
  y: 230
  width: 44
  height: 44
  tag: sim.machine_ready
  on_value: true
  on_color: "#22c55e"
  off_color: "#475569"

- id: o1_cycle_lbl
  type: text
  x: 834
  y: 204
  width: 170
  height: 22
  text_wrap: true
  text_valign: middle
  text: "{{t0008}}"
  font_size: 13
  color: "#64748b"

- id: o1_cycle_val
  type: text
  x: 834
  y: 230
  width: 170
  height: 44
  text_wrap: true
  text_valign: middle
  tag: sim.cycle_time
  format: "{value:.1f} s"
  font_size: 24
  font_weight: bold
  color: "#fbbf24"

# Simbolo pompa pilotato dal flag ready
- id: o1_pump
  type: symbol
  x: 1028
  y: 140
  width: 121
  height: 121
  symbol_id: pump
  state_tag: sim.machine_ready
  state_off_color: "#64748b"
  state_on_color: "#22c55e"
  state_alarm_color: "#ef4444"
  transition_duration_ms: 300

# ══════════════════════════════════════════════════════════════════
# RIGA 2 — Trend live multi-tag
# ══════════════════════════════════════════════════════════════════
- id: o1_trend_lbl
  type: text
  x: 131
  y: 356
  width: 1018
  height: 24
  text_wrap: true
  text_valign: middle
  text: "{{t0009}}"
  font_size: 15
  color: "#94a3b8"

- id: o1_trend
  type: trend
  x: 131
  y: 382
  width: 1018
  height: 228
  tag: sim.temperature
  extra_tags:
    - sim.pressure
  window_s: 120
  line_color: "#38bdf8"

# ══════════════════════════════════════════════════════════════════
# RIGA 3 — Allarmi e nota sull'endpoint, sopra il piede della cornice
# ══════════════════════════════════════════════════════════════════
- id: o1_alarm_bell
  type: alarm_bell
  x: 131
  y: 622
  width: 158
  height: 44
  alarm_bell_show_history: true
  alarm_bell_show_shelve: true
- id: o1_alarm_banner
  type: alarm_banner
  x: 305
  y: 622
  width: 844
  height: 70
- id: o1_footer
  type: text
  x: 131
  y: 704
  width: 1018
  height: 24
  text_wrap: true
  text_valign: middle
  text: "{{t0010}}"
  font_size: 11
  text_anchor: middle
  color: "#64748b"
