id: opc_page1
name: "Live"
background: "#0f172a"
width: 1280
height: 800
objects:
- id: lang_sel_auto
  type: lang_selector
  x: 1055
  y: 10
  width: 109
  height: 32

# ══════════════════════════════════════════════════════════════════
# HEADER
# ══════════════════════════════════════════════════════════════════
- id: o1_title
  type: text
  x: 640
  y: 29
  text: "{{t0001}}"
  font_size: 24
  font_weight: bold
  text_anchor: middle
  color: "#38bdf8"
  group_id: g_nav
  locked: true

- id: o1_subtitle
  type: text
  x: 640
  y: 53
  text: "{{t0002}}"
  font_size: 13
  text_anchor: middle
  color: "#475569"
  group_id: g_nav
  locked: true

- id: o1_nav_table
  type: navbutton
  x: 931
  y: 17
  width: 218
  height: 36
  label: "{{t0003}}"
  target_page: opc_page2
  group_id: g_nav
  locked: true

# ══════════════════════════════════════════════════════════════════
# RIGA 1 — Gauge temperatura + pressione
# ══════════════════════════════════════════════════════════════════
- id: o1_gauge_temp
  type: gauge
  x: 131
  y: 85
  width: 267
  height: 267
  label: "{{t0004}}"
  tag: sim.temperature
  min: -20
  max: 80
  warn_high: 50
  alarm_high: 60
  transition_duration_ms: 250

- id: o1_gauge_pressure
  type: gauge
  x: 422
  y: 85
  width: 267
  height: 267
  label: "{{t0005}}"
  tag: sim.pressure
  min: 0
  max: 10
  warn_high: 6.0
  alarm_high: 8.0
  transition_duration_ms: 250

# Stato macchina (testuale) + LED ready
- id: o1_state_lbl
  type: text
  x: 725
  y: 115
  text: "{{t0006}}"
  font_size: 13
  color: "#64748b"

- id: o1_state_val
  type: text
  x: 725
  y: 158
  tag: sim.machine_state
  format: "{value}"
  font_size: 34
  font_weight: bold
  color: "#e2e8f0"
  transition_duration_ms: 200

- id: o1_ready_lbl
  type: text
  x: 725
  y: 212
  text: "{{t0007}}"
  font_size: 13
  color: "#64748b"

- id: o1_ready_led
  type: led
  x: 725
  y: 233
  width: 44
  height: 44
  tag: sim.machine_ready
  on_value: true
  on_color: "#22c55e"
  off_color: "#475569"

- id: o1_cycle_lbl
  type: text
  x: 834
  y: 212
  text: "{{t0008}}"
  font_size: 13
  color: "#64748b"

- id: o1_cycle_val
  type: text
  x: 834
  y: 248
  tag: sim.cycle_time
  format: "{value:.1f} s"
  font_size: 24
  font_weight: bold
  color: "#fbbf24"

# Simbolo pompa pilotato dal flag ready
- id: o1_pump
  type: symbol
  x: 1028
  y: 158
  width: 121
  height: 121
  symbol_id: pump
  state_tag: sim.machine_ready
  state_off_color: "#64748b"
  state_on_color: "#22c55e"
  state_alarm_color: "#ef4444"
  transition_duration_ms: 300

# ══════════════════════════════════════════════════════════════════
# RIGA 2 — Trend live multi-tag
# ══════════════════════════════════════════════════════════════════
- id: o1_trend_lbl
  type: text
  x: 131
  y: 376
  text: "{{t0009}}"
  font_size: 15
  color: "#94a3b8"

- id: o1_trend
  type: trend
  x: 131
  y: 394
  width: 1018
  height: 291
  tag: sim.temperature
  extra_tags:
    - sim.pressure
  window_s: 120
  line_color: "#38bdf8"

# ══════════════════════════════════════════════════════════════════
# FOOTER hint
# ══════════════════════════════════════════════════════════════════
- id: o1_footer
  type: text
  x: 640
  y: 727
  text: "{{t0010}}"
  font_size: 11
  text_anchor: middle
  color: "#334155"
- id: o1_alarm_bell
  type: alarm_bell
  x: 130.9
  y: 625.5
  width: 157.6
  height: 41.2
  alarm_bell_show_history: true
  alarm_bell_show_shelve: true
- id: o1_alarm_banner
  type: alarm_banner
  x: 130.9
  y: 690.9
  width: 1018.2
  height: 84.8

groups:
- id: g_nav
  name: Navigazione
