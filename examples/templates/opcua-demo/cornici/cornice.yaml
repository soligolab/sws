# La cornice delle due pagine (04-11-2026, regola R6 dei template), dal modello di
# `openplc-laboratorio` con i colori di questo template: in testata il nome della
# pagina (tradotto, perché i nomi sono token), la lingua, la data con l'ora; nel
# piede un bottone per pagina, che il navigatore trova da sé. Il contenuto sta fra
# le due fasce, da y 56 a 740. La testata è uguale a quella degli altri tre banchi
# di protocollo (enip, s7, sparkplug), che hanno una pagina sola e niente piede.
id: cornice
nome: Cornice
larghezza: 1280.0
altezza: 800.0
testata:
  altezza: 56.0
  sfondo: '#1e293b'
piede:
  altezza: 60.0
  sfondo: '#1e293b'
oggetti:
# Il titolo in un riquadro alto quanto la testata e centrato in verticale: un testo
# senza riquadro ha `y` sulla linea di base sul web e in cima sul pannello.
- id: titolo
  type: text
  x: 20.0
  y: 0.0
  width: 700.0
  height: 56.0
  text_wrap: true
  text_valign: middle
  text: '{{pagina.nome}}'
  font_size: 22.0
  font_weight: bold
  text_anchor: start
  color: '#e2e8f0'
- id: lingua
  type: lang_selector
  x: 924.0
  y: 11.0
  width: 116.0
  height: 34.0
- id: data_ora
  type: clock
  x: 1060.0
  y: 10.0
  width: 200.0
  height: 36.0
  font_size: 18.0
  text_anchor: end
  color: '#e2e8f0'
  clock_formato: data_ora
# La voce attiva è azzurra col testo scuro, l'azzurro del template: col testo di
# riserva, sul fondo ardesia, il nome della pagina attiva non si leggerebbe.
- id: navigatore
  type: page_navigator
  x: 10.0
  y: 748.0
  width: 1260.0
  height: 44.0
  nav_orientation: horizontal
  nav_fill: true
  nav_gap: 4.0
  font_size: 13.0
  fill: '#0f172a'
  stroke: '#334155'
  color: '#cbd5e1'
  nav_active_fill: '#38bdf8'
  nav_active_color: '#0f172a'
