      en: Tank level above high threshold
      es: Nivel del depósito por encima del umbral alto
      it: Livello del serbatoio oltre la soglia alta
    auto:
    - es
    - en
  - key: t0011
    values:
      en: Plant
      es: Planta
      it: Impianto
  - key: t0012
    values:
      en: Trends
      es: Tendencias
      it: Andamento
  - key: t0013
    values:
      en: Parameters
      es: Parámetros
      it: Parametri
  - key: t0014
