      en: The «openplc» source has not answered for a minute
      es: La fuente «openplc» no responde desde hace un minuto
      it: La sorgente «openplc» non risponde da un minuto
page_layout:
  home_page_id: page-1a19f19beef1
  size_mode: fixed
  default_width: 1280.0
  default_height: 800.0
  page_tree:
  - id: page-1a19f19beef1
  - id: mw06f05d9xqy2
  - id: mw0g08zp68mnv
  cornice_predefinita: cornice
