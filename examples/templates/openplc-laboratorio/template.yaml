id: openplc-laboratorio
label: "OpenPLC — impianto di prova"
description: "Il progetto del tutorial del manuale: una pompa che riempie un serbatoio, letta da OpenPLC Runtime v4 in Modbus TCP, OPC UA e S7, con un sensore e la pubblicazione su MQTT, allarmi, storico e una finestra per la soglia. I permessi: Marcia / Arresto si usa senza accedere, la soglia chiede il Supervisor (il tutorial, ai capitoli T10 e T11, parte invece con la pompa riservata all'Operator). Si prova col laboratorio di examples/laboratorio/ (./laboratorio.sh avvia && ./laboratorio.sh carica)."
