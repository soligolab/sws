meta:
  name: "EtherNet/IP Demo"
  version: "0.1.0"
  description: "Progetto dimostrativo per Allen-Bradley ControlLogix/CompactLogix via EtherNet/IP CIP. Modificare l'IP per puntare al proprio PLC."

sources:
  - kind: en_ip
    id: enip-plc
    ip: "192.0.2.10"
    slot: 0
    poll_interval_ms: 500
    tags:
      - tag: pump.speed
        plc_tag: "Pump_Speed"
        data_type: real
        writable: true
      - tag: valve.open
        plc_tag: "Valve_Open"
        data_type: bool
        writable: true
      - tag: sensor.temp
        plc_tag: "Temperature"
        data_type: real
        writable: false
      - tag: counter.cycles
        plc_tag: "Cycle_Count"
        data_type: dint
        writable: false

tags:
  - id: pump.speed
    data_type: float
    description: "Velocità pompa (rpm)"
    history: true
  - id: valve.open
    data_type: bool
    description: "Valvola aperta"
    history: true
  - id: sensor.temp
    data_type: float
    description: "Temperatura °C"
    history: true
  - id: counter.cycles
    data_type: int
    description: "Contatore cicli PLC"
    history: false
  - id: pump.speed_pct
    data_type: float
    description: "Velocità pompa (%)"
    expression: "tags['pump.speed'] / 30.0"
    history: false

alarms:
  - id: alm-temp-high
    tag: sensor.temp
    levels:
      - condition:
          kind: above
          threshold: 85.0
        severity: Critical
        message: '{{t0001}}'
  - id: alm-pump-zero
    tag: pump.speed
    levels:
      - condition:
          kind: below
          threshold: 5.0
        severity: Warning
        message: '{{t0002}}'
# NOTA: qui c'era una pagina scritta dentro `project.yaml`, sotto una chiave
# `synoptics:` che il runtime **non legge**: le pagine le prende dai file in
# `synoptics/*.yaml`. Era quindi contenuto morto — modificabile, invisibile,
# e ingannevole per chi ci avesse messo mano. Rimossa il 2026-08-28, quando
# al template è stata aggiunta una vera pagina di partenza.

languages:
  default: it
  langs: [it, en, es]
  entries:
    - key: t0001
      values:
        it: "Temperatura eccessiva!"
        en: "Temperature too high!"
        es: "¡Temperatura excesiva!"
    - key: t0002
      values:
        it: "Pompa ferma o sotto minimo"
        en: "Pump stopped or below minimum"
        es: "Bomba parada o por debajo del mínimo"
    - key: t0003
      values:
        it: "EtherNet/IP — Allen-Bradley"
        en: "EtherNet/IP — Allen-Bradley"
        es: "EtherNet/IP — Allen-Bradley"
    - key: t0004
      values:
        it: "Pagina di partenza: i tag del template sono già collegati. Disegna qui il tuo impianto."
        en: "Starting page: the template tags are already bound. Draw your plant here."
        es: "Página de partida: los tags de la plantilla ya están vinculados. Dibuja aquí tu instalación."
    - key: t0005
      values:
        it: "Velocità pompa (rpm)"
        en: "Pump speed (rpm)"
        es: "Velocidad bomba (rpm)"
    - key: t0006
      values:
        it: "Valvola aperta"
        en: "Valve open"
        es: "Válvula abierta"
    - key: t0007
      values:
        it: "Temperatura °C"
        en: "Temperature °C"
        es: "Temperatura °C"
    - key: t0008
      values:
        it: "Contatore cicli PLC"
        en: "PLC cycle counter"
        es: "Contador de ciclos del PLC"
    - key: t0009
      values:
        it: "Velocità pompa (%)"
        en: "Pump speed (%)"
        es: "Velocidad bomba (%)"
    - key: t0010
      values:
        it: "COMANDI (write-back sul PLC)"
        en: "COMMANDS (write-back to the PLC)"
        es: "COMANDOS (escritura en el PLC)"
    - key: t0011
      values:
        it: "Comando velocità pompa"
        en: "Pump speed command"
        es: "Comando velocidad bomba"
    - key: t0012
      values:
        it: "Apri valvola"
        en: "Open valve"
        es: "Abrir válvula"
