meta:
  name: "EtherNet/IP Demo"
  version: "0.1.0"
  description: "Progetto dimostrativo per Allen-Bradley ControlLogix/CompactLogix via EtherNet/IP CIP. Modificare l'IP per puntare al proprio PLC."

sources:
  - kind: en_ip
    id: enip-plc
    ip: "192.168.1.10"
    slot: 0
    poll_interval_ms: 500
    tags:
      - tag: pump.speed
        plc_tag: "Pump_Speed"
        data_type: real
        writable: true
      - tag: valve.open
        plc_tag: "Valve_Open"
        data_type: bool
        writable: true
      - tag: sensor.temp
        plc_tag: "Temperature"
        data_type: real
        writable: false
      - tag: counter.cycles
        plc_tag: "Cycle_Count"
        data_type: dint
        writable: false

tags:
  - id: pump.speed
    data_type: float
    description: "Velocità pompa (rpm)"
    history: true
  - id: valve.open
    data_type: bool
    description: "Valvola aperta"
    history: true
  - id: sensor.temp
    data_type: float
    description: "Temperatura °C"
    history: true
  - id: counter.cycles
    data_type: int
    description: "Contatore cicli PLC"
    history: false
  - id: pump.speed_pct
    data_type: float
    description: "Velocità pompa (%)"
    expression: "tags['pump.speed'] / 30.0"
    history: false

alarms:
  - id: alm-temp-high
    tag: sensor.temp
    condition:
      kind: above
      threshold: 85.0
    message: "Temperatura eccessiva!"
    severity: Critical
  - id: alm-pump-zero
    tag: pump.speed
    condition:
      kind: below
      threshold: 5.0
    message: "Pompa ferma o sotto minimo"
    severity: Warning

# NOTA: qui c'era una pagina scritta dentro `project.yaml`, sotto una chiave
# `synoptics:` che il runtime **non legge**: le pagine le prende dai file in
# `synoptics/*.yaml`. Era quindi contenuto morto — modificabile, invisibile,
# e ingannevole per chi ci avesse messo mano. Rimossa il 2026-08-28, quando
# al template è stata aggiunta una vera pagina di partenza.

languages:
  default: it
  langs: [it, en]
  entries: []
