# La Panoramica (04-11-2026, regole R6–R8 dei template). Il titolo e l'ora li
# porta la cornice (`cornici/cornice.yaml`), quindi qui si parte da y 56. Le
# letture sono istanze dei faceplate «riga_valore» e «riga_spia», una per tag;
# i comandi scrivono tag con `write_min_role: Viewer`, e si usano senza accedere.
