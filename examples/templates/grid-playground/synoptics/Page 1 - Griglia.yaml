id: gp_page1
name: "{{t0030}}"
background: "#0f172a"
width: 1280
height: 800
# Nome della pagina, lingua, data/ora e navigazione stanno nella cornice
# (`cornici/cornice.yaml`, R6): qui solo l'area attiva, y 56–740.
#
# Le misure dei figli di cella. Il web centra da sé ogni figlio nel suo slot e
# ignora `x`/`y`; il viewer LVGL oggi lo mette nell'angolo in alto a sinistra
# più `x`/`y` (`render_grid_slot`). Per questo i figli con un riquadro portano
# in `x`/`y` lo scarto che li centra, e i testi sono riquadri grandi quanto lo
# slot (`text_wrap` + `text_valign: middle`): così le due viste coincidono.
objects:

# ══════════════════════════════════════════════════════════════════
# GRID 4×4 (24..904 × 72..724 → ogni cella 220×163)
# ══════════════════════════════════════════════════════════════════
- id: gp_grid
  type: grid
  x: 24
  y: 72
  width: 880
  height: 652
  grid_rows: 4
  grid_cols: 4
  grid_show_borders: true
  grid_border_color: "#334155"
  grid_cells:

    # ─────────────────────────────────────────────────────────────
    # (0,0) — Sub-cell annidata fino a 4 livelli.
    # Livello 1 split cols   → a (sx), b (dx con symbol)
    # Livello 2 split rows   → a.a (top rect), a.b (bottom)
    # Livello 3 split cols   → a.b.a (testo "L3-A"), a.b.b (split)
    # Livello 4 split rows   → a.b.b.a (ellipse), a.b.b.b (led)
    # ─────────────────────────────────────────────────────────────
    - row: 0
      col: 0
      bg_color: "#1e293b"
      sub:
        orientation: cols
        ratio: 0.5
        a:
          bg_color: "#1e3a8a"
          border_color: "#22d3ee"  # F7: border_color vale anche sulle sotto-celle
          sub:
            orientation: rows
            ratio: 0.4
            a:
              child:              # slot 110×65
                id: gp_lv2_rect
                type: rect
                x: 21
                y: 16
                width: 67
                height: 33
                fill: "#3b82f6"
                stroke: "#1d4ed8"
                stroke_width: 2
            b:
              bg_color: "#1e293b"
              sub:
                orientation: cols
                ratio: 0.5
                a:
                  child:          # slot 55×98
                    id: gp_lv3_text
                    type: text
                    x: 0
                    y: 0
                    width: 55
                    height: 97
                    text_wrap: true
                    text_valign: middle
                    text: "{{t0004}}"
                    font_size: 13
                    font_weight: bold
                    text_anchor: middle
                    color: "#e2e8f0"
                b:
                  bg_color: "#312e81"
                  sub:
                    orientation: rows
                    ratio: 0.5
                    a:
                      child:      # slot 55×49
                        id: gp_lv4_ell
                        type: ellipse
                        x: 7
                        y: 11
                        width: 40
                        height: 27
                        fill: "#a855f7"
                    b:
                      child:      # slot 55×49
                        id: gp_lv4_led
                        type: led
                        x: 15
                        y: 12
                        width: 24
                        height: 24
                        tag: pump.running
                        on_value: true
                        on_color: "#22c55e"
                        off_color: "#475569"
        b:
          bg_color: "#1e293b"
          child:                  # slot 110×163
            id: gp_lv1_symbol
            type: symbol
            x: 5
            y: 31
            width: 100
            height: 100
            symbol_id: pump
            state_tag: pump.running
            state_off_color: "#64748b"
            state_on_color: "#22c55e"
            state_alarm_color: "#ef4444"
            transition_duration_ms: 300

    # (0,1) — Gauge figlio di cella, grande quanto la cella
    - row: 0
      col: 1
      bg_color: "#0b1220"
      child:
        id: gp_gauge_counter
        type: gauge
        x: 0
        y: 0
        width: 220
        height: 163
        label: "{{t0005}}"
        tag: counter
        min: 0
        max: 100
        warn_high: 70
        alarm_high: 85
        transition_duration_ms: 200

    # (0,2) — testo bindato al counter
    - row: 0
      col: 2
      bg_color: "#0b1220"
      child:
        id: gp_txt_counter
        type: text
        x: 0
        y: 0
        width: 220
        height: 163
        text_wrap: true
        text_valign: middle
        tag: counter
        format: "{value}"
        font_size: 42
        font_weight: bold
        text_anchor: middle
        color: "#fbbf24"
        transition_duration_ms: 150

    # (0,3) — LED della pompa
    - row: 0
      col: 3
      bg_color: "#0b1220"
      child:
        id: gp_led_pump
        type: led
        x: 79
        y: 50
        width: 62
        height: 62
        tag: pump.running
        on_value: true
        on_color: "#22c55e"
        off_color: "#475569"

    # (1,0) — Button: incrementa counter (modo `increment`, entro 0–100).
    # border_color (F7): un contorno per questa sola cella, indipendente da
    # grid_show_borders — resterebbe acceso anche a griglia "senza bordi".
    - row: 1
      col: 0
      border_color: "#ef4444"
      child:
        id: gp_btn_inc
        type: button
        x: 20
        y: 53
        width: 180
        height: 56
        fill: "#3b82f6"
        label: "{{t0006}}"
        tag: counter
        button_mode: increment
        step: 1
        min: 0
        max: 100

    # (1,1) → merged 1×2 (colspan=2) per ospitare un trend ampio
    - row: 1
      col: 1
      colspan: 2
      bg_color: "#0b1220"
      child:
        id: gp_trend
        type: trend
        x: 0
        y: 0
        width: 440
        height: 163
        tag: counter
        window_s: 60
        line_color: "#fbbf24"

    # (1,3) → rect col colore pilotato dalla pagina Controlli
    - row: 1
      col: 3
      bg_color: "#312e81"
      child:
        id: gp_rect_color
        type: rect
        x: 38
        y: 31
        width: 144
        height: 100
        fill: "#3b82f6"
        transition_duration_ms: 400
        bindings:
          fill: demo.fill_color

    # (2,0) — Button: decrementa counter (modo `decrement`, entro 0–100)
    - row: 2
      col: 0
      child:
        id: gp_btn_dec
        type: button
        x: 20
        y: 53
        width: 180
        height: 56
        fill: "#dc2626"
        label: "{{t0007}}"
        tag: counter
        button_mode: decrement
        step: 1
        min: 0
        max: 100

    # (2,1) — Toggle pump.running (modo `toggle`)
    - row: 2
      col: 1
      child:
        id: gp_btn_toggle
        type: button
        x: 20
        y: 53
        width: 180
        height: 56
        fill: "#0d9488"
        label: "{{t0008}}"
        tag: pump.running
        button_mode: toggle

    # (2,2) — slider su demo.value
    - row: 2
      col: 2
      bg_color: "#0b1220"
      child:
        id: gp_slider_value
        type: slider
        x: 20
        y: 61
        width: 180
        height: 40
        tag: demo.value
        min: 0
        max: 100
        step: 1
        orientation: horizontal

    # (2,3) — progress_bar bindato a demo.value
    - row: 2
      col: 3
      bg_color: "#0b1220"
      child:
        id: gp_pbar
        type: progress_bar
        x: 20
        y: 67
        width: 180
        height: 29
        tag: demo.value
        min: 0
        max: 100
        unit: "%"
        fill: "#22c55e"

    # ─────────────────────────────────────────────────────────────
    # Riga 3 — 4 celle con split shallow (1 livello)
    # ─────────────────────────────────────────────────────────────

    # (3,0) — split rows: testo top / ellipse bottom
    - row: 3
      col: 0
      bg_color: "#1f2937"
      sub:
        orientation: rows
        ratio: 0.4
        a:
          child:                  # slot 220×65
            id: gp_lbl_top
            type: text
            x: 0
            y: 0
            width: 220
            height: 65
            text_wrap: true
            text_valign: middle
            text: "{{t0009}}"
            font_size: 16
            font_weight: bold
            text_anchor: middle
            color: "#fbbf24"
        b:
          child:                  # slot 220×98
            id: gp_ell_bot
            type: ellipse
            x: 49
            y: 15
            width: 122
            height: 67
            fill: "#0d9488"

    # (3,1) — split cols (2 livelli: a → ulteriore split rows)
    - row: 3
      col: 1
      bg_color: "#1f2937"
      sub:
        orientation: cols
        ratio: 0.5
        a:
          sub:
            orientation: rows
            ratio: 0.5
            a:
              child:              # slot 110×81
                id: gp_split_a_a
                type: text
                x: 0
                y: 0
                width: 110
                height: 81
                text_wrap: true
                text_valign: middle
                text: "{{t0010}}"
                font_size: 13
                text_anchor: middle
                color: "#e2e8f0"
            b:
              child:              # slot 110×81
                id: gp_split_a_b
                type: text
                x: 0
                y: 0
                width: 110
                height: 81
                text_wrap: true
                text_valign: middle
                text: "{{t0011}}"
                font_size: 13
                text_anchor: middle
                color: "#94a3b8"
        b:
          child:                  # slot 110×163
            id: gp_split_b
            type: rect
            x: 16
            y: 31
            width: 78
            height: 100
            fill: "#9333ea"

    # (3,2) — split rows con visible_tag su slot a
    - row: 3
      col: 2
      bg_color: "#1f2937"
      sub:
        orientation: rows
        ratio: 0.5
        a:
          visible_tag: pump.running
          child:                  # slot 220×81
            id: gp_visa
            type: text
            x: 0
            y: 0
            width: 220
            height: 81
            text_wrap: true
            text_valign: middle
            text: "{{t0012}}"
            font_size: 13
            font_weight: bold
            text_anchor: middle
            color: "#22c55e"
        b:
          child:                  # slot 220×81
            id: gp_visb
            type: text
            x: 0
            y: 0
            width: 220
            height: 81
            text_wrap: true
            text_valign: middle
            text: "{{t0013}}"
            font_size: 12
            text_anchor: middle
            color: "#94a3b8"

    # (3,3) — Slider opacity: lo segue la barra viola fuori dalla griglia
    - row: 3
      col: 3
      bg_color: "#1f2937"
      child:
        id: gp_opacity_slider
        type: slider
        x: 20
        y: 65
        width: 180
        height: 33
        tag: demo.opacity
        min: 0
        max: 1
        step: 0.05
        orientation: horizontal

# ══════════════════════════════════════════════════════════════════
# COLONNA DESTRA (locked + grouped): cosa mostra la griglia, e un
# OGGETTO DI PAGINA che reagisce all'opacity slider della grid
# ══════════════════════════════════════════════════════════════════
- id: gp_subtitle
  type: text
  x: 928
  y: 72
  width: 328
  height: 120
  text_wrap: true
  text: "{{t0002}}"
  font_size: 14
  color: "#94a3b8"
  group_id: g_info
  locked: true

- id: gp_outside_lbl
  type: text
  x: 928
  y: 208
  width: 328
  height: 88
  text_wrap: true
  text: "{{t0032}}"
  font_size: 14
  color: "#94a3b8"
  group_id: g_info
  locked: true

- id: gp_outside_rect
  type: rect
  x: 928
  y: 302
  width: 328
  height: 36
  fill: "#c084fc"
  transition_duration_ms: 300
  # Legame con scala: demo.opacity nasce a 0, e una barra a opacità 0 non si
  # vede. Con il cursore a 0 la barra resta al 15%, a 1 è piena.
  bindings:
    opacity:
      tag: demo.opacity
      in_min: 0
      in_max: 1
      out_min: 0.15
      out_max: 1
  group_id: g_info
  locked: true

# ══════════════════════════════════════════════════════════════════
# ALLARMI — counter > 80 (bottoni ▲ qui, preset nella pagina Controlli)
# ══════════════════════════════════════════════════════════════════
- id: gp1_alarm_bell
  type: alarm_bell
  x: 928
  y: 560
  width: 160
  height: 40
  alarm_bell_show_history: true
  alarm_bell_show_shelve: true
- id: gp1_alarm_banner
  type: alarm_banner
  x: 928
  y: 612
  width: 328
  height: 112

groups:
- id: g_info
  name: Info
