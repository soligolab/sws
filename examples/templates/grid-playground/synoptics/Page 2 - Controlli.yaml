id: gp_page2
name: "Controlli"
background: "#0f172a"
width: 900
height: 540
objects:

# ══════════════════════════════════════════════════════════════════
# HEADER
# ══════════════════════════════════════════════════════════════════
- id: gp2_title
  type: text
  x: 450
  y: 24
  text: "{{controlli_fill_color_label_alarm}}"
  font_size: 18
  font_weight: bold
  text_anchor: middle
  color: "#c084fc"
  group_id: g_nav
  locked: true

- id: gp2_nav_back
  type: navbutton
  x: 20
  y: 14
  width: 150
  height: 30
  label: "{{griglia}}"
  target_page: gp_page1
  group_id: g_nav
  locked: true

# ══════════════════════════════════════════════════════════════════
# COLOR PICKER → scrive demo.fill_color
# ══════════════════════════════════════════════════════════════════
- id: gp2_picker_lbl
  type: text
  x: 30
  y: 75
  text: "{{demo_fill_color_pilota_il_rect_in_cella}}"
  font_size: 11
  color: "#94a3b8"

- id: gp2_btn_red
  type: button
  x: 30
  y: 90
  width: 110
  height: 38
  label: "{{rosso}}"
  fill: "#dc2626"
  tag: demo.fill_color
  write_value: "#dc2626"

- id: gp2_btn_green
  type: button
  x: 150
  y: 90
  width: 110
  height: 38
  label: "{{verde}}"
  fill: "#16a34a"
  tag: demo.fill_color
  write_value: "#16a34a"

- id: gp2_btn_blue
  type: button
  x: 270
  y: 90
  width: 110
  height: 38
  label: "{{blu}}"
  fill: "#2563eb"
  tag: demo.fill_color
  write_value: "#2563eb"

- id: gp2_btn_orange
  type: button
  x: 390
  y: 90
  width: 110
  height: 38
  label: "{{arancio}}"
  fill: "#ea580c"
  tag: demo.fill_color
  write_value: "#ea580c"

- id: gp2_btn_purple
  type: button
  x: 510
  y: 90
  width: 110
  height: 38
  label: "{{viola}}"
  fill: "#9333ea"
  tag: demo.fill_color
  write_value: "#9333ea"

# Preview live
- id: gp2_preview_lbl
  type: text
  x: 30
  y: 155
  text: "{{anteprima_fill}}"
  font_size: 11
  color: "#94a3b8"

- id: gp2_preview_rect
  type: rect
  x: 30
  y: 170
  width: 200
  height: 60
  fill: "#3b82f6"
  transition_duration_ms: 400
  bindings:
    fill: demo.fill_color

- id: gp2_preview_color
  type: text
  x: 250
  y: 200
  tag: demo.fill_color
  format: "{value}"
  font_size: 14
  color: "#fbbf24"

# ══════════════════════════════════════════════════════════════════
# CONTATORI / Triggers manuali per allarme
# ══════════════════════════════════════════════════════════════════
- id: gp2_alarm_lbl
  type: text
  x: 30
  y: 270
  text: "{{trigger_allarme_counter_80_scrive_counte}}"
  font_size: 11
  color: "#94a3b8"

- id: gp2_btn_set_safe
  type: button
  x: 30
  y: 285
  width: 150
  height: 40
  fill: "#16a34a"
  label: "{{counter_50}}"
  tag: counter
  write_value: 50

- id: gp2_btn_set_warn
  type: button
  x: 190
  y: 285
  width: 150
  height: 40
  fill: "#dc2626"
  label: "{{counter_95}}"
  tag: counter
  write_value: 95

- id: gp2_counter_view
  type: text
  x: 360
  y: 310
  tag: counter
  format: "counter = {value}"
  font_size: 14
  font_weight: bold
  color: "#fbbf24"

# ══════════════════════════════════════════════════════════════════
# Hint
# ══════════════════════════════════════════════════════════════════
- id: gp2_hint
  type: text
  x: 30
  y: 380
  text: "{{demo_s_27_ux_in_editor_prova_drag_drop_n}}"
  font_size: 11
  color: "#475569"

- id: gp2_hint2
  type: text
  x: 30
  y: 400
  text: "{{demo_grid_s_23_clicca_una_cella_poi_divi}}"
  font_size: 11
  color: "#475569"

groups:
- id: g_nav
  name: Navigazione
