id: gp_page2
name: "Controlli"
background: "#0f172a"
width: 900
height: 540
objects:

# ══════════════════════════════════════════════════════════════════
# HEADER
# ══════════════════════════════════════════════════════════════════
- id: gp2_title
  type: text
  x: 450
  y: 24
  text: "🎨  Controlli — fill color + label + alarm"
  font_size: 18
  font_weight: bold
  text_anchor: middle
  color: "#c084fc"
  group_id: g_nav
  locked: true

- id: gp2_nav_back
  type: navbutton
  x: 20
  y: 14
  width: 150
  height: 30
  label: "◀ Griglia"
  target_page: gp_page1
  group_id: g_nav
  locked: true

# ══════════════════════════════════════════════════════════════════
# COLOR PICKER → scrive demo.fill_color
# ══════════════════════════════════════════════════════════════════
- id: gp2_picker_lbl
  type: text
  x: 30
  y: 75
  text: "demo.fill_color (pilota il rect in cella (1,3) della pagina Griglia):"
  font_size: 11
  color: "#94a3b8"

- id: gp2_btn_red
  type: button
  x: 30
  y: 90
  width: 110
  height: 38
  label: "● Rosso"
  fill: "#dc2626"
  tag: demo.fill_color
  write_value: "#dc2626"

- id: gp2_btn_green
  type: button
  x: 150
  y: 90
  width: 110
  height: 38
  label: "● Verde"
  fill: "#16a34a"
  tag: demo.fill_color
  write_value: "#16a34a"

- id: gp2_btn_blue
  type: button
  x: 270
  y: 90
  width: 110
  height: 38
  label: "● Blu"
  fill: "#2563eb"
  tag: demo.fill_color
  write_value: "#2563eb"

- id: gp2_btn_orange
  type: button
  x: 390
  y: 90
  width: 110
  height: 38
  label: "● Arancio"
  fill: "#ea580c"
  tag: demo.fill_color
  write_value: "#ea580c"

- id: gp2_btn_purple
  type: button
  x: 510
  y: 90
  width: 110
  height: 38
  label: "● Viola"
  fill: "#9333ea"
  tag: demo.fill_color
  write_value: "#9333ea"

# Preview live
- id: gp2_preview_lbl
  type: text
  x: 30
  y: 155
  text: "Anteprima fill:"
  font_size: 11
  color: "#94a3b8"

- id: gp2_preview_rect
  type: rect
  x: 30
  y: 170
  width: 200
  height: 60
  fill: "#3b82f6"
  transition_duration_ms: 400
  bindings:
    fill: demo.fill_color

- id: gp2_preview_color
  type: text
  x: 250
  y: 200
  tag: demo.fill_color
  format: "{value}"
  font_size: 14
  color: "#fbbf24"

# ══════════════════════════════════════════════════════════════════
# CONTATORI / Triggers manuali per allarme
# ══════════════════════════════════════════════════════════════════
- id: gp2_alarm_lbl
  type: text
  x: 30
  y: 270
  text: "Trigger allarme counter>80 (scrive counter):"
  font_size: 11
  color: "#94a3b8"

- id: gp2_btn_set_safe
  type: button
  x: 30
  y: 285
  width: 150
  height: 40
  fill: "#16a34a"
  label: "counter = 50"
  tag: counter
  write_value: 50

- id: gp2_btn_set_warn
  type: button
  x: 190
  y: 285
  width: 150
  height: 40
  fill: "#dc2626"
  label: "counter = 95"
  tag: counter
  write_value: 95

- id: gp2_counter_view
  type: text
  x: 360
  y: 310
  tag: counter
  format: "counter = {value}"
  font_size: 14
  font_weight: bold
  color: "#fbbf24"

# ══════════════════════════════════════════════════════════════════
# Hint
# ══════════════════════════════════════════════════════════════════
- id: gp2_hint
  type: text
  x: 30
  y: 380
  text: "Demo S-27 UX: in editor prova drag&drop nel tree (LeftPanel), tasto destro sulle righe (context menu), rulers + guide (toggle ⟂ in alto-sx)."
  font_size: 11
  color: "#475569"

- id: gp2_hint2
  type: text
  x: 30
  y: 400
  text: "Demo grid S-23: clicca una cella, poi 'Dividi orizzontalmente/verticalmente' nel pannello destra (split locale). Shift+click su altre celle per merge."
  font_size: 11
  color: "#475569"

groups:
- id: g_nav
  name: Navigazione
