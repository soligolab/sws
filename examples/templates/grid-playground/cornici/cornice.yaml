# La cornice delle due pagine (R6): testata con il nome della pagina, la
# lingua e data/ora; piede con la navigazione, che elenca le pagine da sé.
# Modello: `openplc-laboratorio/cornici/cornice.yaml`, coi colori di questo
# template — fondo #0f172a, celle #1e293b, accento viola #c084fc.
#
# La cornice si disegna **sotto** la pagina: il contenuto delle pagine sta
# fra y 56 e y 740, così niente copre le due fasce.
id: cornice
nome: Cornice
larghezza: 1280.0
altezza: 800.0
testata:
  altezza: 56.0
  sfondo: '#1e293b'
piede:
  altezza: 60.0
  sfondo: '#1e293b'
oggetti:
# Il titolo è un riquadro alto quanto la testata, centrato in verticale: un
# testo senza misure ha `y` sulla linea di base sul web e in alto su LVGL, e
# su LVGL uscirebbe dalla fascia.
- id: titolo
  type: text
  x: 20.0
  y: 0.0
  width: 600.0
  height: 56.0
  text_wrap: true
  text_valign: middle
  text: '{{pagina.nome}}'
  font_size: 22.0
  font_weight: bold
  text_anchor: start
  color: '#c084fc'
- id: lingua
  type: lang_selector
  x: 880.0
  y: 13.0
  width: 110.0
  height: 30.0
- id: data_ora
  type: clock
  x: 1060.0
  y: 10.0
  width: 200.0
  height: 36.0
  font_size: 18.0
  text_anchor: end
  color: '#e2e8f0'
  clock_formato: data_ora
- id: navigatore
  type: page_navigator
  x: 10.0
  y: 748.0
  width: 1260.0
  height: 44.0
  nav_orientation: horizontal
  nav_fill: true
  nav_gap: 4.0
  font_size: 13.0
  fill: '#334155'
  color: '#e2e8f0'
  nav_active_fill: '#9333ea'
  nav_active_color: '#ffffff'
