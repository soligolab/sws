meta:
  name: grid-playground
  version: 0.1.0

# Tag in-memory: nessuna sorgente, scrivibili via API o dai bottoni del template.
# Quelli che i comandi delle pagine scrivono hanno soglia Viewer (R7): chi apre
# il template lo prova senza accedere.
tags:
  - id: counter
    description: "Contatore demo 0-100 (bottoni ▲/▼ della griglia, preset della pagina Controlli)"
    data_type: float
    write_min_role: Viewer
  - id: pump.running
    description: "Flag demo pompa ON/OFF"
    data_type: bool
    write_min_role: Viewer
  - id: demo.value
    description: "Valore numerico generico 0-100"
    data_type: float
    write_min_role: Viewer
  - id: demo.opacity
    description: "Opacità (0..1) per binding"
    data_type: float
    write_min_role: Viewer
  - id: demo.fill_color
    description: "Colore CSS (#RRGGBB) per binding"
    data_type: string
    write_min_role: Viewer
  - id: demo.label
    description: "Etichetta dinamica"
    data_type: string

sources: []

alarms:
  - id: counter_high
    tag: counter
    levels:
      - condition:
          kind: above
          threshold: 80.0
        severity: Warning
        message: '{{t0028}}'

languages:
  default: it
  langs: [it, en, es]
  entries:
