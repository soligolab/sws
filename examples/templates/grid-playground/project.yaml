# ── Pagina iniziale ──────────────────────────────────────────────────────────
#
# Senza questa riga il viewer apre la **prima pagina in ordine alfabetico**, che
# quasi mai è quella giusta: qui sarebbe "Griglia 4×4" solo per fortuna, e
# cambierebbe al primo rinomino. Il viewer LVGL la usa dal 2026-08-28, quando
# `--page` è diventato opzionale.
page_layout:
  size_mode: fixed
  home_page_id: gp_page1   # Griglia 4×4
  # L'ordine dei bottoni del navigatore nel piede della cornice.
  page_tree:
  - id: gp_page1
  - id: gp_page2
  # R6: la cornice di tutte e due le pagine — `cornici/cornice.yaml`.
  cornice_predefinita: cornice
