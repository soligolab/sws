# ── Riga in fondo, larghezza intera: terzo modo di passare parametri ──
- id: c_g_hdr
  type: text
  x: 40.0
  y: 660.0
  width: 1200.0
  height: 20.0
  text: "Terzo modo di chiamare t69_bump: POST /api/script/run/:name (lo stesso di un pulsante) — prova dal terminale:"
  font_size: 13.0
  font_weight: bold
  color: '#e2e8f0'
- id: c_g_cmd
  type: text
  x: 40.0
  y: 686.0
  width: 1200.0
  height: 18.0
  text: "curl -k -X POST https://localhost:8444/api/script/run/t69_bump -H \"Content-Type: application/json\" -d \"{\\\"args\\\":{\\\"step\\\":5}}\""
  font_size: 12.0
  color: '#94a3b8'
- id: c_g_note
  type: text
  x: 40.0
  y: 710.0
  width: 1200.0
  height: 18.0
  text: "Il contatore della Fase C/E qui sopra deve salire di 5 subito dopo — stessa identità del pulsante e di functions.run (era il bug appena corretto)."
  font_size: 11.0
  color: '#64748b'
