# ── Colonna destra, sezione 2: Fase C/E, functions.run + pulsante ──
- id: c_c_hdr
  type: text
  x: 680.0
  y: 196.0
  width: 560.0
  height: 20.0
  text: "Fase C/E — functions.run + pulsante, stesso contatore"
  font_size: 13.0
  font_weight: bold
  color: '#e2e8f0'
- id: c_c_note
  type: text
  x: 680.0
  y: 220.0
  width: 560.0
  height: 36.0
  text: "t69_bump(step) è chiamata dal pulsante (step=10), ogni 5 s da t69_auto_caller via functions.run (step=1), e da un terzo modo in fondo alla pagina — stessa identità, un solo contatore."
  font_size: 11.0
  color: '#64748b'
- id: c_c_value
  type: text
  x: 680.0
  y: 266.0
  width: 300.0
  height: 36.0
  tag: t69.fn_counter
  format: "{value:.0f}"
  font_size: 28.0
  font_weight: bold
  color: '#a855f7'
- id: btn_bump
  type: button
  x: 680.0
  y: 312.0
  width: 220.0
  height: 44.0
  fill: '#7c3aed'
  label: "+10 (pulsante)"
  on_press_fn: t69_bump
  on_press_args:
    step: 10

