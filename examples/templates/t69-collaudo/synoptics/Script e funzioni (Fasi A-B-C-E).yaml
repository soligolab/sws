# ── Colonna sinistra: Fase A, rampa manuale vs generatore nativo ──
- id: c_a_hdr
  type: text
  x: 40.0
  y: 72.0
  width: 600.0
  height: 20.0
  text: "Fase A — rampa scritta a mano (delta_ms()+state) contro il generatore nativo, stesso periodo 6 s:"
  font_size: 13.0
  font_weight: bold
  color: '#e2e8f0'
- id: trend_compare
  type: trend
  x: 40.0
  y: 100.0
  width: 600.0
  height: 260.0
  window_s: 20.0
  trend_tags:
  - tag: t69.manual_ramp
    label: "Manuale (delta_ms+state)"
    color: '#22c55e'
  - tag: t69.gen_triangle
    label: "Nativo (generator)"
    color: '#f59e0b'
- id: c_a_manual
  type: text
  x: 40.0
  y: 372.0
  width: 290.0
  height: 24.0
  tag: t69.manual_ramp
  format: "Manuale: {value:.1f}"
  font_size: 15.0
  color: '#22c55e'
- id: c_a_native
  type: text
  x: 340.0
  y: 372.0
  width: 290.0
  height: 24.0
  tag: t69.gen_triangle
  format: "Nativo: {value:.1f}"
  font_size: 15.0
  color: '#f59e0b'
- id: c_a_note
  type: text
  x: 40.0
  y: 404.0
  width: 600.0
  height: 40.0
  text: "Stessa forma e stesso periodo, fasi diverse (una parte dall'epoch, l'altra dall'avvio dello script): delta_ms()+state (Fase A) bastano a costruire qualunque forma d'onda — il generatore nativo (Fase D) è solo la stessa cosa senza scriverla a mano."
  font_size: 11.0
  color: '#64748b'
- id: c_e_hdr
  type: text
  x: 40.0
  y: 470.0
  width: 600.0
  height: 20.0
  text: "Fase A — l'orologio: now_ms() e uptime_ms()"
  font_size: 13.0
  font_weight: bold
  color: '#e2e8f0'
- id: c_e_now
  type: text
  x: 40.0
  y: 496.0
  width: 290.0
  height: 22.0
  tag: t69.now_ms
  format: "now_ms(): {value:.0f}"
  font_size: 13.0
  color: '#38bdf8'
- id: c_e_uptime
  type: text
  x: 340.0
  y: 496.0
  width: 290.0
  height: 22.0
  tag: t69.uptime_ms
  format: "uptime_ms(): {value:.0f}"
  font_size: 13.0
  color: '#38bdf8'
- id: c_e_note
  type: text
  x: 40.0
  y: 524.0
  width: 600.0
  height: 36.0
  text: "Aggiornati ogni secondo da t69_clock_probe, un trigger interval \"vecchio stile\" (solo interval_s) — l'orologio non dipende dalla Fase B. uptime_ms() riparte da 0 solo se lo script viene disabilitato e riabilitato."
  font_size: 11.0
  color: '#64748b'

# ── Colonna destra, sezione 1: Fase B, interval_ms ──
- id: c_b_hdr
