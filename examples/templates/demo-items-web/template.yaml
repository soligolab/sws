id: demo-items-web
label: "Demo Items - Web"
description: "Banco di prova del motore web: un oggetto per ciascuno dei tipi della palette, su 4 pagine da 1280x800 con la cornice (nome della pagina, data e ora, navigazione) e una finestra pop-up. I dati li muove uno script Python interno (Configurazione → Script), quindi trend, grafici e allarmi si animano da soli senza broker né PLC, e ogni comando delle pagine si usa senza accedere, tranne la conferma degli allarmi e le ricette. Gemello di \"Demo Items - LVGL\": stesse pagine, stessi id, stesse coordinate — le differenze che si vedono confrontandoli sono differenze fra i due motori."
