id: t69-collaudo
label: "T-69 — Collaudo (orologio, script, generatore)"
description: "Progetto diagnostico, non un progetto cliente: due pagine per esercitare a mano tutte e cinque le fasi di T-69. Fase D — tre tag `generator` (rampa/triangolo/quadra) con gauge e trend, più le istruzioni per verificare il rifiuto in scrittura via curl. Fase A — una rampa scritta con delta_ms()+state affiancata al generatore nativo, più now_ms()/uptime_ms() e la sonda send_telegram (NameError corretto). Fase B — un contatore a interval_ms che vince su interval_s quando entrambi sono presenti. Fase C/E — una funzione con parametro richiamata da un pulsante (on_press_args), da functions.run di uno script globale e da POST /api/script/run/:name (curl): stesso contatore per tutte e tre le vie, più il pulsante che prova la chiamata vietata (functions.run da dentro un'altra funzione)."
