meta:
  name: dev
  version: 0.1.0
tags:
- id: counter
  description: Test counter (write via PUT /api/tags/counter)
  data_type: float
- id: pump.running
  description: Demo bool flag
  data_type: bool
- id: checkbox
  description: CheckBox
  data_type: bool
- id: demo.button
  description: Bottone demo (publish su sws/demo/echo)
  data_type: bool
- id: demo.led
  description: LED demo (subscribe a sws/demo/echo — echo loop dal broker)
  data_type: bool
- id: demo.rotation
  description: Pilota la rotazione di tutti gli oggetti in Page 3 (gradi 0-360)
  data_type: float
- id: demo.opacity
  description: Pilota l'opacità degli oggetti in Page 3 (0-1)
  data_type: float
- id: demo.label
  description: Etichetta dinamica per i widget di Page 3
  data_type: string
- id: demo.fill_color
  description: Colore fill (#RRGGBB) per oggetti Page 3
  data_type: string
sources:
- kind: mqtt
  id: mqtt-sws
  host: broker.freemqtt.com
  port: 1883
  client_id: sws-mp41i1lh4sgw
  topics:
  - tag: counter
    topic: sws/counter
  - tag: demo.button
    topic: sws/demo/echo
    publish_topic: sws/demo/echo
  - tag: demo.led
    topic: sws/demo/echo
  username: freemqtt
  password: public
alarms:
- id: counter_high
  tag: counter
  condition:
    kind: above
    threshold: 50.0
  message: Counter sopra soglia (>50)
  severity: Warning
functions:
- id: mp3xiq467vtqt
  name: fnc_CounterUP
  code: |-
    current = tags.read(tag) or 0
    tags.write(tag, current + step)
    print(f"{tag}: {current} -> {current + step}")
  params:
  - name: tag
    default: counter
  - name: step
    default: 1
- id: mp40nvsuc1kyc
  name: fnc_CounterDWN
  code: |-
    current = tags.read(tag) or 0
    tags.write(tag, current - step)
    print(f"{tag}: {current} -> {current - step}")
  params:
  - name: tag
    default: counter
  - name: step
    default: 1
