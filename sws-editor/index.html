<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <title>SWS — SCADA Web Studio</title>
    <style>
      /* Brand color tokens — defaults = SWS palette. Overridden at boot by
         applyBranding() (see src/branding). Defined here so colors resolve
         before JS runs (no flash). Keep in sync with SWS_FALLBACK. */
      :root {
        --brand-bg: #0f172a;
        --brand-surface: #1e293b;
        --brand-surface-2: #334155;
        --brand-border: #475569;
        --brand-text: #e2e8f0;
        --brand-text-2: #cbd5e1;
        --brand-text-muted: #94a3b8;
        --brand-primary: #3b82f6;
        --brand-primary-hover: #2563eb;
        --brand-on-primary: #ffffff;
      }
      html { background: var(--brand-bg); }
      /* Used by the built-in "fan" symbol when state === "on". */
      @keyframes sws-fan-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
