<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <title>SWS — SCADA Web Studio</title>
    <style>
      /* Font emoji servito dal runtime: il Chromium del pannello (Yocto Pixsys)
         non ne ha nessuno e disegna `[]`. Stesso Noto Emoji monocromo che usa
         il viewer LVGL, quindi i due motori mostrano gli stessi glifi. Sta in
         coda a ogni stack `font-family` dell'app: si usa solo per i caratteri
         che nessun altro font ha (unicode-range limita comunque il download). */
      @font-face {
        font-family: "SWS Emoji";
        src: url("/fonts/NotoEmoji-Regular.ttf") format("truetype");
        unicode-range: U+2600-27BF, U+2B50, U+1F000-1FAFF;
        font-display: swap;
      }
      /* Brand + theme color tokens. Defaults = SWS dark palette; overridden at
         boot by applyBranding()/applyAppearance() as inline props on :root (see
         src/branding, src/theme). Defined here so colors resolve before JS runs
         (no flash). The [data-theme="light"] block is the no-JS fallback — the
         runtime writes the same tokens as inline props. Keep in sync with
         SWS_FALLBACK and src/theme.ts. */
      :root {
        --brand-bg: #0f172a;
        --brand-surface: #1e293b;
        --brand-surface-2: #334155;
        --brand-border: #475569;
        --brand-text: #e2e8f0;
        --brand-text-2: #cbd5e1;
        --brand-text-muted: #a3b2c9;
        --brand-text-subtle: #8b9bb5;
        --brand-primary: #3b82f6;
        --brand-primary-hover: #2563eb;
        --brand-on-primary: #0f172a;
        --brand-danger: #ef4444;
        --brand-danger-soft: #fca5a5;
        --brand-danger-bg: #7f1d1d;
        --brand-on-danger: #0f172a;
        --brand-success: #22c55e;
        --brand-success-soft: #4ade80;
        --brand-success-bg: #166534;
        --brand-on-success: #0f172a;
        --brand-warning: #f59e0b;
        --brand-warning-soft: #facc15;
        --brand-warning-bg: #78350f;
        --brand-on-warning: #0f172a;
      }
      :root[data-theme="light"] {
        --brand-bg: #f8fafc;
        --brand-surface: #ffffff;
        --brand-surface-2: #f1f5f9;
        --brand-border: #cbd5e1;
        --brand-text: #0f172a;
        --brand-text-2: #334155;
        --brand-text-muted: #576475;
        --brand-text-subtle: #6b7890;
        --brand-on-primary: #0f172a;
        --brand-danger: #dc2626;
        --brand-danger-soft: #b91c1c;
        --brand-danger-bg: #fee2e2;
        --brand-on-danger: #f8fafc;
        --brand-success: #15803d;
        --brand-success-soft: #166534;
        --brand-success-bg: #dcfce7;
        --brand-on-success: #f8fafc;
        --brand-warning: #b45309;
        --brand-warning-soft: #92400e;
        --brand-warning-bg: #fef3c7;
        --brand-on-warning: #f8fafc;
      }
      html { background: var(--brand-bg); }
      /* Reset di layout. Senza `margin: 0` il body conserva gli 8px di default
         dell'UA: contro una radice `height: 100vh` fanno 816px in 800 e
         producono una scrollbar del documento SEMPRE, su qualunque schermo —
         il difetto visto sul pannello WP620. `overflow: hidden` perché
         viewer e IDE gestiscono lo scorrimento nei propri contenitori. */
      html, body { height: 100%; margin: 0; overflow: hidden; }
      #root { height: 100%; }
      /* Le gesture del browser non devono rubare un trascinamento (27-10-2026).
         Su un pannello touch, trascinare uno slider in orizzontale finiva
         spesso interpretato da Chromium come «pagina precedente»: quel gesto
         nasce dall'overscroll, e `overflow: hidden` qui sopra fa si' che la
         pagina non possa scorrere — quindi ogni trascinamento È overscroll.
         `overscroll-behavior: none` lo toglie su tutti e due gli assi: via
         anche il pull-to-refresh, che su un chiosco ricarica la pagina per
         sbaglio.

         Si corregge qui e non con un parametro del browser
         (`--overscroll-history-navigation=0`, `--disable-features=
         OverscrollHistoryNavigation`): il servizio Chromium del pannello è di
         PixsysOS, una modifica li' non viaggia con la nostra immagine, un
         aggiornamento dell'OS se la porta via, e sul browser di un cliente non
         vale comunque.

         `touch-action: none` sui controlli che si trascinano è l'altra metà:
         dice al browser di non interpretare affatto quel tocco, cosi' il primo
         movimento non diventa uno scorrimento e lo slider non perde il dito.
         Vale per tutti e tre gli `input[type=range]` dell'app — lo slider del
         sinottico, il volume degli stili simbolo, lo zoom della barra. */
      html, body { overscroll-behavior: none; }
      input[type="range"] { touch-action: none; }
      /* Spinner dei campi numerici: Chromium li disegna minuscoli e solo in
         hover — bersaglio troppo piccolo col mouse (richiesta 2026-08-23).
         Sempre visibili e ~2x più larghi. Solo Chromium: Firefox li ignora. */
      input[type="number"]::-webkit-inner-spin-button {
        opacity: 1;
        width: 20px;
        align-self: stretch;
        cursor: pointer;
      }
    </style>
    <link rel="stylesheet" href="/fonts/font.css" />
    <script src="/avvio-tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/registra-sw.js"></script>
  </body>
</html>
