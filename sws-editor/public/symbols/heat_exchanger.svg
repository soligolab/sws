<?xml version="1.0" encoding="UTF-8"?>
<!--
  SWS heat exchanger — shell-and-tube schematic.
  Original work by the SWS project, dedicated to the public domain
  (CC0 1.0). See ATTRIBUTION.md for the full record.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- shell -->
  <rect x="10" y="20" width="80" height="40" rx="20" ry="20"
        fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <!-- tube bundle -->
  <line x1="14" y1="32" x2="86" y2="32" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="14" y1="40" x2="86" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="14" y1="48" x2="86" y2="48" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- inlet/outlet nozzles -->
  <rect x="2" y="34" width="10" height="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="88" y="34" width="10" height="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <!-- shell-side ports (top + bottom) -->
  <rect x="44" y="6" width="12" height="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="44" y="58" width="12" height="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
</svg>
