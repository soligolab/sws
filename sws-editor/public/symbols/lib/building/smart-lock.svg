<svg xmlns="http://www.w3.org/2000/svg" width="50" height="80" viewBox="0 0 50 80">
  <defs>
    <linearGradient id="smart-lock-dark-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="smart-lock-metal-r" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <radialGradient id="smart-lock-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <rect id="smart-lock-g1" x="8" y="4" width="34" height="72" rx="8"/>
    <circle id="smart-lock-g2" cx="25" cy="26" r="11"/>
    <rect id="smart-lock-g3" x="17" y="48" width="16" height="18" rx="3"/>
  </defs>
  <g id="body" data-layer="part" data-mat="steel-dark" fill="#4a545d" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#smart-lock-g1"/>
    <use href="#smart-lock-g1" fill="url(#smart-lock-dark-h)" stroke="none" opacity="1" data-shade="dark-h"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#smart-lock-g2" fill="#9aa5af" data-mat="steel"/>
    <use href="#smart-lock-g2" fill="url(#smart-lock-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
    <rect x="23" y="18" width="4" height="16" rx="2" fill="#4a545d" data-mat="steel-dark"/>
    <rect x="17" y="48" width="16" height="18" rx="3" fill="#1d2a35" data-mat="glass-dark"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#smart-lock-g3" fill="#3fb950" data-mat="lamp-green" fill-opacity="0.8"/>
    <use href="#smart-lock-g3" fill="url(#smart-lock-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
</svg>
