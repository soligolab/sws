<svg xmlns="http://www.w3.org/2000/svg" width="80" height="120" viewBox="0 0 80 120">
  <defs>
    <linearGradient id="front-door-paint-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="front-door-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="front-door-paint-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="front-door-metal-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.49"/>
    </linearGradient>
    <rect id="front-door-g1" x="0" y="0" width="80" height="120"/>
    <rect id="front-door-g2" x="10" y="10" width="60" height="110" rx="1"/>
    <rect id="front-door-g3" x="14" y="14" width="52" height="106" rx="1"/>
    <rect id="front-door-g4" x="22" y="22" width="36" height="36" rx="2"/>
    <rect id="front-door-g5" x="22" y="66" width="36" height="36" rx="2"/>
    <rect id="front-door-g6" x="56" y="62" width="4" height="14" rx="2"/>
  </defs>
  <g id="layer-0" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#front-door-g1" fill="#c9c2b6" data-mat="wall" stroke="none"/>
    <use href="#front-door-g1" fill="url(#front-door-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
    <use href="#front-door-g2" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#front-door-g2" fill="url(#front-door-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
  </g>
  <g id="body" data-layer="part" data-mat="wood" fill="#b98a55" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#front-door-g3"/>
    <use href="#front-door-g3" fill="url(#front-door-paint-v)" stroke="none" opacity="1" data-shade="paint-v"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#front-door-g4" fill="#b98a55" data-mat="wood"/>
    <use href="#front-door-g4" fill="url(#front-door-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
    <use href="#front-door-g5" fill="#b98a55" data-mat="wood"/>
    <use href="#front-door-g5" fill="url(#front-door-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
    <use href="#front-door-g6" fill="#9aa5af" data-mat="steel"/>
    <use href="#front-door-g6" fill="url(#front-door-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
  </g>
</svg>
