<svg xmlns="http://www.w3.org/2000/svg" width="60" height="50" viewBox="0 0 60 50">
  <defs>
    <radialGradient id="flood-sensor-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flood-sensor-paint-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="flood-sensor-metal-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.49"/>
    </linearGradient>
    <rect id="flood-sensor-g1" x="0" y="38" width="60" height="12"/>
    <ellipse id="flood-sensor-g2" cx="30" cy="30" rx="22" ry="12"/>
    <rect id="flood-sensor-g3" x="18.5" y="38" width="3" height="6" rx="1"/>
    <rect id="flood-sensor-g4" x="28.5" y="38" width="3" height="6" rx="1"/>
    <rect id="flood-sensor-g5" x="38.5" y="38" width="3" height="6" rx="1"/>
    <circle id="flood-sensor-g6" cx="30" cy="26" r="2"/>
  </defs>
  <g id="layer-0" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#flood-sensor-g1" fill="#2b8fd6" data-mat="liquid" fill-opacity="0.6" stroke="none"/>
    <use href="#flood-sensor-g1" fill="url(#flood-sensor-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
  <g id="body" data-layer="part" data-mat="appliance" fill="#e2e6ea" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#flood-sensor-g2"/>
    <use href="#flood-sensor-g2" fill="url(#flood-sensor-paint-v)" stroke="none" opacity="1" data-shade="paint-v"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#flood-sensor-g3" fill="#b87333" data-mat="copper"/>
    <use href="#flood-sensor-g3" fill="url(#flood-sensor-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
    <use href="#flood-sensor-g4" fill="#b87333" data-mat="copper"/>
    <use href="#flood-sensor-g4" fill="url(#flood-sensor-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
    <use href="#flood-sensor-g5" fill="#b87333" data-mat="copper"/>
    <use href="#flood-sensor-g5" fill="url(#flood-sensor-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
    <circle cx="30" cy="26" r="2" fill="#2f5a39" data-mat="lamp-green-off"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#flood-sensor-g6" fill="#3fb950" data-mat="lamp-green"/>
    <use href="#flood-sensor-g6" fill="url(#flood-sensor-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
