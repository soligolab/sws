<svg xmlns="http://www.w3.org/2000/svg" width="70" height="60" viewBox="0 0 70 60">
  <defs>
    <linearGradient id="door-sensor-paint-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="door-sensor-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <rect id="door-sensor-g1" x="6" y="14" width="36" height="32" rx="4"/>
    <rect id="door-sensor-g2" x="46" y="18" width="18" height="24" rx="3"/>
    <circle id="door-sensor-g3" cx="16" cy="24" r="1.8"/>
  </defs>
  <g id="body" data-layer="part" data-mat="appliance" fill="#e2e6ea" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#door-sensor-g1"/>
    <use href="#door-sensor-g1" fill="url(#door-sensor-paint-h)" stroke="none" opacity="1" data-shade="paint-h"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#door-sensor-g2" fill="#e2e6ea" data-mat="appliance"/>
    <use href="#door-sensor-g2" fill="url(#door-sensor-paint-h)" stroke="none" opacity="1" data-shade="paint-h"/>
    <circle cx="16" cy="24" r="1.8" fill="#2f5a39" data-mat="lamp-green-off"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#door-sensor-g3" fill="#3fb950" data-mat="lamp-green"/>
    <use href="#door-sensor-g3" fill="url(#door-sensor-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
  <g id="layer-2" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <path d="M44 22 L44 38" fill="none" stroke-opacity="0.4" stroke-dasharray="2 2"/>
