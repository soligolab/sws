    <rect id="fridge-g1" x="6" y="4" width="58" height="120" rx="4"/>
    <rect id="fridge-g2" x="54" y="14" width="4" height="22" rx="2"/>
    <rect id="fridge-g3" x="54" y="56" width="4" height="30" rx="2"/>
    <rect id="fridge-g4" x="14" y="52" width="20" height="8" rx="1.5"/>
