<svg xmlns="http://www.w3.org/2000/svg" width="60" height="100" viewBox="0 0 60 100">
  <defs>
    <linearGradient id="video-intercom-dark-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="video-intercom-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="video-intercom-metal-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.49"/>
    </linearGradient>
    <rect id="video-intercom-g1" x="6" y="4" width="48" height="92" rx="4"/>
    <circle id="video-intercom-g2" cx="30" cy="16" r="2"/>
    <rect id="video-intercom-g3" x="12" y="28" width="36" height="28" rx="2"/>
    <rect id="video-intercom-g4" x="14" y="64" width="32" height="7" rx="2"/>
    <rect id="video-intercom-g5" x="14" y="74" width="32" height="7" rx="2"/>
    <rect id="video-intercom-g6" x="14" y="84" width="32" height="7" rx="2"/>
  </defs>
  <g id="body" data-layer="part" data-mat="steel-dark" fill="#4a545d" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#video-intercom-g1"/>
    <use href="#video-intercom-g1" fill="url(#video-intercom-dark-h)" stroke="none" opacity="1" data-shade="dark-h"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <circle cx="30" cy="16" r="5" fill="#1d2a35" data-mat="glass-dark"/>
    <use href="#video-intercom-g2" fill="#1f3a5f" data-mat="pv-cell"/>
    <use href="#video-intercom-g2" fill="url(#video-intercom-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
    <rect x="12" y="28" width="36" height="28" rx="2" fill="#1d2a35" data-mat="glass-dark"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
