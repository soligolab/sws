    <circle cx="30" cy="30" r="13" fill="#1d2a35" data-mat="glass-dark"/>
  </g>
  <g id="needle" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <path d="M30 30 L30 19" fill="none" stroke="#ff8c1a" data-mat-stroke="flame" stroke-width="2" stroke-linecap="round"/>
    <use href="#thermostat-g3" fill="#9aa5af" data-mat="steel"/>
    <use href="#thermostat-g3" fill="url(#thermostat-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
