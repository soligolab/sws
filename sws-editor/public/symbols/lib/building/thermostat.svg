<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="thermostat-paint-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="thermostat-metal-r" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <rect id="thermostat-g1" x="4" y="4" width="52" height="52" rx="10"/>
    <circle id="thermostat-g2" cx="30" cy="30" r="18"/>
    <circle id="thermostat-g3" cx="30" cy="30" r="2.4"/>
  </defs>
  <g id="body" data-layer="part" data-mat="appliance" fill="#e2e6ea" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
