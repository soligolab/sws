    <rect id="speaker-g1" x="6" y="4" width="48" height="82" rx="4"/>
    <circle id="speaker-g2" cx="30" cy="24" r="9"/>
    <circle id="speaker-g3" cx="30" cy="24" r="3"/>
    <circle id="speaker-g4" cx="30" cy="58" r="17"/>
    <circle id="speaker-g5" cx="30" cy="58" r="6"/>
