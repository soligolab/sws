      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.52"/>
    </radialGradient>
    <radialGradient id="speaker-metal-r" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <radialGradient id="speaker-glass-r" cx="0.35" cy="0.3" r="0.7">
