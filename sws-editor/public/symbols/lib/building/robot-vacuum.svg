<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60" viewBox="0 0 80 60">
  <defs>
    <linearGradient id="robot-vacuum-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="robot-vacuum-metal-r" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <radialGradient id="robot-vacuum-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <ellipse id="robot-vacuum-g1" cx="40" cy="46" rx="34" ry="10"/>
    <ellipse id="robot-vacuum-g2" cx="40" cy="34" rx="34" ry="18"/>
    <ellipse id="robot-vacuum-g3" cx="40" cy="30" rx="10" ry="6"/>
    <circle id="robot-vacuum-g4" cx="56" cy="28" r="1.8"/>
  </defs>
  <g id="layer-0" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#robot-vacuum-g1" fill="#2a2d31" data-mat="rubber"/>
    <use href="#robot-vacuum-g1" fill="url(#robot-vacuum-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
  </g>
  <g id="body" data-layer="part" data-mat="steel-dark" fill="#4a545d" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#robot-vacuum-g2"/>
    <use href="#robot-vacuum-g2" fill="url(#robot-vacuum-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#robot-vacuum-g3" fill="#9aa5af" data-mat="steel"/>
    <use href="#robot-vacuum-g3" fill="url(#robot-vacuum-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
    <circle cx="56" cy="28" r="1.8" fill="#2f5a39" data-mat="lamp-green-off"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#robot-vacuum-g4" fill="#3fb950" data-mat="lamp-green"/>
    <use href="#robot-vacuum-g4" fill="url(#robot-vacuum-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
  <g id="layer-2" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <path d="M10 36 Q40 50 70 36" fill="none" stroke-opacity="0.35"/>
