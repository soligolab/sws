<svg xmlns="http://www.w3.org/2000/svg" width="100" height="70" viewBox="0 0 100 70">
  <defs>
    <linearGradient id="microwave-paint-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="microwave-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="microwave-metal-r" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <linearGradient id="microwave-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <rect id="microwave-g1" x="4" y="6" width="92" height="58" rx="4"/>
    <rect id="microwave-g2" x="10" y="12" width="60" height="46" rx="3"/>
    <circle id="microwave-g3" cx="83" cy="28" r="3.5"/>
    <circle id="microwave-g4" cx="83" cy="38" r="3.5"/>
    <rect id="microwave-g5" x="10" y="64" width="8" height="4" rx="1"/>
    <rect id="microwave-g6" x="82" y="64" width="8" height="4" rx="1"/>
  </defs>
  <g id="body" data-layer="part" data-mat="appliance" fill="#e2e6ea" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#microwave-g1"/>
    <use href="#microwave-g1" fill="url(#microwave-paint-h)" stroke="none" opacity="1" data-shade="paint-h"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <rect x="10" y="12" width="60" height="46" rx="3" fill="#1d2a35" data-mat="glass-dark"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#microwave-g2" fill="#ffd34d" data-mat="flame-core" fill-opacity="0.55"/>
    <use href="#microwave-g2" fill="url(#microwave-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
  <g id="layer-2" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <rect x="76" y="14" width="14" height="7" rx="1" fill="#1d2a35" data-mat="glass-dark"/>
    <use href="#microwave-g3" fill="#9aa5af" data-mat="steel"/>
    <use href="#microwave-g3" fill="url(#microwave-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
    <use href="#microwave-g4" fill="#9aa5af" data-mat="steel"/>
    <use href="#microwave-g4" fill="url(#microwave-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
    <rect x="78" y="48" width="10" height="6" rx="1.5" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#microwave-g5" fill="#2a2d31" data-mat="rubber"/>
    <use href="#microwave-g5" fill="url(#microwave-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
    <use href="#microwave-g6" fill="#2a2d31" data-mat="rubber"/>
    <use href="#microwave-g6" fill="url(#microwave-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
  </g>
</svg>
