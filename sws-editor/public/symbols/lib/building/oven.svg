<svg xmlns="http://www.w3.org/2000/svg" width="90" height="80" viewBox="0 0 90 80">
  <defs>
    <linearGradient id="oven-metal-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.49"/>
    </linearGradient>
    <linearGradient id="oven-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="oven-metal-r" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <linearGradient id="oven-metal-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.49"/>
    </linearGradient>
    <radialGradient id="oven-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <rect id="oven-g1" x="4" y="4" width="82" height="72" rx="3"/>
    <rect id="oven-g2" x="8" y="8" width="74" height="12" rx="2"/>
    <circle id="oven-g3" cx="18" cy="14" r="3.5"/>
    <circle id="oven-g4" cx="30" cy="14" r="3.5"/>
    <rect id="oven-g5" x="14" y="24" width="62" height="4" rx="2"/>
    <rect id="oven-g6" x="12" y="32" width="66" height="38" rx="3"/>
  </defs>
  <g id="body" data-layer="part" data-mat="stainless" fill="#b4bec7" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#oven-g1"/>
    <use href="#oven-g1" fill="url(#oven-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#oven-g2" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#oven-g2" fill="url(#oven-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
    <use href="#oven-g3" fill="#9aa5af" data-mat="steel"/>
    <use href="#oven-g3" fill="url(#oven-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
    <use href="#oven-g4" fill="#9aa5af" data-mat="steel"/>
    <use href="#oven-g4" fill="url(#oven-metal-r)" stroke="none" opacity="1" data-shade="metal-r"/>
    <rect x="52" y="10" width="24" height="8" rx="1" fill="#1d2a35" data-mat="glass-dark"/>
    <use href="#oven-g5" fill="#9aa5af" data-mat="steel"/>
    <use href="#oven-g5" fill="url(#oven-metal-v)" stroke="none" opacity="1" data-shade="metal-v"/>
    <rect x="12" y="32" width="66" height="38" rx="3" fill="#1d2a35" data-mat="glass-dark"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#oven-g6" fill="#ff8c1a" data-mat="flame" fill-opacity="0.6"/>
    <use href="#oven-g6" fill="url(#oven-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
