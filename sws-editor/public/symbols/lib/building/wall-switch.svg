<svg xmlns="http://www.w3.org/2000/svg" width="50" height="60" viewBox="0 0 50 60">
  <defs>
    <linearGradient id="wall-switch-paint-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wall-switch-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="wall-switch-paint-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="wall-switch-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <rect id="wall-switch-g1" x="4" y="4" width="42" height="52" rx="4"/>
    <rect id="wall-switch-g2" x="12" y="10" width="26" height="40" rx="3"/>
    <rect id="wall-switch-g3" x="14" y="12" width="22" height="36" rx="3"/>
    <circle id="wall-switch-g4" cx="25" cy="42" r="1.8"/>
  </defs>
  <g id="body" data-layer="part" data-mat="appliance" fill="#e2e6ea" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#wall-switch-g1"/>
    <use href="#wall-switch-g1" fill="url(#wall-switch-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#wall-switch-g2" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#wall-switch-g2" fill="url(#wall-switch-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
  </g>
  <g id="bilanciere" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#wall-switch-g3" fill="#e2e6ea" data-mat="appliance"/>
    <use href="#wall-switch-g3" fill="url(#wall-switch-paint-v)" stroke="none" opacity="1" data-shade="paint-v"/>
    <path d="M14 30 L36 30" fill="none" stroke-opacity="0.35"/>
  </g>
  <g id="layer-2" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <circle cx="25" cy="42" r="1.8" fill="#2f5a39" data-mat="lamp-green-off"/>
  </g>
  <g id="lamp" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#wall-switch-g4" fill="#3fb950" data-mat="lamp-green"/>
    <use href="#wall-switch-g4" fill="url(#wall-switch-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
