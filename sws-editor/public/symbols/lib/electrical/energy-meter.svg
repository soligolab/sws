    <path d="M16 22.0 L28.2 22.0 M31.8 22.0 L44 22.0" fill="none" stroke="#3fb950" data-mat-stroke="lamp-green" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="12" y="14" width="36" height="16" rx="2" fill="url(#energy-meter-glass-r)" fill-opacity="0.4" stroke="none" opacity="1" data-shade="glass-r"/>
