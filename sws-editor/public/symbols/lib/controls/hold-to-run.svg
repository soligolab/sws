<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="hold-to-run-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="hold-to-run-paint-r" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="hold-to-run-glass-r" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <circle id="hold-to-run-g1" cx="30" cy="30" r="25"/>
    <circle id="hold-to-run-g2" cx="30" cy="30" r="15"/>
  </defs>
  <g id="layer-0" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <circle cx="30" cy="30" r="27" fill="#4a545d" data-mat="steel-dark"/>
  </g>
  <g id="body" data-layer="part" data-mat="steel-dark" fill="#4a545d" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#hold-to-run-g1"/>
    <use href="#hold-to-run-g1" fill="url(#hold-to-run-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <circle cx="30" cy="30" r="18" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#hold-to-run-g2" fill="#3fae5a" data-mat="gauge-green"/>
    <use href="#hold-to-run-g2" fill="url(#hold-to-run-paint-r)" stroke="none" opacity="1" data-shade="paint-r"/>
  </g>
  <g id="premuto" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <circle cx="30" cy="30" r="15" fill="#3fb950" data-mat="lamp-green"/>
  </g>
  <g id="layer-2" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <ellipse cx="26" cy="25" rx="7" ry="5" fill="url(#hold-to-run-glass-r)" stroke="none" opacity="1" data-shade="glass-r"/>
  </g>
