<svg xmlns="http://www.w3.org/2000/svg" width="100" height="30" viewBox="0 0 100 30">
  <defs>
    <linearGradient id="pallet-paint-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pallet-paint-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <rect id="pallet-g1" x="2" y="4" width="96" height="6" rx="1"/>
    <rect id="pallet-g2" x="2" y="20" width="96" height="6" rx="1"/>
    <rect id="pallet-g3" x="4" y="10" width="12" height="10" rx="1"/>
    <rect id="pallet-g4" x="44" y="10" width="12" height="10" rx="1"/>
    <rect id="pallet-g5" x="84" y="10" width="12" height="10" rx="1"/>
  </defs>
  <g id="body" data-layer="part" data-mat="wood" fill="#b98a55" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#pallet-g1"/>
    <use href="#pallet-g1" fill="url(#pallet-paint-v)" stroke="none" opacity="1" data-shade="paint-v"/>
    <use href="#pallet-g2"/>
    <use href="#pallet-g2" fill="url(#pallet-paint-v)" stroke="none" opacity="1" data-shade="paint-v"/>
    <use href="#pallet-g3"/>
    <use href="#pallet-g3" fill="url(#pallet-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
    <use href="#pallet-g4"/>
    <use href="#pallet-g4" fill="url(#pallet-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
    <use href="#pallet-g5"/>
    <use href="#pallet-g5" fill="url(#pallet-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
  </g>
