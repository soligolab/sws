    <rect id="photoelectric-sensor-g1" x="3" y="14" width="7" height="12" rx="1.5"/>
    <rect id="photoelectric-sensor-g2" x="10" y="6" width="34" height="28" rx="3"/>
  </defs>
  <g id="layer-0" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <path d="M0 20 L4 20" fill="none" stroke="#2a2d31" data-mat-stroke="rubber" stroke-width="4"/>
