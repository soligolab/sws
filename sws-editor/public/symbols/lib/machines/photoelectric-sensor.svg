    <use href="#photoelectric-sensor-g2" fill="url(#photoelectric-sensor-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
