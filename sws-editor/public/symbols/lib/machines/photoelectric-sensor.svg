    <rect x="44" y="10" width="7" height="20" rx="1.5" fill="url(#photoelectric-sensor-glass-r)" fill-opacity="0.6" stroke="none" opacity="1" data-shade="glass-r"/>
    <circle cx="17" cy="12" r="2.3" fill="#2f5a39" data-mat="lamp-green-off"/>
