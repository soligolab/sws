<svg xmlns="http://www.w3.org/2000/svg" width="60" height="100" viewBox="0 0 60 100">
  <defs>
    <linearGradient id="limit-switch-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="limit-switch-metal-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.49"/>
    </linearGradient>
    <radialGradient id="limit-switch-rubber-r" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.23"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.52"/>
    </radialGradient>
    <linearGradient id="limit-switch-paint-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <rect id="limit-switch-g1" x="24" y="88" width="12" height="8" rx="2"/>
    <rect id="limit-switch-g2" x="26" y="30" width="8" height="12"/>
    <rect id="limit-switch-g3" x="28" y="6" width="4" height="28" rx="1.5"/>
    <circle id="limit-switch-g4" cx="30" cy="8" r="6"/>
    <rect id="limit-switch-g5" x="10" y="40" width="40" height="50" rx="4"/>
  </defs>
  <g id="layer-0" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <path d="M30 96 L30 100" fill="none" stroke="#2a2d31" data-mat-stroke="rubber" stroke-width="4"/>
    <use href="#limit-switch-g1" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#limit-switch-g1" fill="url(#limit-switch-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
    <use href="#limit-switch-g2" fill="#9aa5af" data-mat="steel"/>
    <use href="#limit-switch-g2" fill="url(#limit-switch-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
  </g>
  <g id="lever" data-layer="part" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#limit-switch-g3" fill="#9aa5af" data-mat="steel"/>
    <use href="#limit-switch-g3" fill="url(#limit-switch-metal-h)" stroke="none" opacity="1" data-shade="metal-h"/>
    <use href="#limit-switch-g4" fill="#2a2d31" data-mat="rubber"/>
    <use href="#limit-switch-g4" fill="url(#limit-switch-rubber-r)" stroke="none" opacity="1" data-shade="rubber-r"/>
    <circle cx="30" cy="32" r="3" fill="#4a545d" data-mat="steel-dark"/>
  </g>
  <g id="body" data-layer="part" data-mat="safety-yellow" fill="#e3a51a" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#limit-switch-g5"/>
    <use href="#limit-switch-g5" fill="url(#limit-switch-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
  </g>
