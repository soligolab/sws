<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="emergency-stop-paint-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="emergency-stop-dark-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.37"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="emergency-stop-paint-r" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <rect id="emergency-stop-g1" x="4" y="4" width="52" height="52" rx="6"/>
    <circle id="emergency-stop-g2" cx="30" cy="30" r="20"/>
    <circle id="emergency-stop-g3" cx="30" cy="30" r="16"/>
  </defs>
  <g id="body" data-layer="part" data-mat="safety-yellow" fill="#e3a51a" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#emergency-stop-g1"/>
    <use href="#emergency-stop-g1" fill="url(#emergency-stop-paint-d)" stroke="none" opacity="1" data-shade="paint-d"/>
  </g>
  <g id="layer-1" data-layer="static" stroke="#1c2329" stroke-width="1" stroke-linejoin="round">
    <use href="#emergency-stop-g2" fill="#4a545d" data-mat="steel-dark"/>
    <use href="#emergency-stop-g2" fill="url(#emergency-stop-dark-v)" stroke="none" opacity="1" data-shade="dark-v"/>
    <use href="#emergency-stop-g3" fill="#c8352e" data-mat="signal-red"/>
    <use href="#emergency-stop-g3" fill="url(#emergency-stop-paint-r)" stroke="none" opacity="1" data-shade="paint-r"/>
    <circle cx="30" cy="30" r="9" fill="none" stroke-opacity="0.45"/>
  </g>
