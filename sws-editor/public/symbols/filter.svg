<?xml version="1.0" encoding="UTF-8"?>
<!--
  SWS cartridge filter — vertical housing with diagonal hatching.
  Original work by the SWS project, dedicated to the public domain
  (CC0 1.0). See ATTRIBUTION.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <defs>
    <pattern id="sws-filter-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
    </pattern>
  </defs>
  <!-- housing -->
  <rect x="18" y="14" width="44" height="72" rx="6" ry="6"
        fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <!-- internal media -->
  <rect x="22" y="22" width="36" height="56" fill="url(#sws-filter-hatch)" opacity="0.85"/>
  <!-- inlet (top) -->
  <rect x="36" y="2" width="8" height="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <!-- outlet (bottom) -->
  <rect x="36" y="84" width="8" height="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <!-- DP gauge tag -->
  <circle cx="68" cy="40" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="68" y="44" text-anchor="middle" font-size="9" font-weight="700"
        fill="#cbd5e1" font-family="system-ui, sans-serif">DP</text>
</svg>
