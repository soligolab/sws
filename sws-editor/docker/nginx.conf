server {
    listen 8443 ssl;
    server_name localhost;

    # Certificate mounted from the shared sws-config volume
    ssl_certificate     /var/sws/config/tls.crt;
    ssl_certificate_key /var/sws/config/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Deny plain HTTP
    error_page 497 https://$host:$server_port$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to runtime
    location /api/ {
        proxy_pass https://runtime:8443/api/;
        proxy_ssl_verify off;
    }

    # Proxy WebSocket to runtime
    location /ws/ {
        proxy_pass https://runtime:8443/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_verify off;
    }
}
