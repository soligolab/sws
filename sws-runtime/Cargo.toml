[workspace]
resolver = "2"
members = ["crates/*"]
# sws-kiosk requires libgtk-4-dev + libwebkitgtk-6.0-dev (not installed everywhere).
# Build explicitly: cargo build -p sws-kiosk (after: sudo apt install libgtk-4-dev libwebkitgtk-6.0-dev)
exclude = ["crates/sws-kiosk"]

[workspace.package]
version      = "0.1.0-dev"
edition      = "2021"
rust-version = "1.75"
license      = "AGPL-3.0-only"
authors      = ["Soligo Lab <hello@soligolab.example>"]
repository   = "https://github.com/soligolab/sws"
homepage     = "https://soligolab.example"

[workspace.dependencies]
# Async runtime
tokio            = { version = "1.36",  features = ["full"] }
tokio-util       = { version = "0.7" }
# `Sink::send` / `Stream::next` traits on the axum WebSocket. Used by the
# bidirectional /ws/tags handler to split read + write into separate tasks.
futures-util     = { version = "0.3",   default-features = false, features = ["std", "sink"] }

# Historian persistence
rusqlite         = { version = "0.32",  features = ["bundled"] }

# Web framework
axum             = { version = "0.7",   features = ["ws"] }
tower            = "0.4"
tower-http       = { version = "0.5",   features = ["cors", "trace", "fs"] }

# Tracing / logging
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["json", "env-filter"] }
time                 = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1"

# TLS (pure Rust, no OpenSSL)
# Explicitly enable the ring crypto backend.  Rustls 0.23 panics at startup if
# multiple providers end up in the dep graph (e.g., ring via rcgen + aws-lc-rs
# via hyper-rustls/reqwest) without an explicit install_default() call.
# Declaring ring here makes the feature flag unambiguous; main.rs calls
# install_default() as the belt-and-suspenders counterpart.
rustls        = { version = "0.23", features = ["ring"] }
tokio-rustls  = "0.26"
rcgen         = "0.13"
hyper          = { version = "1",   features = ["http1", "http2"] }
hyper-util     = { version = "0.1", features = ["tokio", "server", "server-auto"] }
rustls-pemfile = "2"

# Auth
argon2 = { version = "0.5", features = ["std"] }
uuid   = { version = "1", features = ["v4"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Protocols
tokio-modbus = "0.6"
async-opcua  = { version = "0.18", features = ["client"] }
rumqttc      = "0.24"
rumqttd      = "0.19"

# Python scripting
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# Observability
metrics                      = "0.23"
metrics-exporter-prometheus  = "0.15"

# Plugin ABI
abi_stable = "0.11"

# HTTP client (alarm webhooks)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Error handling
anyhow = "1"

# System metrics (CPU, RAM, disk)
sysinfo = "0.30"

# Scratch directories (e.g. one-shot PKI for OPC-UA browse)
tempfile = "3"
