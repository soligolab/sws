[workspace]
resolver = "2"
members = ["crates/*"]
# sws-kiosk requires libgtk-4-dev + libwebkitgtk-6.0-dev (not installed everywhere).
# Build explicitly: cargo build --manifest-path crates/sws-kiosk/Cargo.toml (after: sudo apt install libgtk-4-dev libwebkitgtk-6.0-dev)
# sws-lvgl-viewer È nel workspace dal 2026-08-25. Prima era escluso perché
# builda LVGL da sorgente (bindgen → libclang) e linka SDL2: prerequisiti che
# "non erano installati ovunque". Il prezzo di quell'esclusione era che
# `cargo check --workspace` non lo compilava, `cargo test --workspace` non lo
# eseguiva e la CI non lo toccava — ed è il crate dove si sono concentrati i
# difetti (Q22, il crash della sparkline, i binding che non si muovevano).
# Un crate fuori dalla rete di sicurezza è esattamente quello che non va
# lasciato fuori.
#
# PREREQUISITI ORA OBBLIGATORI per compilare il workspace:
#   sudo apt install clang libclang-dev libsdl2-dev
# Vedi docs/YOCTO_CROSSCOMPILE.md e docs/adr/0002-lvgl-rendering-engine.md.
exclude = ["crates/sws-kiosk"]

[workspace.package]
version = "2.4.0"
edition      = "2021"
rust-version = "1.75"
license      = "AGPL-3.0-only"
authors      = ["Soligo Lab <hello@soligolab.example>"]
repository   = "https://github.com/soligolab/sws"
homepage     = "https://soligolab.example"

[workspace.dependencies]
# Async runtime
tokio            = { version = "1.36",  features = ["full"] }
tokio-util       = { version = "0.7" }
# `Sink::send` / `Stream::next` traits on the axum WebSocket. Used by the
# bidirectional /ws/tags handler to split read + write into separate tasks.
futures-util     = { version = "0.3",   default-features = false, features = ["std", "sink"] }
tokio-stream     = { version = "0.1" }

# Historian persistence
rusqlite         = { version = "0.32",  features = ["bundled"] }
# PostgreSQL async driver (plain TCP — operators set sslmode in connstring).
tokio-postgres   = { version = "0.7",   default-features = false, features = ["runtime"] }

# Web framework
axum             = { version = "0.7",   features = ["ws"] }
tower            = "0.4"
tower-http       = { version = "0.5",   features = ["cors", "trace", "fs"] }

# Tracing / logging
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["json", "env-filter"] }
time                 = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1"

# TLS (pure Rust, no OpenSSL)
# Explicitly enable the ring crypto backend.  Rustls 0.23 panics at startup if
# multiple providers end up in the dep graph (e.g., ring via rcgen + aws-lc-rs
# via hyper-rustls/reqwest) without an explicit install_default() call.
# Declaring ring here makes the feature flag unambiguous; main.rs calls
# install_default() as the belt-and-suspenders counterpart.
rustls        = { version = "0.23", features = ["ring"] }
tokio-rustls  = "0.26"
rcgen         = "0.13"
hyper          = { version = "1",   features = ["http1", "http2"] }
hyper-util     = { version = "0.1", features = ["tokio", "server", "server-auto"] }
rustls-pemfile = "2"

# mDNS service discovery — announce _sws._tcp.local. at startup and browse on demand.
# Pure Rust, no avahi/dbus dependency.
mdns-sd = { version = "0.20", default-features = false }
# Enumerazione delle interfacce: stessa versione che mdns-sd già tira dentro,
# quindi nessuna dipendenza nuova da scaricare — vedi sws-web/src/netif.rs.
if-addrs = "0.15"

# Auth
argon2 = { version = "0.5", features = ["std"] }
uuid   = { version = "1", features = ["v4"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Protocols
tokio-modbus      = "0.6"
tokio-serial      = "5.4"
async-opcua       = { version = "0.18", features = ["client", "server"] }
rumqttc           = "0.24"
rumqttd           = "0.19"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Python scripting
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# Observability
metrics                      = "0.23"
metrics-exporter-prometheus  = "0.15"

# Plugin ABI
abi_stable = "0.11"

# HTTP client (alarm webhooks)
# "stream" serve al client Anthropic (T-50): la risposta arriva in SSE e va
# letta a pezzi, altrimenti la chat resta muta per tutta la durata del turno.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Error handling
anyhow = "1"

# Byte order helpers (used by S7/EtherNetIP plugins)
byteorder = "1"

# EtherNet/IP (CIP) async client for Allen-Bradley PLC
rseip = "0.3.1"

# Protobuf encode/decode for Sparkplug B (no protoc needed — structs are hand-written)
prost = "0.13"

# System metrics (CPU, RAM, disk)
sysinfo = "0.30"

# Project fingerprint (SHA-256 of project.yaml + synoptics)
sha2 = "0.10"

# Scratch directories (e.g. one-shot PKI for OPC-UA browse)
tempfile = "3"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# ── Sorgente di lvgl-sys ──────────────────────────────────────────────────────
#
# Si compila la copia vendorizzata, non quella di crates.io, perché contiene le
# correzioni in `patches/lvgl/` — fra cui quella a `lv_chart_add_series` che
# senza di essa fa crashare il viewer con SIGSEGV (docs/OPEN_QUESTIONS.md Q22).
#
# DEVE stare qui, nella radice del workspace: cargo legge `[patch]` solo dal
# manifest della radice e IGNORA quelli dei membri, avvisando con una riga che
# scorre via in mezzo all'output di build. Stava dentro
# crates/sws-lvgl-viewer/Cargo.toml, dove ha funzionato finché quel crate era
# escluso dal workspace — cioè finché era lui la radice.
#
# `scripts/check_vendor_patches.sh` verifica che le patch siano applicate al
# sorgente vendorizzato, ma non può accorgersi che quel sorgente non venga
# compilato: sono due garanzie diverse, e servono entrambe.
[patch.crates-io]
lvgl-sys = { path = "crates/sws-lvgl-viewer/vendor/lvgl-sys-0.6.2" }
