# Configurazione a livello di workspace.
#
# `DEP_LV_CONFIG_PATH` dice a `lvgl-sys` dove trovare `lv_conf.h`. Serve qui, e
# non solo nel config dentro il crate, perché dal 2026-08-25 `sws-lvgl-viewer`
# fa parte del workspace: `cargo check --workspace` gira con la working
# directory in `sws-runtime/`, e Cargo cerca `.cargo/config.toml` risalendo
# dalla cwd — non dal manifest del crate. Senza questa riga la compilazione
# fallisce con un messaggio su `lv_conf.h` che non spiega perché.
#
# `relative = true` risolve il percorso rispetto alla cartella che contiene
# QUESTO file, quindi va scritto per intero da `sws-runtime/`. Il config dentro
# il crate resta e continua a valere quando si compila da lì (ha la precedenza,
# essendo più vicino alla cwd): serve a `scripts/yocto/build.sh`, che entra
# nella cartella del crate per la cross-compilazione.
[env]
DEP_LV_CONFIG_PATH = { value = "crates/sws-lvgl-viewer/lv_conf", relative = true }

# ── FreeType per LVGL (Q24) ──────────────────────────────────────────────────
#
# `LV_USE_FREETYPE 1` in lv_conf.h fa compilare `lv_freetype.c`, che include
# `ft2build.h` e chiama la libreria: servono il percorso degli header e il link.
#
# `LVGL_INCLUDE` **sostituisce** il default del build.rs
# (`/usr/include,/usr/local/include`), non lo estende: i due percorsi di prima
# vanno riscritti, o SDL2 smette di trovarsi. In cross-compilazione contano poco
# perché il sysroot dell'SDK viene prima, ma lasciarli fuori romperebbe la build
# nativa sul PC di sviluppo — che è quella che si usa per provare in fretta.
#
# `freetype2` (non `freetype`): è il nome della cartella degli header, sia su
# Ubuntu sia nel sysroot Yocto Pixsys — verificato in entrambi il 2026-08-27.
# `LVGL_EXTRA_*` e non `LVGL_INCLUDE`/`LVGL_LINK`: quelle esistono a monte ma
# solo sotto la feature `drivers`, che qui è spenta — sarebbero ignorate in
# silenzio. Le due nuove arrivano da patches/lvgl/0002-extra-include-e-link.patch.
LVGL_EXTRA_INCLUDE = "/usr/include/freetype2"
LVGL_EXTRA_LINK = "freetype"
