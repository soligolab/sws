[package]
name    = "sws-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace      = true
tokio-util.workspace = true
serde.workspace      = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace    = true
anyhow.workspace     = true
# Q49 — pinning TLS condiviso (pin_tls): stessa rustls "ring" del resto del
# workspace, sha2 pura Rust, nessun peso nuovo per la cross-compilazione.
rustls.workspace     = true
sha2.workspace       = true
webpki-roots.workspace = true
unicode-properties.workspace = true

# `nice` per thread, per i lavori di fondo (motori.rs). Solo Unix: altrove la
# funzione che la usa è un corpo vuoto.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace    = true
tokio = { workspace = true, features = ["test-util"] }
