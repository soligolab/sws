[package]
# Escluso dal workspace principale (vedi sws-runtime/Cargo.toml), quindi non può
# ereditare da [workspace.package] come fanno gli altri crate — stesso motivo/pattern di sws-kiosk.
name    = "sws-lvgl-viewer"
version = "2.3.2"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "sws-lvgl-viewer"
path = "src/main.rs"

[dependencies]
# LVGL core. Config reale (non `use-vendored-config`, il cui LV_MEM_SIZE di
# 48KB è troppo poco per un display di questa risoluzione) fornita via
# lv_conf/lv_conf.h — vedi .cargo/config.toml per DEP_LV_CONFIG_PATH.
# `embedded_graphics` è nominalmente opzionale ma `input_device/pointer.rs`
# lo importa incondizionatamente in questa versione — senza la feature non
# compila affatto, non è una scelta nostra.
lvgl     = { version = "0.6", default-features = false, features = ["embedded_graphics"] }
# Accesso FFI diretto: alcuni setter (es. Slider::set_value) non sono ancora
# esposti dal binding safe `lvgl` 0.6.2 (vedi src/lvgl_render.rs), e la
# registrazione del display bypassa del tutto `lvgl::Display`/`DrawBuffer`
# (bug di lifetime confermato — vedi docs/OPEN_QUESTIONS.md Q14 e
# src/lvgl_display.rs) usando solo questi binding raw + storage `'static`
# ottenuto con `Box::leak`.
lvgl-sys = "0.6"
# Finestra/texture/event loop per la verifica visiva interattiva (in
# alternativa reale, non solo teorica, all'export PNG headless — deciso col
# maintainer il 2026-08-08). Linka libsdl2 di sistema (libsdl2-dev), niente
# feature bundled/static-link: sul dev server e sul PC di casa il pacchetto
# è installato via apt, non serve vendorizzare/compilare SDL2 da sorgente.
sdl2 = "0.38"
# ── D2 (Q15+Q16): rasterizzazione SVG a runtime ──────────────────────────────
# LVGL 8.x non ha renderer SVG, quindi i 12 simboli "vendored", i simboli
# custom disegnati dall'utente e tutto il widget `image` (il cui catalogo
# bundlato è fatto di .svg) resterebbero muti sul pannello.
#
# `default-features = false`: si tengono fuori text/system-fonts, che tirano
# dentro fontdb e la scansione dei font di sistema — peso e tempo d'avvio che
# non servono, perché i simboli del catalogo sono forme geometriche senza
# testo. Se un giorno servisse un SVG con del testo, il limite è dichiarato e
# la feature si riaccende sapendo cosa costa.
resvg = { version = "0.45", default-features = false }


# Riuso diretto dei tipi wire già condivisi da tutto il runtime (TagValue è
# #[serde(untagged)], TagQuality è una stringa) invece di riscriverli una terza
# volta accanto al mirror TS e al mirror sws-web/src/synoptic.rs.
sws-core = { path = "../sws-core" }

tokio          = { version = "1.36", features = ["full"] }
futures-util   = { version = "0.3",  default-features = false, features = ["std", "sink"] }
reqwest        = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls         = { version = "0.23", features = ["ring"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
clap           = { version = "4", features = ["derive"] }
anyhow         = "1"
cstr_core      = "0.2"
# mmap/munmap per src/drm_display.rs — API stabilissima, nessun rischio di
# scarto di versione (a differenza della crate wrapper `drm`, la cui
# superficie API è cambiata più volte fra le versioni: preferito bindgen
# diretto contro libdrm invece di quella, vedi build.rs).
libc           = "0.2"

[build-dependencies]
# Genera i binding libdrm per src/drm_display.rs (percorso di rendering
# DRM/KMS diretto, alternativo a SDL2 — vedi build.rs per il perché). Stessa
# versione già usata da vendor/lvgl-sys-0.6.2/Cargo.toml, per coerenza.
bindgen = "0.64.0"

# `lvgl-sys` 0.6.2 esporta una propria strncmp/strcmp (#[no_mangle], per
# target senza libc) che sostituisce quelle di sistema per l'intero processo
# — e la sua strncmp fa `slice::from_raw_parts(ptr, n)` PRIMA di confrontare
# un byte, che crasha per qualunque n grande (strcmp la chiama con
# n=usize::MAX). Non è un problema solo nostro/di LVGL: SDL2 (via libdbus,
# durante l'init) ci è finita dentro chiamando la sua normale strcmp.
# Nessuna feature per disattivarlo — vendorizzata una copia locale con la
# sola strncmp corretta (scansione byte-per-byte, vedi
# vendor/lvgl-sys-0.6.2/src/string_impl.rs). Analisi completa in
# docs/OPEN_QUESTIONS.md Q14.
# La patch che sostituisce lvgl-sys col sorgente vendorizzato NON sta più qui:
# sta in sws-runtime/Cargo.toml, la radice del workspace.
#
# Cargo legge `[patch]` SOLO dal manifest della radice. Finché questo crate era
# escluso dal workspace era lui la radice e la patch funzionava; da quando è
# entrato (2026-08-25) veniva ignorata, con un avviso che scorre via in mezzo
# all'output di build — e la libreria arrivava da crates.io, senza la correzione
# in patches/lvgl/. Vedi docs/OPEN_QUESTIONS.md Q22.
