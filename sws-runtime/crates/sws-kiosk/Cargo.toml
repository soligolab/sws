[package]
name    = "sws-kiosk"
version = "2.26.0-rc.11"
edition = "2021"
# Fuori dal workspace come sws-lvgl-viewer, quindi scritta a mano: la stessa
# doppia licenza del resto di SWS (LICENSING.md).
license = "AGPL-3.0-only OR LicenseRef-SWS-Commercial"

[[bin]]
name = "sws-kiosk"
path = "src/main.rs"

[dependencies]
gtk4    = { version = "0.11", features = ["v4_10"] }
webkit6 = { version = "0.6", features = ["v2_42"] }
clap    = { version = "4", features = ["derive"] }
