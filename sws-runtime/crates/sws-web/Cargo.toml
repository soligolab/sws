[package]
name    = "sws-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace        = true
tokio-util.workspace   = true
axum.workspace         = true
tower.workspace        = true
tower-http.workspace   = true
serde.workspace        = true
serde_json.workspace   = true
serde_yaml.workspace   = true
tracing.workspace      = true
anyhow.workspace       = true
# Project import/export uses an in-memory ZIP. `default-features = false`
# strips deflate / xz / zstd codecs — the bundle is a handful of small
# YAML files so we store them uncompressed (`CompressionMethod::Stored`)
# and avoid pulling in flate2/miniz_oxide and friends.
zip = { version = "2", default-features = false }
sws-core          = { path = "../sws-core" }
sws-historian     = { path = "../sws-historian" }
sws-pyscript      = { path = "../sws-pyscript" }
sws-auth          = { path = "../sws-auth" }
sws-plugin-modbus = { path = "../sws-plugin-modbus" }
sws-plugin-mqtt   = { path = "../sws-plugin-mqtt" }
