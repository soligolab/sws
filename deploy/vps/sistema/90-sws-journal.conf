# /etc/systemd/journald.conf.d/90-sws-journal.conf
#
# Il journal del VPS tiene i log del gateway, che citano indirizzi e-mail e IP
# di chi entra. L'informativa (docs/legale/LEGGIMI.md, §6) promette che il
# registro delle attivita' si tiene 12 mesi: il registro di SWS si pota da se'
# (sws-web/src/ciclo_account.rs), il journal no, e lo fa questo file.
#
# Si applica a mano, una volta (30-10-2026, non ancora applicato):
#   sudo install -m 644 90-sws-journal.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
[Journal]
MaxRetentionSec=12month
SystemMaxUse=2G
