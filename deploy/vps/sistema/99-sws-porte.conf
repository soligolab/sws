# Traefik gira senza root (podman rootless) e deve legare la 80 e la 443.
# Il kernel riserva le porte sotto la 1024 ai processi privilegiati: qui abbassiamo
# quella soglia a 80, cosi il proxy puo ascoltare restando non privilegiato.
# L alternativa era far girare come root il processo esposto a Internet: peggio.
# Nonostante il nome ipv4, su Linux questo parametro governa anche IPv6.
net.ipv4.ip_unprivileged_port_start = 80
