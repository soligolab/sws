# Il sito del manuale (piano manuale pubblico, M2, 12-11-2026). Decisione del 03-11-2026: niente
# crawler IA e niente scaricamento in massa; l'indicizzazione dei motori di ricerca va bene.

# I crawler IA che si dichiarano: 403. Lo stesso elenco sta in robots.txt.
map $http_user_agent $crawler_ia {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Google-Extended|Bytespider|PerplexityBot|Amazonbot|Applebot-Extended|meta-externalagent|FacebookBot|Diffbot|cohere-ai|YouBot|Omgilibot|ImagesiftBot) 1;
}

# Lo scaricamento in massa. Dietro Traefik l'indirizzo che nginx vede può essere quello di Traefik
# (seme «indirizzo vero dietro Traefik»): allora questo limite vale per tutti insieme, ed è tarato
# largo apposta. Diventa per persona quando arriva l'indirizzo vero.
limit_req_zone $binary_remote_addr zone=manuale:1m rate=20r/s;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    if ($crawler_ia) { return 403; }

    location = /robots.txt { default_type text/plain; }
    location = /manuale { return 301 /manuale/; }
    location /manuale/ {
        limit_req zone=manuale burst=60 nodelay;
        limit_req_status 429;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=300" always;
    }
    location / { return 404; }
}
