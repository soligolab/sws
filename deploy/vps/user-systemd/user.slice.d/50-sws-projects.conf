# The project containers the gateway opens: podman's API puts them in the user
# manager's user.slice, while gateway, Traefik, Portainer and the manual are
# quadlet services in app.slice (measured on 18-11-2026). All the projects
# together get at most 1.5 of the VPS's 2 cores, so the gateway always keeps
# half a core however many projects run wild (CRA session 3, D21). Each project
# is also capped at one core by the gateway itself.
#
# On the VPS, as the user that runs the containers:
#   ~/.config/systemd/user/user.slice.d/50-sws-projects.conf
#   systemctl --user daemon-reload
# Check:
#   cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/user.slice/cpu.max
#   → 150000 100000
[Slice]
CPUQuota=150%
