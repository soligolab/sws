# Le Novità per chi usa il pannello — italiano e inglese.
#
# Non è il CHANGELOG: quello è per chi sviluppa (file, funzioni, il perché di
# ogni difetto). Queste sono le poche righe che il pannello e l'IDE mostrano
# **prima di aggiornare** (piano docs/plans/2026-09-27-aggiornamento-runtime-e-
# bus-utente.md, decisioni 55-58): viaggiano dentro l'immagine come etichette, e
# si leggono nella lingua dell'interfaccia.
#
# Regole (le controlla scripts/check_novita.sh):
#   - una voce per cosa che chi usa SWS nota; `it` e `en` sempre tutte e due;
#   - una voce sta in una riga o due (al massimo 220 caratteri per lingua);
#   - `compatibilita`: ciò che va fatto a mano dopo l'aggiornamento, o che smette
#     di funzionare. Il pannello lo mette in cima e chiede una conferma in più;
#   - una `-rc` mostra la voce della release a cui porta (2.12.0-rc.8 → 2.12.0):
#     tutto ciò che arriverà, non la differenza fra una rc e l'altra (decisione 56).
#
# Le scrive chi fa il lavoro, insieme al lavoro; il maintainer le rivede al collaudo.
#
# ⚠ UNA VOCE VIVE SOLO SE LA SUA VERSIONE VIENE COSTRUITA. Queste righe non si
# leggono da questo file: viaggiano come **etichette dentro l'immagine**, e il
# pannello le raccoglie dalle immagini delle versioni che sta per attraversare
# (`versioni_dopo` in `sws-web/src/aggiornamento.rs`, che legge i tag del
# registry). Un blocco di una versione **taggata in git ma mai costruita** non è
# dentro nessuna immagine, e quindi non lo leggerà mai nessuno.
#
# È successo il 21-10-2026: 2.16.0 e 2.16.1 sono state taggate e non costruite,
# e l'avviso sul cambio di porte - il più importante della giornata - stava nel
# blocco 2.16.1. Nessun pannello lo ha visto. Le voci sono state riportate qui
# sotto, sotto «Unreleased», per la prossima immagine vera.
#
# Regola: **si tagga quando si costruisce**. Se una versione resta senza
# immagine, le sue voci vanno riportate in avanti, qui, prima del rilascio
# successivo.

versioni:
  - versione: "Unreleased"
    voci:
      - it: "Sparkplug B adesso funziona davvero: i numeri di campo del protobuf erano sbagliati e un impianto vero non si leggeva. Gestiti anche gli alias, che sono il modo normale in cui Sparkplug manda i dati."
        en: "Sparkplug B now actually works: the protobuf field numbers were wrong and a real plant could not be read. Aliases are handled too, which is how Sparkplug normally sends data."
      - it: "Il certificato TLS generato dal pannello adesso porta il suo nome, e copre anche <nome> e <nome>.local: prima diceva «rcgen self signed cert» su ogni pannello e nominava solo localhost. Vale dalla prossima generazione."
        en: "The TLS certificate the panel generates now carries its own name and also covers <name> and <name>.local: it used to say «rcgen self signed cert» on every panel and only named localhost. Applies from the next generation."
      - it: "Collegandosi a un pannello, l'IDE mostra l'impronta del suo certificato e dice se l'ha memorizzata adesso: al primo collegamento si puo confrontare con quella che il pannello mostra sul suo schermo."
        en: "When connecting to a panel, the IDE now shows its certificate fingerprint and says whether it stored it just now: on first connection you can compare it with the one shown on the panel's own screen."
      - it: "Il trust store OPC-UA ora e riservato all'Amministratore: prima l'elenco lo vedeva anche il Supervisore. E ogni operazione sui certificati finisce nel registro di audit, con il nome di chi l'ha fatta."
        en: "The OPC-UA trust store is now Administrator-only: the list was visible to Supervisors too. And every certificate operation is now recorded in the audit log, with the name of who did it."
      - it: "Il certificato TLS si gestisce sul dispositivo connesso, non piu sul PC dell'IDE: la card diceva «dispositivo» e agiva in locale. Avvisa anche che l'impronta cambia e che poi va riconfermata."
        en: "The TLS certificate is now managed on the connected device, not on the IDE's own PC: the card said «device» and acted locally. It also warns that the fingerprint changes and must be re-confirmed."
      - it: "Corretto: un pannello su cui era stato acceso HTTPS non ripartiva piu dopo un riavvio, perche il controllo di salute lo cercava solo in chiaro. Schermo, indirizzi e sonde ora seguono il certificato."
        en: "Fixed: a panel with HTTPS enabled would not restart, because its health check only probed plain HTTP. Screen, addresses and probes now follow the certificate."
      - it: "Il trust store delle sorgenti OPC-UA ora funziona: l'elenco dei certificati era sempre vuoto e «Fidati» non faceva niente. Una sorgente nuova parte con una policy che valida il certificato del server."
        en: "The OPC-UA trust store now works: the certificate list was always empty and «Trust» did nothing. A new source now starts with a policy that validates the server certificate."
      - it: "Il pannello può fare anche da PLC: OpenPLC si installa a richiesta e la logica vive dentro il progetto, quindi viaggia col deploy e col backup. Non si installa da solo e non parte da solo."
        en: "The panel can act as a PLC too: OpenPLC installs on request and its logic lives inside the project, so it travels with the deploy and the backup. It neither installs nor starts by itself."
      - it: "Dal pannello si può di nuovo accedere come amministratore: la tastiera a schermo non si vedeva, non scriveva, e restava aperta bloccando ogni tocco. Premere «Aggiorna ora» lasciava il pannello inservibile."
        en: "You can log in as an administrator from the panel again: the on-screen keyboard was invisible, did not type, and stayed open blocking every touch. Pressing «Update now» left the panel unusable."

  - versione: "2.19.0"
    # Numero scelto dal maintainer il 23-10-2026, e taggato COSTRUENDO
    # l'immagine (regola di CLAUDE.md): un tag senza immagine perde le sue note
    # per sempre. Non c'e nessuna 2.18: il salto e voluto.
    voci:
      - it: "I valori letti da OPC-UA ora seguono la scala e il tipo dichiarati nel progetto: prima la scala non veniva applicata. Se un tuo tag OPC-UA ha una scala, i numeri a schermo cambiano."
        en: "Values read from OPC-UA now follow the scale and type declared in the project: the scale was not applied before. If one of your OPC-UA tags has a scale, the numbers on screen will change."
      - it: "Il registro di sistema del pannello non si riempie più di messaggi di podman: circa il 70% in meno. Prima la storia utile veniva sfrattata in poche ore."
        en: "The panel system log no longer fills up with podman messages: about 70% less. Before, useful history was evicted within hours."
      - it: "Un tubo agganciato a un oggetto lo segue anche quando a spostarlo è una variabile: prima restava disegnato dov'era e si staccava da ciò che collega."
        en: "A pipe anchored to an object now follows it even when a variable moves it: before it stayed where it was drawn and came away from what it connects."
      - it: "L'IDE torna ad avvisare quando il collegamento al dispositivo c'è ma le credenziali non valgono più: l'avviso c'era dal 16-10 e non era mai comparso, perché il runtime non mandava il dato."
        en: "The IDE warns again when the device connection is up but the credentials no longer work: the warning existed since 16-10 and never appeared, because the runtime did not send the flag."

  - versione: "2.17.0"
    # Numero scelto al rilascio del 22-10-2026, e taggato COSTRUENDO l'immagine
    # (regola di CLAUDE.md): un tag senza immagine perde le sue note per sempre.
    # Qui dentro, oltre al lavoro nuovo, ci sono le voci **riportate in avanti**
    # dalle versioni 2.16.0 e 2.16.1, taggate e mai costruite: senza, nessun
    # pannello le leggerebbe mai.
    compatibilita:
      - it: "Il pannello cambia porte: il viewer passa da 8443 a 7443 e la gestione da 8444 a 7444. Segnalibri e dispositivi salvati a mano vanno corretti una volta; «Cerca» li ritrova da sé."
        en: "The panel changes ports: the viewer moves from 8443 to 7443 and management from 8444 to 7444. Bookmarks and hand-saved devices need fixing once; «Search» finds them by itself."
    voci:
      - it: "Un pannello sospeso non può più essere rivendicato da un'altra azienda: sospenderlo ora vuol dire solo fermarlo. Spostarlo a un'altra azienda lo fa chi amministra la piattaforma, dalla console."
        en: "A suspended panel can no longer be claimed by another company: suspending it now only means stopping it. Moving it to another company is done by the platform administrator, from the console."
      - it: "Lo schermo del pannello non resta nero se la configurazione del servizio è rimasta indietro: il viewer prova da sé l'altra porta del runtime."
        en: "The panel screen no longer stays black when the service configuration is out of date: the viewer tries the runtime's other port by itself."
      - it: "Nella libreria dei simboli c'è una famiglia nuova, «Comandi da quadro»: pulsanti, funghi di emergenza, selettori, interruttori a coltello e manopole, sedici in tutto, che nascono già pronti a comandare."
        en: "The symbol library has a new family, «Panel controls»: pushbuttons, emergency stops, selectors, knife switches and knobs — sixteen in all, born ready to command."
      - it: "Il corpo del testo si può scegliere anche su pulsanti, navigatori, spie e caselle di spunta: prima il campo c'era e non faceva niente."
        en: "Text size can now be set on buttons, navigation buttons, lamps and checkboxes too: the field was there and did nothing."
      - it: "Il corpo del testo si sceglie anche su cursori, scelte multiple, barre, tabelle e grafici. Dove un oggetto ha due testi, etichetta e valore hanno un campo ciascuno; un grafico ne ha uno per tutto."
        en: "Text size can also be set on sliders, radio groups, bars, tables and charts. Where an object has two texts, label and value get a field each; a chart has one for all of it."
      - it: "Sul pannello il bottone «Chiudi finestra» funziona: le finestre si aprono davvero come finestre, con la loro barra e la ✕, e non piu' come una pagina a tutto schermo."
        en: "On the panel the «Close window» button works: windows now really open as windows, with their title bar and ✕, instead of as a full-screen page."
      - it: "Il setpoint mostra la stessa cosa sul pannello e nel browser: riga «Attuale», campo del valore e i due pulsanti. Sul pannello il tastierino riempie il campo e il ✓ conferma."
        en: "The setpoint shows the same thing on the panel and in the browser: «Current» row, value field and the two buttons. On the panel the keypad fills the field and ✓ confirms."
      - it: "Dopo un deploy non si resta piu' collegati solo in apparenza: chi era entrato resta entrato se nulla lo riguarda, e se la sessione cade si vede subito invece di scoprirlo al primo comando."
        en: "After a deploy you are no longer logged in only in appearance: whoever was in stays in if nothing about them changed, and if the session does end you see it at once instead of finding out on the first command."
      - it: "Le spaziature seguono il corpo del testo: ingrandendolo, le opzioni di una scelta multipla non si sovrappongono più e il valore di un cursore non finisce sulla traccia."
        en: "Spacing now follows the text size: enlarge it and a radio group's options no longer overlap, and a slider's value no longer lands on the track."
  - versione: "2.16.2"
    # La riga dei simboli stava qui ed è stata spostata sotto «Unreleased»: è
    # stata scritta dopo che l'immagine 2.16.2 era già costruita, quindi nella
    # sua etichetta non c'è. Un blocco deve dire quello che l'immagine porta.
    voci:
      - it: "Sul pannello, la lingua scelta dall'operatore non si perde più a ogni riavvio del viewer, e il certificato del runtime viene ricordato davvero invece di essere riaccettato ogni volta."
        en: "On the panel, the language the operator picked is no longer lost at every viewer restart, and the runtime's certificate is really remembered instead of being accepted anew each time."
  - versione: "2.16.1"
    compatibilita:
      - it: "Il pannello cambia porte: il viewer passa da 8443 a 7443 e la gestione da 8444 a 7444. Segnalibri e dispositivi salvati a mano vanno corretti una volta; «Cerca» li ritrova da sé."
        en: "The panel changes ports: the viewer moves from 8443 to 7443 and management from 8444 to 7444. Bookmarks and hand-saved devices need fixing once; «Search» finds them by itself."
      - it: "Dopo l'aggiornamento, apri Configurazione → Istanza → Device → Connessione → Aggiorna per allineare la configurazione del servizio. Lo schermo funziona anche prima: il viewer trova da sé la porta nuova."
        en: "After updating, open Configuration → Instance → Device → Connection → Update to align the service configuration. The screen works even before that: the viewer finds the new port by itself."
    voci:
      - it: "Lo schermo del pannello non resta nero se la configurazione del servizio è rimasta indietro: il viewer prova da sé l'altra porta del runtime e lo scrive nel log."
        en: "The panel screen no longer stays black when the service configuration is out of date: the viewer tries the runtime's other port by itself and says so in the log."
      - it: "Aggiornare la configurazione del servizio non spegne più un tunnel impostato a mano, e non rimette a chiamare il cloud un pannello installato senza."
        en: "Updating the service configuration no longer switches off a hand-configured tunnel, nor makes a panel installed without cloud start calling it again."
  - versione: "2.16.0"
    voci:
      - it: "Un pannello sospeso non può più essere rivendicato da un'altra azienda: sospenderlo ora vuol dire solo fermarlo. Spostarlo a un'altra azienda lo fa chi amministra la piattaforma, dalla console."
        en: "A suspended panel can no longer be claimed by another company: suspending it now only means stopping it. Moving it to another company is done by the platform administrator, from the console."
      - it: "Sullo schermo del pannello torna l'avviso di versione nuova anche con utenti: per aggiornare chiede l'accesso di un amministratore. L'esito dell'ultimo aggiornamento è una striscia che non copre la pagina."
        en: "The new-version notice is back on the panel screen even when the panel has users: updating asks for an administrator's login. The last update's outcome is a strip that doesn't cover the page."
      - it: "Console del cloud: ogni azienda vede quali suoi progetti sono aperti adesso e chi è collegato, e può chiuderli a mano; il conteggio dei progetti aperti ora è quello vero."
        en: "Cloud console: each company sees which of its projects are open right now and who is connected, and can close them by hand; the open-project count is now the real one."
      - it: "Storico: i limiti di giorni e di righe dei datastore ora si applicano da soli ogni notte, all'ora del progetto; la prima volta l'IDE dice quanto cancellerà e chiede conferma."
        en: "History: datastore limits in days and rows now apply by themselves every night, at the project's time; the first time the IDE says how much it will delete and asks to confirm."
  - versione: "2.15.0"
    voci:
      - it: "Siemens S7: la sorgente ora si collega davvero (prima falliva sempre all'apertura), e accetta una porta diversa dalla 102 per i PLC dietro un port forwarding."
        en: "Siemens S7: the source now really connects (it used to fail on opening every time), and accepts a port other than 102 for PLCs behind a port forward."
      - it: "I tubi si disegnano a clic, come la polilinea: ogni clic posa un punto, Shift fa un tratto dritto, e i capi si agganciano da soli alle bocche dei simboli vicini."
        en: "Pipes are drawn by clicking, like polylines: each click drops a point, Shift makes a straight run, and the ends snap to nearby symbol nozzles."
      - it: "Restare collegati a un pannello: dopo un deploy la sessione si rinnova da sola invece di scadere, e un invio fallito dice perché senza sparire dopo pochi secondi."
        en: "Staying connected to a panel: after a deploy the session renews itself instead of expiring, and a failed send says why without vanishing after a few seconds."
      - it: "Un oggetto aggiunto dalla palette nasce al centro di quello che stai guardando, non in cima alla pagina dove spesso era fuori schermo."
        en: "An object added from the palette appears at the centre of what you are looking at, not at the top of the page where it was often off-screen."
      - it: "Il «pull» di git ora richiede un amministratore, come il rollback: tira dentro una versione nuova del progetto e cambia l'impianto."
        en: "The git pull now requires an administrator, like rollback: it brings in a new version of the project and changes the plant."
  - versione: "2.14.0"
    # Cumulativa (19-10-2026): la 2.13.0 non è mai uscita come release, e un pannello che passa dalla
    # 2.12.0 alla 2.14.0 vede solo le etichette di questa. Qui ci sono quindi anche le voci e gli
    # avvisi della 2.13.0, raggruppati per tema; la 2.13.0 resta sotto, per le sue immagini rc.
    voci:
      - it: "Accesso e abbinamento: l'IDE ha i suoi utenti, con email e password; un pannello senza utenti resta chiuso e si abbina col suo codice, in rete locale o dal cloud anche dietro NAT."
        en: "Access and pairing: the IDE has its own users, with email and password; a panel without users stays locked and pairs with its code, on the local network or from the cloud even behind NAT."
      - it: "Aziende nel cloud: ognuna vede solo i suoi progetti, le sue persone e il suo marchio; la console mostra lo spazio usato e avvisa prima del limite; due aziende possono avere progetti con lo stesso nome."
        en: "Companies in the cloud: each one sees only its own projects, people and brand; the console shows the space used and warns before the limit; two companies may have projects with the same name."
      - it: "Elenco dei progetti a icone, con la barra di chi sei e per quale azienda; un progetto che non serve più si archivia invece di cancellarlo, e si ripristina con un clic."
        en: "Project list as icons, with a bar saying who you are and for which company; a project no longer needed can be archived instead of deleted, and restored with one click."
      - it: "Finestre: una pagina si apre sopra quella corrente, modale o no e trascinabile, con parametri, così la stessa finestra serve per la pompa 1 e per la pompa 2."
        en: "Windows: a page opens over the current one, modal or not and draggable, with parameters, so the same window serves pump 1 and pump 2."
      - it: "Cornici di pagina: testata e piede comuni a più pagine, con data e ora, titolo e navigazione, e l'editor ne propone una. «Cambia risoluzione» porta il progetto a un'altra misura senza deformarlo."
        en: "Page frames: a header and footer shared by many pages, with date and time, title and navigation, and the editor offers one. «Change resolution» moves the project to another size without distorting it."
      - it: "Simboli SCADA 2.5D: 138 disegni con parti vive (lancette, leve, livelli, giranti), colori di stato e dei materiali da Progetto → Stile; un simbolo può anche comandare come un bottone."
        en: "2.5D SCADA symbols: 138 drawings with live parts (needles, levers, levels, impellers), state and material colours from Project → Style; a symbol can also command like a button."
      - it: "Tubi 2.5D (metallo, inox, coibentato, PVC, flessibile, aria, cavo, segnale) con flange e raccordi: si agganciano alle bocche di pompe e serbatoi, le seguono e si vedono anche sul pannello."
        en: "2.5D pipes (metal, stainless, insulated, PVC, flexible, air, cable, signal) with flanges and fittings: they snap to pump and tank ports, follow them and also show on the panel."
      - it: "Testi: nuovo oggetto Data e ora, e sei font uguali su web e pannello (Sans, Mono, Serif, display a 7 e 14 segmenti, matrice di punti), con il grassetto vero anche sul pannello."
        en: "Text: a new Date and time object, and six fonts that look the same on web and panel (Sans, Mono, Serif, 7- and 14-segment displays, dot matrix), with real bold on the panel too."
      - it: "Trend: anche sul pannello vanno a schermo intero, con 1 h, 8 h, 24 h e 7 giorni; il CSV dello storico del pannello si scarica dall'IDE collegato; la parte recente del grafico non oscilla più."
        en: "Trends: on the panel too they go full screen, with 1 h, 8 h, 24 h and 7 days; the panel's history CSV downloads from the connected IDE; the recent part of the chart no longer wobbles."
      - it: "Pannello: lo schermo segue la misura di ogni pagina, centrata, senza fasce né barre di scorrimento; i bottoni seguono la loro modalità e un tag di testo «on» accende un simbolo come nel browser."
        en: "Panel: the screen follows each page's size, centred, without bands or scrollbars; buttons follow their mode and a text tag «on» lights a symbol as in the browser."
      - it: "Deploy più sicuro: avvisa dei simboli che il pannello non conosce, non perde pagine né manda la versione vecchia, e lo schermo del pannello si aggiorna da solo anche quando cambiano gli utenti."
        en: "Safer deploy: it warns about symbols the panel does not know, loses no pages and never sends the old version, and the panel screen refreshes by itself even when the users change."
      - it: "IDE: con un pannello collegato il suo log arriva in quello dell'IDE col nome del dispositivo; le scorciatoie da tastiera si cambiano nelle Preferenze; Strumenti in dieci gruppi, con un filtro."
        en: "IDE: with a panel connected, its log arrives in the IDE's log with the device name; keyboard shortcuts can be changed in Preferences; Tools in ten groups, with a filter."
      - it: "Variabili: nuovo tipo «color» e bottoni che assegnano più variabili in un tocco; un intero resta intero; un salvataggio rifiutato ora lo dice; il viewer non perde il login ricaricando la pagina."
        en: "Variables: a new «color» type and buttons that assign several variables in one tap; an integer stays an integer; a rejected save now says so; the viewer keeps its login on page reload."
      - it: "Sicurezza: OPC UA si fida del certificato al primo contatto e si ferma se cambia; le metriche chiedono l'accesso; intestazioni di sicurezza, iframe solo dai siti dichiarati e limiti alle richieste."
        en: "Security: OPC UA trusts the certificate on first contact and stops if it changes; metrics require access; security headers, iframes only from declared sites, and request limits."
      - it: "Git anche nel cloud e sui pannelli, con una chiave per progetto da registrare come deploy key; la console mostra versione e data di build, e avvisa se la pagina del browser è più vecchia del servizio."
        en: "Git in the cloud and on panels too, with a key per project to register as a deploy key; the console shows version and build date, and warns if the browser page is older than the service."
    compatibilita:
      - it: "L'IDE adesso chiede le credenziali. Al primo avvio il servizio stampa nei log un codice di primo accesso: incollalo nell'IDE per creare l'amministratore. Sui pannelli non cambia nulla."
        en: "The IDE now asks for credentials. At first start the service prints a first-access code in its log: paste it into the IDE to create the administrator. Nothing changes on panels."
      - it: "Un pannello senza utenti ora resta chiuso e mostra un codice di abbinamento (schermo, pagina e log): inseriscilo in «Connetti» dell'IDE, o nella pagina del pannello, per crearne l'amministratore."
        en: "A panel without users now stays closed and shows a pairing code (screen, page and log): enter it in the IDE's «Connect», or on the panel's page, to create its administrator."
      - it: "Un pannello nuovo collegato a internet si abbina dal cloud: inserisci il suo codice in «Abbina un pannello» e lo raggiungi anche dietro NAT. Per non farlo chiamare fuori: install-container.sh --senza-cloud."
        en: "A new panel connected to the internet can be paired from the cloud: enter its code in «Pair a panel» and reach it even behind NAT. To keep it from calling out: install-container.sh --senza-cloud."
      - it: "Dal cloud basta il codice: gli utenti del pannello arrivano col primo progetto, che deve portarne almeno uno Admin. Dopo l'abbinamento vedi il riepilogo del pannello e puoi rinominarlo."
        en: "From the cloud the code is enough: the panel's users arrive with the first project, which must bring at least one Admin. After pairing you see the panel summary and can rename it."
      - it: "I simboli dei sinottici esistenti cambiano aspetto: prendono il disegno 2.5D della libreria, con le loro proporzioni dentro il riquadro di prima. «Adatta le proporzioni» nel pannello proprietà sistema il riquadro."
        en: "Symbols in existing synoptics change look: they take the library's 2.5D drawing, with its proportions inside the old box. «Fit the box to the drawing» in the properties panel adjusts the box."
      - it: "Sul pannello i testi con un font scelto o in grassetto ora si vedono come nel browser: controlla che stiano ancora nei loro riquadri."
        en: "On the panel, text with a chosen font or in bold now looks as in the browser: check that it still fits its boxes."

  - versione: "2.13.0"
    voci:
      - it: "Nuovo tipo di variabile «color» e bottoni che assegnano: un tocco può scrivere più variabili, per esempio cambiare il colore di sfondo della pagina."
        en: "New «color» variable type and assigning buttons: one tap can write several variables, for example change the page background colour."
      - it: "Se un salvataggio della configurazione viene rifiutato ora lo dice: prima spariva in silenzio e sembrava riuscito."
        en: "If a configuration save is rejected it now says so: before it vanished silently and looked successful."
      - it: "Una variabile intera resta intera: un generatore d'onda su un tag u8 o i16 non mostra più valori con la virgola."
        en: "An integer variable stays integer: a waveform generator on a u8 or i16 tag no longer shows fractional values."
      - it: "Dopo il log-out si rientra sull'elenco dei progetti, non dentro quello aperto prima: così chi entra non si ritrova il lavoro di qualcun altro."
        en: "After logging out you come back to the project list, not into the project that was open: nobody inherits someone else's work."
      - it: "La console mostra versione, revisione e data di build, e avvisa se la pagina aperta nel browser è più vecchia del servizio."
        en: "The console shows version, revision and build date, and warns if the page open in your browser is older than the service."
      - it: "Lo spazio concordato con l'azienda ora avvisa quando sta finendo e ferma la creazione di nuovi progetti quando è esaurito; quelli aperti continuano a funzionare."
        en: "The space agreed with a company now warns when it is running out and blocks creating new projects when it is full; open projects keep working."
      - it: "Chi amministra un'azienda entra nella console e vede solo la sua: le sue persone, il suo marchio e le risorse che ha concordato."
        en: "A company administrator can open the console and sees only their own company: its people, its brand and the resources it agreed on."
      - it: "La console si apre su un sinottico delle risorse: quanto spazio usa ogni azienda, diviso fra progetti e storico, e quante sono vicine al limite."
        en: "The console opens on a resource overview: how much space each company uses, split between projects and history, and which are close to the limit."
      - it: "Ogni azienda può avere progetti con lo stesso nome di un'altra: i progetti ora si indirizzano per azienda, e chi non ne fa parte non li raggiunge."
        en: "Each company can have projects with the same name as another: projects are now addressed per company, and non-members cannot reach them."
      - it: "Nella console il pannello di un utente si salva con un pulsante: nome, ruolo, aziende e password si cambiano insieme, e si vede quando ci sono modifiche in sospeso."
        en: "In the console a user's panel is saved with a button: name, role, companies and password change together, and pending changes are visible."
      - it: "L'elenco dei progetti si vede a icone come in un file browser, con un interruttore per tornare alla lista di prima."
        en: "The project list is shown as icons like a file browser, with a switch to go back to the previous list."
      - it: "Una barra sopra l'elenco dei progetti dice chi sei e per quale azienda, e da lì si raggiungono la console di amministrazione, il cambio password e l'uscita."
        en: "A bar above the project list shows who you are and for which company, and from there you reach the administration console, the password change and the logout."
      - it: "Ogni azienda vede solo i propri progetti. Chi amministra la piattaforma li vede tutti, in una sezione a parte e contrassegnati."
        en: "Each company sees only its own projects. Platform administrators see them all, in a separate marked section."
      - it: "Cambiare la propria password non chiude più la sessione in corso: restano chiuse le altre, che la vecchia password poteva aprire."
        en: "Changing your own password no longer ends your current session: the other ones still close, since the old password could open them."
      - it: "L'IDE ha i suoi utenti: si entra con email e password, distinti dagli utenti del progetto che viaggiano col deploy e proteggono l'impianto."
        en: "The IDE has its own users: you log in with email and password, separate from the project users that travel with the deploy and protect the plant."
    compatibilita:
      - it: "L'IDE adesso chiede le credenziali. Al primo avvio il servizio stampa nei log un codice di primo accesso: incollalo nell'IDE per creare l'amministratore. Sui pannelli non cambia nulla."
        en: "The IDE now asks for credentials. At first start the service prints a first-access code in its log: paste it into the IDE to create the administrator. Nothing changes on panels."
      - it: "Un pannello senza utenti ora resta chiuso e mostra un codice di abbinamento (schermo, pagina e log): inseriscilo in «Connetti» dell'IDE, o nella pagina del pannello, per crearne l'amministratore."
        en: "A panel without users now stays closed and shows a pairing code (screen, page and log): enter it in the IDE's «Connect», or on the panel's page, to create its administrator."
      - it: "Un pannello nuovo collegato a internet si abbina dal cloud: inserisci il suo codice in «Abbina un pannello» e lo raggiungi anche dietro NAT. Per non farlo chiamare fuori: install-container.sh --senza-cloud."
        en: "A new panel connected to the internet can be paired from the cloud: enter its code in «Pair a panel» and reach it even behind NAT. To keep it from calling out: install-container.sh --senza-cloud."
      - it: "Dal cloud basta il codice: gli utenti del pannello arrivano col primo progetto, che deve portarne almeno uno Admin. Dopo l'abbinamento vedi il riepilogo del pannello e puoi rinominarlo."
        en: "From the cloud the code is enough: the panel's users arrive with the first project, which must bring at least one Admin. After pairing you see the panel summary and can rename it."

  - versione: "2.12.0"
    voci:
      - it: "Il runtime si aggiorna dall'IDE o dal pannello: canale stabile o di prova, «Aggiorna ora», una finestra programmata o il pilota automatico. Se la versione nuova non parte, torna da solo alla precedente."
        en: "The runtime updates from the IDE or from the panel: stable or test channel, «Update now», a scheduled window or autopilot. If the new version does not start, it goes back to the previous one by itself."
      - it: "Prima di aggiornare si leggono le novità e gli avvisi di compatibilità; sul pannello senza utenti compare un avviso a schermo; il pannello sa aggiornare da sé la propria configurazione del servizio."
        en: "Before updating you can read what is new and the compatibility warnings; on a panel without users a notice appears on screen; the panel can update its own service configuration."
      - it: "Dopo un aggiornamento il pannello dice com'è andato (anche su Telegram) e chiede di confermarlo: finché non lo fai si torna alla versione di prima, dati compresi; confermando si libera spazio."
        en: "After an update the panel says how it went (also on Telegram) and asks you to confirm it: until you do, you can go back to the previous version, data included; confirming frees space."
      - it: "Email come Telegram: destinatari di progetto con la loro lingua, una tabella che sceglie quali eventi escono su quale canale, e un pulsante che prova il server di posta e dice cosa non va."
        en: "Email works like Telegram: project recipients with their own language, a table that chooses which events go out on which channel, and a button that tests the mail server and says what is wrong."
      - it: "Git nel progetto: storia e differenze, prova di un commit vecchio, fork di un progetto, invio a GitHub."
        en: "Git in the project: history and diffs, trying an old commit, forking a project, pushing to GitHub."
      - it: "Pannello delle proprietà a un solo livello; ogni campo dice il valore vero o perché è vuoto. Sul pannello LVGL sfondi, colori, barre e tabelle come sul web, con ordinamento, filtri e celle scrivibili."
        en: "Single-level property panel; every field shows its real value or why it is empty. On LVGL panels backgrounds, colours, bar charts and tables match the web, with sorting, filters and writable cells."
      - it: "Trasparenza e luminosità su tutti gli oggetti, anche legate a una variabile; lampeggio sfumato; polilinee, poligoni e stelle. Sui pannelli LVGL anche rotazione, specchio e il trend completo."
        en: "Opacity and brightness on every object, also bound to a tag; fading blink; polylines, polygons and stars. On LVGL panels also rotation, mirroring and the full trend."
      - it: "Deploy su comando, con «Invia ora» e «Utenti e segreti»; chiede conferma prima di sostituire sul pannello un progetto con un altro nome. Nella scheda Tipi, «Crea istanza»."
        en: "Deploy on demand, with «Send now» and «Users and secrets»; it asks before replacing a project with another name on the panel. In the Types tab, «Create instance»."
      - it: "Lo storico registra solo le variabili con lo storico attivo e occupa metà spazio; «Pulisci storico» toglie le ripetizioni. I backup automatici non copiano più lo storico, quelli a mano sì."
        en: "History records only tags with history enabled and takes half the space; «Clean history» removes repetitions. Automatic backups no longer copy history, manual ones do."
      - it: "Un deploy non fa più ripartire gli allarmi attivi; le sorgenti dei protocolli riconnettono da sole dopo un guasto."
        en: "A deploy no longer re-triggers active alarms; protocol sources reconnect by themselves after a failure."
      - it: "L'immagine di accensione del pannello arriva al launcher Pixsys, e si può tornare a quella di fabbrica dall'IDE."
        en: "The panel's start-up image reaches the Pixsys launcher, and the factory image can be restored from the IDE."
      - it: "Modbus a bus e dispositivi con pallino di stato, porte seriali scelte dal pannello, dispositivi Pixsys dal catalogo. Variabili: strutture, array, formati, rinomina, CSV."
        en: "Modbus as bus and devices with status dot, serial ports picked from the panel, Pixsys devices from the catalog. Tags: structures, arrays, formats, rename, CSV."
      - it: "Il passaggio fra schermo web e LVGL lo fa il runtime del pannello, senza pezzi installati sul sistema; com'è andata si vede nella scheda Connessione."
        en: "Switching the screen between web and LVGL is done by the panel runtime, with nothing installed on the system; the outcome shows in the Connection tab."
      - it: "La Configurazione è un albero; i progetti grandi si aprono in fretta; scegliendo la dimensione di una pagina ci sono tutti i pannelli Pixsys, WebPanel e TouchController."
        en: "Configuration is a tree; large projects open quickly; setting a page size now offers every Pixsys panel, WebPanel and TouchController."
      - it: "Le password del progetto stanno in un file a parte e non compaiono più nei log."
        en: "Project passwords live in a separate file and no longer show up in logs."
    compatibilita:
      - it: "I valori dei protocolli prendono il tipo dichiarato: un tag dichiarato numero che riceve un booleano o un testo diventa Bad. Correggere il tipo nella scheda Variabili."
        en: "Protocol values now take the declared type: a tag declared as a number that receives a boolean or text turns Bad. Fix the type in the Tags tab."
      - it: "Un pannello con una versione precedente alla 2.12.0-rc.1 non si aggiorna da solo: va aggiornato una volta da Configurazione → Istanza → Device → Installazione."
        en: "A panel running a version older than 2.12.0-rc.1 cannot update itself: update it once from Configuration → Instance → Device → Install."
      - it: "Dopo l'aggiornamento il pannello chiede di aggiornare la configurazione del servizio («Aggiorna»): si riavvia una seconda volta. Installato prima del 27-09-2026: reinstallare dall'Installazione."
        en: "After the update the panel asks to update its service configuration («Update»): it restarts a second time. Installed before 27-09-2026: reinstall from Install."
      - it: "Tornare alla versione precedente con i suoi dati vale dagli aggiornamenti successivi a questo: per questo, il ritorno riporta solo l'immagine."
        en: "Going back to the previous version with its data works from the updates after this one: for this one, going back only restores the image."
