name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ── DCO check ─────────────────────────────────────────────────────────────
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: tisonkun/action-dco@v1

  # ── Rust lint ─────────────────────────────────────────────────────────────
  #
  # La toolchain è pinnata alla versione delle macchine di sviluppo, non alla
  # MSRV: `cargo fmt --check` deve dare lo stesso verdetto qui e in locale, e
  # rustfmt cambia leggermente fra una versione e l'altra. La MSRV vera è in
  # `Cargo.toml` (`rust-version`), e cargo la fa rispettare da sé.
  #
  # Storia: era "1.75" (dicembre 2023) ed è rimasta lì mentre le dipendenze
  # salivano; dal 2026-09 il lockfile è in formato 4 (serve cargo ≥ 1.78) e
  # `time`/`icu` vogliono ≥ 1.88. Risultato: i quattro job Rust morivano in
  # tredici secondi senza compilare niente, «exit code 101», e nessuno leggeva
  # il perché. Scoperto il 2026-09-09 dalla mail di GitHub sul push della 2.7.0.
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v5
      # Il workspace comprende `sws-lvgl-viewer`, che linka SDL2, libdrm e
      # FreeType di sistema e genera i binding libdrm con bindgen (libclang);
      # `sws-web` incorpora Python (pyo3). Sono i prerequisiti del README:
      # senza, `cargo clippy` muore nel build script del viewer prima di
      # guardare una riga di Rust — «exit code 101» e un registro che dice
      # solo «manca libdrm-dev?». Visto il 2026-09-09, al primo giro in cui la
      # toolchain era abbastanza nuova per arrivarci.
      - name: Librerie di sistema (prerequisiti del README)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libsdl2-dev libdrm-dev libfreetype-dev python3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  # ── Rust build + test ─────────────────────────────────────────────────────
  rust-build-test:
    name: Rust build & test
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v5
      # Il workspace comprende `sws-lvgl-viewer`, che linka SDL2, libdrm e
      # FreeType di sistema e genera i binding libdrm con bindgen (libclang);
      # `sws-web` incorpora Python (pyo3). Sono i prerequisiti del README:
      # senza, `cargo clippy` muore nel build script del viewer prima di
      # guardare una riga di Rust — «exit code 101» e un registro che dice
      # solo «manca libdrm-dev?». Visto il 2026-09-09, al primo giro in cui la
      # toolchain era abbastanza nuova per arrivarci.
      - name: Librerie di sistema (prerequisiti del README)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libsdl2-dev libdrm-dev libfreetype-dev python3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - run: cargo build --release
      - run: cargo test --workspace

  # ── Rust dependency audit ─────────────────────────────────────────────────
  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      # 0.21 non legge più il database degli avvisi: dal 2026 le voci portano
      # punteggi CVSS 4.0 e la 0.21 si ferma con «unsupported CVSS version»
      # prima di guardare una sola dipendenza (visto il 2026-09-09, sul push
      # della 2.7.0). La 0.22 li legge. Le vulnerabilità che non possiamo
      # correggere sono dichiarate una per una in `sws-runtime/.cargo/audit.toml`.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version "0.22.2" --locked
      - run: cargo audit

  # ── Rust SBOM ─────────────────────────────────────────────────────────────
  rust-sbom:
    name: Rust SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: rust-build-test
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      # Versione pinnata: senza, `cargo install` prende l'ultima e il passo
      # dopo eredita un'interfaccia che nessuno ha provato. È successo il
      # 2026-09-09, la prima volta che questo job è partito: `--output-file`
      # non esiste nella 0.5 (c'è `--override-filename`), e il job è morto.
      # La 0.5.9 scrive un `sbom.json` accanto al Cargo.toml di OGNI crate del
      # workspace, anche con --manifest-path: l'artefatto li raccoglie tutti.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version "0.5.9" --locked
      - run: cargo cyclonedx --format json --override-filename sbom
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-runtime
          path: sws-runtime/crates/*/sbom.json

  # ── TypeScript lint ───────────────────────────────────────────────────────
  ts-lint:
    name: TS lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  # ── TypeScript build + test ───────────────────────────────────────────────
  ts-build-test:
    name: TS build & test
    runs-on: ubuntu-latest
    needs: ts-lint
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ── Node dependency audit ─────────────────────────────────────────────────
  ts-audit:
    name: Node audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical

  # ── Il job `docker-build` è stato rimosso il 2026-09-02 ───────────────────
  #
  # Costruiva e scansionava con trivy le due immagini **legacy**
  # (`sws-runtime/docker/Dockerfile`, `sws-editor/docker/Dockerfile`), che sono
  # state cancellate insieme al resto di quel percorso: pubblicava all'indirizzo
  # che il README promette un'immagine che non parte. Era già disattivato con
  # `if: false` dal 2026-07-30 per quella ragione.
  #
  # La struttura (login ghcr, setup-qemu, setup-buildx, build-push, trivy,
  # upload-sarif) resta **recuperabile da git**: `git show 381078d:.github/workflows/ci.yml`
  # la contiene per intero. Va ripescata da lì quando la build dell'immagine
  # buona (`deploy/container/Containerfile.*`) sarà riproducibile in CI — oggi
  # non è, perché quella copia dentro un binario cross-compilato con l'SDK Yocto
  # Pixsys, che sui runner GitHub non esiste. Fino ad allora la pubblicazione è
  # un `podman push` manuale dalla macchina che ha l'SDK, come descritto in
  # `docs/DEPLOY_CONTAINER_AARCH64.md`.
