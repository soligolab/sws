name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ── DCO check ─────────────────────────────────────────────────────────────
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: tisonkun/action-dco@v1

  # ── Rust lint ─────────────────────────────────────────────────────────────
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  # ── Rust build + test ─────────────────────────────────────────────────────
  rust-build-test:
    name: Rust build & test
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - run: cargo build --release
      - run: cargo test --workspace

  # ── Rust dependency audit ─────────────────────────────────────────────────
  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - name: Install cargo-audit
        run: cargo install cargo-audit --version "0.21.0"
      - run: cargo audit

  # ── Rust SBOM ─────────────────────────────────────────────────────────────
  rust-sbom:
    name: Rust SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: rust-build-test
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-runtime
          path: sws-runtime/sbom.cdx.json

  # ── TypeScript lint ───────────────────────────────────────────────────────
  ts-lint:
    name: TS lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  # ── TypeScript build + test ───────────────────────────────────────────────
  ts-build-test:
    name: TS build & test
    runs-on: ubuntu-latest
    needs: ts-lint
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ── Node dependency audit ─────────────────────────────────────────────────
  ts-audit:
    name: Node audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # ── Multi-arch container build (tags only) ────────────────────────────────
  docker-build:
    name: Docker multi-arch build
    runs-on: ubuntu-latest
    needs: [rust-build-test, ts-build-test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: sws-runtime
          file: sws-runtime/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/soligolab/sws-runtime:${{ github.ref_name }}
      - name: Build and push editor image
        uses: docker/build-push-action@v5
        with:
          context: sws-editor
          file: sws-editor/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/soligolab/sws-editor:${{ github.ref_name }}
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/soligolab/sws-runtime:${{ github.ref_name }}
          format: sarif
          output: trivy-runtime.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan editor image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/soligolab/sws-editor:${{ github.ref_name }}
          format: sarif
          output: trivy-editor.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "."
