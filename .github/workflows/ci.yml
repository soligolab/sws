name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ── DCO check ─────────────────────────────────────────────────────────────
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: tisonkun/action-dco@v1

  # ── Rust lint ─────────────────────────────────────────────────────────────
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  # ── Rust build + test ─────────────────────────────────────────────────────
  rust-build-test:
    name: Rust build & test
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - run: cargo build --release
      - run: cargo test --workspace

  # ── Rust dependency audit ─────────────────────────────────────────────────
  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - name: Install cargo-audit
        run: cargo install cargo-audit --version "0.21.0" --locked
      - run: cargo audit

  # ── Rust SBOM ─────────────────────────────────────────────────────────────
  rust-sbom:
    name: Rust SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: rust-build-test
    defaults:
      run:
        working-directory: sws-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sws-runtime
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-runtime
          path: sws-runtime/sbom.cdx.json

  # ── TypeScript lint ───────────────────────────────────────────────────────
  ts-lint:
    name: TS lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  # ── TypeScript build + test ───────────────────────────────────────────────
  ts-build-test:
    name: TS build & test
    runs-on: ubuntu-latest
    needs: ts-lint
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ── Node dependency audit ─────────────────────────────────────────────────
  ts-audit:
    name: Node audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sws-editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: sws-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical

  # ── Il job `docker-build` è stato rimosso il 2026-09-02 ───────────────────
  #
  # Costruiva e scansionava con trivy le due immagini **legacy**
  # (`sws-runtime/docker/Dockerfile`, `sws-editor/docker/Dockerfile`), che sono
  # state cancellate insieme al resto di quel percorso: pubblicava all'indirizzo
  # che il README promette un'immagine che non parte. Era già disattivato con
  # `if: false` dal 2026-07-30 per quella ragione.
  #
  # La struttura (login ghcr, setup-qemu, setup-buildx, build-push, trivy,
  # upload-sarif) resta **recuperabile da git**: `git show 381078d:.github/workflows/ci.yml`
  # la contiene per intero. Va ripescata da lì quando la build dell'immagine
  # buona (`deploy/container/Containerfile.*`) sarà riproducibile in CI — oggi
  # non è, perché quella copia dentro un binario cross-compilato con l'SDK Yocto
  # Pixsys, che sui runner GitHub non esiste. Fino ad allora la pubblicazione è
  # un `podman push` manuale dalla macchina che ha l'SDK, come descritto in
  # `docs/DEPLOY_CONTAINER_AARCH64.md`.
